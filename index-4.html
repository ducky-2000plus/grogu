function normalize(){
  st.stats=Object.assign(clone(DEFAULT.stats),st.stats||{});
  st.week=Object.assign(clone(DEFAULT.week),st.week||{});
  if(!st.prog||typeof st.prog!=="object")st.prog={};
  if(st.scores){Object.entries(st.scores).forEach(([k,v])=>{if(st.prog[k]==null)st.prog[k]=Math.round(v/100*QTOTAL);});delete st.scores;}
  if(!Array.isArray(st.claimed))st.claimed=[];
  if(!Array.isArray(st.assigned))st.assigned=[];
  if(!st.due||typeof st.due!=="object")st.due={};
  if(typeof st.bestStreak!=="number")st.bestStreak=st.streak||0;
  if(st.streak>st.bestStreak)st.bestStreak=st.streak;
  if(st.lang&&I18N[st.lang])LANG=st.lang;
  if(DEVICE_CONTRAST)st.contrast=DEVICE_CONTRAST;   /* the device-wide choice wins */
  applyLang();applyContrast();
  if(!Array.isArray(st.owned)||!st.owned.length)st.owned=["aurora"];
  if(!Array.isArray(st.badges))st.badges=[];
  const t=todayStr();
  if(st.lastDay!==t){
    const y=daysAgo(1);
    if(st.lastDay!==y&&st.lastDay!==null)st.streak=0;
  }
}
async function loadAccounts(){
  try{const r=await STORE.get(AKEY);if(r&&r.value)ACC=JSON.parse(r.value);}catch(e){}
  if(!ACC||!Array.isArray(ACC.list)||!ACC.list.length){          /* carry over anything saved under an earlier name */
    for(const pre of LEGACY){
      try{
        const old=await STORE.get(pre+":accounts:v1");
        const o=old&&old.value?JSON.parse(old.value):null;
        if(!o||!Array.isArray(o.list)||!o.list.length)continue;
        for(const a of o.list){
          try{const s0=await STORE.get(pre+":acct:"+a.id);
            if(s0&&s0.value)await STORE.set(acctKey(a.id),s0.value);}catch(e){}
        }
        ACC=o;await saveAccounts();break;
      }catch(e){}
    }
  }
  if(!ACC||!Array.isArray(ACC.list))ACC={list:[],active:null};
  ACC.list.forEach(a=>{if(!a.role)a.role="kid";if(!Array.isArray(a.kids))a.kids=[];});
  if(ACC.pin){delete ACC.pin;saveAccounts();}
}

  let last=Date.now();

  ["click","keydown","scroll","touchstart"].forEach(e=>window.addEventListener(e,bump,{passive:true}));
  idleTimer=setInterval(()=>{
    if(!isAdult(roleOf()))return clearInterval(idleTimer);

  },20000);
}

function tick(el,to,dur){
  if(!el)return; const from=Number(String(el.textContent).replace(/[^0-9.-]/g,""))||0;

  if(RM()||from===to){el.textContent=to;return;}

/* The mastery wheel: 12 facets that fill and brighten with the score */
function wheel(score,opts){
  opts=opts||{};
  const cols=themeColors(),filled=Math.round(score/100*12),rot=opts.rot||0;
  const from=opts.from==null?filled:opts.from;
  let p="";
  for(let i=0;i<12;i++){
    const a0=(i*30-90+1)*Math.PI/180,a1=(i*30-60-1)*Math.PI/180,r=46;
    const x0=50+r*Math.cos(a0),y0=50+r*Math.sin(a0),x1=50+r*Math.cos(a1),y1=50+r*Math.sin(a1);
    const on=i<filled, fresh=on&&i>=from;
    p+=`<path d="M50 50 L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z"
      fill="${cols[i%cols.length]}" opacity="${on?.92:.11}"
      style="${fresh?`animation:facetPop .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:${(i-from)*90}ms`:""}"
      stroke="${on?"rgba(27,16,66,.55)":"rgba(140,120,200,.4)"}" stroke-width="1.4"/>`;
  }
  return `<svg viewBox="0 0 100 100" role="img" aria-label="Mastery wheel, ${Math.round(score)} out of 100"
    style="transform:rotate(${rot}deg);transition:transform .5s cubic-bezier(.2,1.3,.4,1)">
    ${p}<circle cx="50" cy="50" r="17" fill="var(--card)" stroke="rgba(27,16,66,.5)" stroke-width="2"/></svg>`;
}

function wireSections(){
  if(io1)io1.disconnect(); if(io2)io2.disconnect();
  io1=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("shown");io1.unobserve(e.target);}}),{rootMargin:"-40px 0px -12% 0px"});
  document.querySelectorAll(".reveal").forEach(el=>{
    if(RM()||el.getBoundingClientRect().top<window.innerHeight*.9)el.classList.add("shown");
    else io1.observe(el);
  });
  spy();
  window.removeEventListener("scroll",onScroll);
  window.addEventListener("scroll",onScroll,{passive:true});
}

function lockedFor(a){
  if(!a||!a.lockUntil)return 0;

async function noteFail(a,msg){
  a.fails=(a.fails||0)+1;

  await saveAccounts();
  gate.err=msg+(a.fails>=3?" Locked for "+Math.ceil(failWait(a.fails)/1000)+"s.":" "+(3-a.fails)+" tries before a wait.");
  render();shakePin();

async function gateSignIn(){
  const a=ACC.list.find(x=>x.id===gate.pick);if(!a||gate.busy)return;
  if(lockedFor(a)){gate.err="Too many tries. Wait "+lockedFor(a)+"s.";return render();}
  const pw=($("#pw")||{}).value||"";
  gate.busy=true;gate.err="Checking…";render();
  const ok=await verifyAuth(a.auth,pw);
  gate.busy=false;
  if(!ok)return noteFail(a,"That password does not match.");
  a.fails=0;delete a.lockUntil;await saveAccounts();
  gate.pick=null;gate.err="";gate.mode="list";
  switchAccount(a.id,true);
}
async function gateUpgrade(){
  const a=ACC.list.find(x=>x.id===gate.pick);if(!a||gate.busy)return;
  if(lockedFor(a)){gate.err="Too many tries. Wait "+lockedFor(a)+"s.";return render();}
  if(a.pinh){
    const pin=($("#oldpin")||{}).value||"";
    if(pinHash(pin)!==a.pinh)return noteFail(a,"That PIN does not match.");
  }
  const mail=(($("#email")||{}).value||"").trim().toLowerCase();
  const pw=($("#pw")||{}).value||"", pw2=($("#pw2")||{}).value||"";
  if(!EMAIL_RE.test(mail)){gate.err="That email address does not look right.";return render();}
  if(emailTaken(mail,a.id)){gate.err="Another profile already uses that email.";return render();}
  const bad=pwProblem(pw);
  if(bad){gate.err=bad;return render();}
  if(pw!==pw2){gate.err="The two passwords do not match.";return render();}
  gate.busy=true;gate.err="Securing…";render();
  const code=makeRecoveryCode();
  a.email=mail;a.auth=await makeAuth(pw);a.rec=await makeAuth(code);
  delete a.pinh;a.fails=0;delete a.lockUntil;
  await saveAccounts();
  gate.busy=false;gate.code=code;gate.mode="recovery";gate.err="";render();
}
async function gateForgot(){
  const a=ACC.list.find(x=>x.id===gate.pick);if(!a||gate.busy)return;

  const pw=($("#pw")||{}).value||"", pw2=($("#pw2")||{}).value||"";
  const bad=pwProblem(pw);
  if(bad){gate.err=bad;return render();}
  if(pw!==pw2){gate.err="The two passwords do not match.";return render();}
  gate.busy=true;gate.err="Checking the code…";render();
  const ok=await verifyAuth(a.rec,code);
  gate.busy=false;
  if(!ok)return noteFail(a,"That recovery code does not match.");
  a.auth=await makeAuth(pw);a.fails=0;delete a.lockUntil;
  const fresh=makeRecoveryCode();a.rec=await makeAuth(fresh);

  gate.code=fresh;gate.mode="recovery";gate.err="";render();

}

let ADMIN={open:false,asking:false,tab:"roster",sel:null,q:"",target:"all",busy:false,expires:0,timer:null};
const IDLE_MS=180000;                       /* the console locks itself after 3 quiet minutes */
/* ---------- credentials ----------
   PBKDF2-SHA256 over a per-profile random salt. The password is never stored,
   only the derived hash, so reading the saved data does not reveal it. */
const ITERS=150000;
const B64=buf=>btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));
const randB64=n=>{const a=new Uint8Array(n);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.floor(Math.random()*256));return B64(a);};
const CRYPTO_OK=!!(window.crypto&&window.crypto.subtle&&window.isSecureContext);
async function derive(pw,saltB64,iters){
  if(!CRYPTO_OK)return "weak:"+pinHash(saltB64+"|"+pw);          /* only if WebCrypto is unavailable */
  const salt=Uint8Array.from(atob(saltB64),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:iters,hash:"SHA-256"},key,256);
  return "pbkdf2:"+B64(bits);
}
async function makeAuth(pw){const salt=randB64(16);return {salt,iters:ITERS,hash:await derive(pw,salt,ITERS),v:1};}
async function verifyAuth(rec,pw){
  if(!rec||!rec.hash)return false;
  const h=await derive(pw,rec.salt,rec.iters||ITERS);
  return h.length===rec.hash.length&&h===rec.hash;
}
const RECCHARS="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function makeRecoveryCode(){
  const a=new Uint8Array(16);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.floor(Math.random()*256));
  const c=[...a].map(x=>RECCHARS[x%RECCHARS.length]).join("");
  return c.slice(0,4)+"-"+c.slice(4,8)+"-"+c.slice(8,12)+"-"+c.slice(12,16);
}
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const emailTaken=(mail,skip)=>ACC.list.some(a=>a.id!==skip&&(a.email||"").toLowerCase()===mail.toLowerCase());
const COMMON=["password","password1","12345678","123456789","qwerty123","letmein1","iloveyou","football","baseball","sunshine","princess","admin123","welcome1","abc12345"];
function pwScore(pw){
  if(!pw)return 0;
  let s=0;
  if(pw.length>=8)s++;
  if(pw.length>=12)s++;
  if(/[a-z]/.test(pw)&&/[A-Z]/.test(pw))s++;
  if(/\d/.test(pw)&&/[^A-Za-z0-9]/.test(pw))s++;
  if(/^\d+$/.test(pw))s=Math.min(s,1);
  if(COMMON.includes(pw.toLowerCase()))s=0;
  return Math.min(4,s);
}
function pwProblem(pw){
  if(!pw||pw.length<8)return "Use at least 8 characters.";
  if(/^\d+$/.test(pw))return "Digits alone are easy to guess — add letters.";
  if(COMMON.includes(pw.toLowerCase()))return "That is one of the most common passwords.";
  return "";
}
const PW_LABEL=()=>[t("pw0"),t("pw1"),t("pw2"),t("pw3"),t("pw4")];
function paintMeter(){
  const el=$("#pw"),m=$("#meter"),l=$("#meterlab");
  if(!el||!m)return;
  const n=pwScore(el.value);
  [...m.children].forEach((c,i)=>{c.className=i<n?"on"+n:"";});
  if(l)l.textContent=el.value?PW_LABEL()[n]:t("meterHint");
}
/* backoff after repeated failures, kept in storage so a reload does not clear it */
function failWait(n){return Math.min(300,Math.pow(2,Math.max(0,n-2)))*1000;}
const SALT="facet/";   /* fixed forever: rehashing on a rename would lock people out */
function pinHash(v){let h=2166136261;const s=SALT+v;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
function hasPin(){return !!ACC.pinh;}
function touchAdmin(){
  ADMIN.expires=Date.now()+IDLE_MS;
  clearInterval(ADMIN.timer);
  ADMIN.timer=setInterval(()=>{
    if(!ADMIN.open)return clearInterval(ADMIN.timer);
    if(Date.now()>ADMIN.expires){lockAdmin();toast("Admin console locked itself");if(view==="home")render();}
  },15000);
}
function lockAdmin(quiet){
  ADMIN.open=false;ADMIN.sel=null;ROSTER=[];
  clearInterval(ADMIN.timer);ADMIN.timer=null;
  if(!quiet&&view==="home"){render();}
}
let ROSTER=[];

async function readProfile(id){
  if(id===ACC.active)return st;
  try{const r=await STORE.get(acctKey(id));if(r&&r.value)return Object.assign(clone(DEFAULT),JSON.parse(r.value));}catch(e){}
  return clone(DEFAULT);
}
async function writeProfile(id,state){
  if(id===ACC.active){st=state;save();hud();return;}
  try{await STORE.set(acctKey(id),JSON.stringify(state));}catch(e){}
  const a=ACC.list.find(x=>x.id===id);
  if(a){a.grade=state.grade;a.avatar=state.avatar;a.xp=state.xp;
    a.mastered=Object.values(state.prog||{}).filter(v=>v>=QTOTAL).length;}
  await saveAccounts();
}
async function loadRoster(){
  touchAdmin();

  ROSTER=[];

  ADMIN.busy=false;

}
const rowStats=s=>{
  const mastered=Object.values(s.prog||{}).filter(v=>v>=QTOTAL).length;
  const started=Object.keys(s.prog||{}).filter(k=>s.prog[k]>0).length;
  const acc=s.asked?Math.round(s.right/s.asked*100):0;
  return {mastered,started,acc,lvl:lvl(s.xp||0)};
};

/* ---- unlocking ---- */
function shakePin(){
  const w=document.querySelector(".gate-card")||document.querySelector(".pinrow input");
  if(w&&!RM()){w.style.animation="none";void w.offsetWidth;w.style.animation="shake .45s ease";setTimeout(()=>w.style.animation="",520);}
}
function coolingDown(){return ACC.lockUntil&&Date.now()<ACC.lockUntil;}
function adminUnlock(){
  if(coolingDown())return toast("Too many tries. Wait "+Math.ceil((ACC.lockUntil-Date.now())/1000)+"s.");
  const v=($("#pin")||{}).value||"";
  if(!hasPin()){
    const c=($("#pin2")||{}).value||"";
    if(!/^\d{4,8}$/.test(v)){shakePin();return toast("Use 4 to 8 digits");}
    if(v!==c){shakePin();return toast("The two PINs do not match");}
    ACC.pinh=pinHash(v);ACC.tries=0;delete ACC.pin;saveAccounts();
    ADMIN.open=true;toast("PIN set — write it down, it cannot be recovered");
  }else if(pinHash(v)===ACC.pinh){
    ACC.tries=0;delete ACC.lockUntil;saveAccounts();ADMIN.open=true;
  }else{
    ACC.tries=(ACC.tries||0)+1;
    if(ACC.tries>=5){ACC.lockUntil=Date.now()+60000;ACC.tries=0;saveAccounts();shakePin();render();go("admin");
      return toast("Too many tries. Locked for a minute.");}
    saveAccounts();shakePin();render();go("admin");
    return toast("That PIN does not match — "+(5-ACC.tries)+" tries left");
  }
  touchAdmin();loadRoster();render();go("admin");
}
function adminLock(){lockAdmin();render();go("admin");}
async function adminForgotPin(){
  const w=prompt("The PIN cannot be recovered. The only way back in is to erase every profile and all progress on this device.\n\nType ERASE to do that, or cancel.");
  if(w!==("ERASE"))return;

async function adminLinkTo(kidId){
  const parents=ACC.list.filter(a=>a.role==="parent");
  if(!parents.length)return toast("No parent profiles yet");
  const names=parents.map((p,i)=>(i+1)+". "+p.name).join("\n");
  const pick=prompt("Link this learner to which parent?\n"+names+"\n\nType a number, or 0 to unlink from all.");
  const n=Number(pick);
  if(isNaN(n))return;
  parents.forEach(p=>{p.kids=(p.kids||[]).filter(x=>x!==kidId);});
  if(n>=1&&n<=parents.length){parents[n-1].kids.push(kidId);toast("Linked to "+parents[n-1].name);}
  else toast("Unlinked");
  await saveAccounts();render();go("roles");
}

function adminClass(){
  const ROSTER=scopeRoster();
  if(!ROSTER.length)return `<div class="empty">No profiles yet, so there is nothing to summarise.</div>`;
  const tot=ROSTER.reduce((a,{s})=>({asked:a.asked+(s.asked||0),right:a.right+(s.right||0),
    mastered:a.mastered+Object.values(s.prog||{}).filter(v=>v>=QTOTAL).length,mins:a.mins+Math.round((s.secs||0)/60)}),{asked:0,right:0,mastered:0,mins:0});
  const acc=tot.asked?Math.round(tot.right/tot.asked*100):0;
  const bySub=SUBJECTS.map(su=>{
    const list=SKILLS.filter(k=>k.sub===su.id);
    const v=ROSTER.reduce((a,{s})=>a+list.reduce((x,k)=>x+((s.prog[k.id]||0)/QTOTAL*100),0)/(list.length||1),0)/ROSTER.length;
    return {su,v};});
  const struggle={};
  ROSTER.forEach(({s})=>Object.entries(s.prog||{}).forEach(([k,v])=>{
    if(v>0&&v<QTOTAL){struggle[k]=struggle[k]||{n:0,sum:0};struggle[k].n++;struggle[k].sum+=v;}}));
  const weak=Object.entries(struggle).sort((a,b)=>(a[1].sum/a[1].n)-(b[1].sum/b[1].n)).slice(0,6);
  return `<div class="cards" style="margin-bottom:22px">
      <div class="stat pop" style="--d:0ms"><div class="k">Profiles</div><div class="v">${ROSTER.length}</div></div>
      <div class="stat pop" style="--d:80ms"><div class="k">Questions answered</div><div class="v">${tot.asked}</div><div class="mono" style="font-size:12px;color:var(--muted)">${acc}% correct</div></div>

          <span class="bar"><i style="width:${v}%;--d:${i*60+100}ms;background:var(${su.c})"></i></span><span class="pct mono">${Math.round(v)}</span></div>`).join("")}
      </div>
      <div class="panel"><h3 class="ph">Skills the group finds hardest</h3>
        ${weak.length?weak.map(([id,d])=>{const k=pickSkill(id);if(!k)return "";

            <span class="bar"><i style="width:${d.sum/d.n/QTOTAL*100}%;background:var(--punch)"></i></span>
            <span class="pct mono">${(d.sum/d.n).toFixed(1)}</span></div>`;}).join("")
          :`<p style="color:var(--muted)">Not enough practice yet to tell.</p>`}
        <p style="color:var(--muted);font-size:13px;margin-top:12px">Average questions completed, out of ${QTOTAL}, among learners who have started the skill.</p>
      </div>
    </div>`;
}

function pickSkill(id){return SKILLS.find(s=>s.id===id);}
function makeQuestion(skill){
  const t=levelOf(skill.id);
  if(!sess)sess={recent:[]};
  if(!sess.recent)sess.recent=[];
  let q=null,best=null,guard=0;
  while(guard++<14){
    const c=G[skill.gen](skill.p,t);
    if(!c||c.skip)continue;
    best=best||c;
    if(!sess.recent.includes(c.q)){q=c;break;}
  }
  q=q||best||G[skill.gen](skill.p,t);
  cleanTraps(q);
  if(q.traps&&!q.opts&&q.traps.length>=2&&Math.random()<0.35){
    /* sometimes ask the same question as multiple choice, using the mistakes as the wrong options */
    q.opts=trapOpts(q.ans,q.traps,[]);
    if(q.opts.length>=3)delete q.input; else delete q.opts;
  }
  if(q.opts){                                    /* never show the same option twice */
    q.opts=[...new Set(q.opts.map(String))];
    if(!q.opts.includes(String(q.ans)))q.opts.push(String(q.ans));
    q.ans=String(q.ans);
  }
  sess.recent.push(q.q);
  if(sess.recent.length>QPL)sess.recent.shift();
  q.tier=t;return q;
}

function norm(v){return String(v).trim().toLowerCase().replace(/[\s$,]/g,"").replace(/^\+/,"").replace(/^0+(?=\d)/,"");}
function correctInput(given,want){
  if(norm(given)===norm(want))return true;
  const gn=Number(norm(given)),wn=Number(norm(want));
  if(!isNaN(gn)&&!isNaN(wn)&&Math.abs(gn-wn)<1e-9)return true;
  const f=s=>{const m=String(s).match(/^(-?\d+)\/(\d+)$/);return m?Number(m[1])/Number(m[2]):NaN;};
  const gf=f(norm(given)),wf=f(norm(want));
  if(!isNaN(gf)&&!isNaN(wf)&&Math.abs(gf-wf)<1e-9)return true;
  if(!isNaN(gf)&&!isNaN(wn)&&Math.abs(gf-wn)<1e-9)return true;
  return false;
}
function answer(idx){
  if(!sess||sess.answered)return;
  const q=sess.q,sk=sess.skill;
  let given,ok;
  if(q.opts){given=q.opts[Number(idx)];ok=given===q.ans;}
  else{const el=$("#ans");given=el?el.value:"";
    if(!given.trim()){toast("Type an answer first.");const w=document.querySelector(".entry");if(w&&!RM()){w.classList.remove("bad");void w.offsetWidth;w.classList.add("bad");}return;}
    ok=correctInput(given,q.ans);
    if(!ok){const w=document.querySelector(".entry");if(w&&!RM()){w.classList.remove("bad");void w.offsetWidth;w.classList.add("bad");}}}
  sess.answered=true;sess.asked++;st.asked++;
  st.secs+=Math.min(180,Math.round((Date.now()-(sess.qt||sess.t0))/1000));sess.qt=Date.now();
  const before=progOf(sk.id), beforeLvl=levelOf(sk.id);
  if(ok){
    sess.right++;st.right++;sess.run++;sess.best=Math.max(sess.best,sess.run);
    st.stats.bestRun=Math.max(st.stats.bestRun||0,sess.run);
    st.prog[sk.id]=Math.min(QTOTAL,before+1);
    addXP(6+q.tier*2+Math.min(6,sess.run));
    st.coins+=2+(sess.run>=5?2:0);
    beep(true);sess.rot+=30;
  }else{
    sess.run=0;
    st.prog[sk.id]=Math.max(0,before-1);
    if(before>=QTOTAL&&st.due&&st.due[sk.id]){        /* a slip on review costs mastery */
      st.prog[sk.id]=QTOTAL-2;
      scheduleReview(sk.id,Math.max(0,(st.due[sk.id].box||0)-1));
    }
    beep(false);
    if(sess.lives!=null){
      sess.lives--;
      const lv=$("#lives");if(lv){lv.textContent="❤️".repeat(sess.lives)||"—";bump(lv);}
      if(sess.lives<=0)sess.dead=true;
    }
  }
  if(ok&&sess.mode==="review"&&progOf(sk.id)>=QTOTAL&&st.due&&st.due[sk.id])
    scheduleReview(sk.id,(st.due[sk.id].box||0)+1);   /* held on to it — push the next review out */
  markDay();noteSubject(sk.sub);award();save();BOARD=null;
  const after=progOf(sk.id), afterLvl=levelOf(sk.id);
  const mastered=before<QTOTAL&&after>=QTOTAL;
  const levelled=!mastered&&afterLvl>beforeLvl;
  if(levelled){burst(40);st.coins+=20;toast(LEVEL_NAME()[afterLvl-1]+" — "+skillName(sk)+" (+20 coins)");}
  if(mastered){burst(80);st.coins+=50;checkWeek();st.week.mastered++;scheduleReview(sk.id,0);
    if(!sess.hintEver)st.stats.noHint=(st.stats.noHint||0)+1;

      ${sess.queue?"":`<button class="btn btn-sm" onclick="go('home')">${t("finishNow")}</button>`}

  const wrap=document.querySelector(".side .kal-wrap");

}
function nextQ(){
  if(!sess)return;
  if(sess.dead)return showResults();
  if(sess.endless){
    if(sess.secsLeft!=null&&sess.secsLeft<=0)return showResults();
    sess.skill=P(gradePool());
  }else if(sess.queue){
    sess.idx++;
    if(sess.idx>=sess.queue.length)return showResults();
    sess.skill=pickSkill(sess.queue[sess.idx]);
  }
  sess.q=makeQuestion(sess.skill);sess.answered=false;sess.hint=false;sess.hintStep=0;

}
function skipQ(){if(!sess)return;if(sess.answered)return nextQ();sess.q=makeQuestion(sess.skill);sess.answered=false;sess.hint=false;sess.hintStep=0;render();}
function useHint(){
  if(!sess||sess.answered)return;
  if(st.coins<5)return toast(t("needCoins"));
  const q=sess.q;
  const steps=hintSteps(q);
  sess.hintStep=sess.hintStep||0;
  if(sess.hintStep>=steps.length)return toast(t("noMoreHints"));
  st.coins-=5;sess.hint=true;sess.hintEver=true;sess.hintStep++;save();hud();
  const shown=steps.slice(0,sess.hintStep);
  $("#hintbox").innerHTML=`<div class="hintbox">${shown.map((h,i)=>`<div style="${i?"margin-top:8px":""}"><b>${t("hintN",{n:i+1})}</b> ${h}</div>`).join("")}
    ${sess.hintStep<steps.length?`<div class="mono" style="font-size:12px;color:var(--muted);margin-top:8px">${t("moreHints",{n:steps.length-sess.hintStep})}</div>`:""}</div>`;
  announce(shown[shown.length-1].replace(/<[^>]+>/g,""));
}
/* a ladder: a nudge, then a method, then the working — never the answer */
function hintSteps(q){
  const out=[];
  if(q.hints&&q.hints.length)out.push(...q.hints.map(esc));
  if(q.opts){
    const wrong=q.opts.filter(o=>o!==q.ans);
    if(wrong.length>1)out.push(t("hintRuleOut",{a:esc(P(wrong))}));
    if(wrong.length>2)out.push(t("hintNarrow",{a:esc(q.ans),b:esc(P(wrong.filter(w=>w!==out[out.length-1])))}));
  }
  const exp=String(q.exp||"").split(/(?<=\.)\s+/).filter(Boolean);
  if(exp.length>1)out.push(esc(exp[0]));
  else if(exp.length===1&&!q.opts)out.push(t("hintMethod"));
  return out.slice(0,3);
}

/* Reads each learner profile's stored state. On a device build that is every
   profile; with the cloud backend the security policies return nothing for
   other people's rows, so the board quietly narrows to you. Either way it is
   real data, never invented. */
async function loadBoard(){
  if(boardBusy)return; boardBusy=true;
  const kids=ACC.list.filter(a=>(a.role||"kid")==="kid");
  const out=[];
  for(const a of kids){
    if(a.id===ACC.active){out.push({id:a.id,n:a.name,em:st.avatar||a.avatar||"🦊",x:weeklyXPfrom(st),you:true});continue;}
    try{
      const raw=await STORE.get("yet:acct:"+a.id);
      const other=JSON.parse(raw.value);
      out.push({id:a.id,n:a.name,em:a.avatar||"🦊",x:weeklyXPfrom(other),you:false});
    }catch(e){ /* not visible to us — leave them off the board */ }
  }
  BOARD=out.sort((x,y)=>y.x-x.x);
  boardBusy=false;
  paintBoard();
}

  const best=Math.max(1,...rows.map(r=>r.x));
  const bestWeek=st.bestWeek||0;
  const podium=rows.slice(0,3);
  const medal=["🥇","🥈","🥉"];

  const board=`
    ${podium.length>=2?`<div class="podium">
      ${[1,0,2].filter(i=>podium[i]).map(i=>{
        const r=podium[i];
        const h=[86,66,52][i];
        return `<div class="pod ${r.you?"you":""} p${i+1}">
          <span class="pod-medal" aria-hidden="true">${medal[i]}</span>
          <span class="pod-face" aria-hidden="true">${r.em}</span>
          <span class="pod-name">${esc(r.n)}${r.you?" &middot; "+t("youWord"):""}</span>
          <div class="pod-block" style="height:${h}px"><b>${num(r.x)}</b><small>${t("xpL")}</small></div>
        </div>`;}).join("")}
    </div>`:""}

    <ul class="boardlist">
      ${rows.map((r,i)=>`<li class="brow ${r.you?"you":""}">
        <span class="brank">${i+1}</span>
        <span class="bface" aria-hidden="true">${r.em}</span>
        <span class="bname">${esc(r.n)}${r.you?` <em>${t("youWord")}</em>`:""}</span>
        <span class="bbar" ${barA11y(r.x/best*100,esc(r.n))}>
          <i style="width:${Math.max(2,Math.round(r.x/best*100))}%"></i></span>
        <span class="bxp">${num(r.x)}<small>${t("xpL")}</small></span>
      </li>`).join("")}
    </ul>
    <p class="hint" style="margin-top:14px">${t("boardReal")}</p>`;

  const lastWeekXP=(()=>{
    let sum=0;
    for(let i=7;i<14;i++){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);
      sum+=(st.days[ymd(d)]||0)*12;}
    return sum;
  })();
  const beaten=weekly>lastWeekXP&&weekly>0;

  const solo=`<div class="panel">
      <div class="podium solo-podium">
        ${lastWeekXP>0?`<div class="pod ghost p2">
          <span class="pod-medal" aria-hidden="true">&nbsp;</span>
          <span class="pod-face" aria-hidden="true">🕗</span>
          <span class="pod-name">${t("lastWeek")}</span>
          <div class="pod-block" style="height:${Math.max(46,Math.round(Math.min(1,lastWeekXP/Math.max(weekly,lastWeekXP,1))*76))}px">
            <b>${num(lastWeekXP)}</b><small>${t("xpL")}</small></div>
        </div>`:""}
        <div class="pod you p1">
          <span class="pod-medal" aria-hidden="true">${beaten?"🏆":"🔥"}</span>
          <span class="pod-face" aria-hidden="true">${st.avatar||"🦊"}</span>
          <span class="pod-name">${t("thisWeek")}</span>
          <div class="pod-block" style="height:${Math.max(46,Math.round(Math.min(1,weekly/Math.max(weekly,lastWeekXP,bestWeek,1))*92))}px">
            <b>${num(weekly)}</b><small>${t("xpL")}</small></div>
        </div>
        ${bestWeek>0&&bestWeek>weekly?`<div class="pod ghost p3">
          <span class="pod-medal" aria-hidden="true">&nbsp;</span>
          <span class="pod-face" aria-hidden="true">⭐</span>
          <span class="pod-name">${t("bestWeek")}</span>
          <div class="pod-block" style="height:${Math.max(46,Math.round(Math.min(1,bestWeek/Math.max(weekly,bestWeek,1))*76))}px">
            <b>${num(bestWeek)}</b><small>${t("xpL")}</small></div>
        </div>`:""}
      </div>

      <p class="streak-note" style="text-align:center;margin:4px 0 20px">
        ${beaten?`<b>${t("beatLastWeek")}</b>`
          :(lastWeekXP>0?t("chaseLastWeek",{n:num(lastWeekXP-weekly)})
          :(weekly>0?t("firstWeekGoing"):t("firstWeekStart")))}</p>

      <div class="strip">${last7().map((d,i)=>{
        const mx=Math.max(1,...last7().map(x=>x.n));
        return `<div class="day"><i title="${d.n} ${t("questions")}"><b style="height:${Math.round(d.n/mx*100)}%;--d:${i*70}ms"></b></i><b>${d.lab}</b></div>`;}).join("")}</div>
      <p class="hint" style="margin-top:16px">${t("boardAlone")}</p>
    </div>`;

  return `<section id="class" class="shell section reveal">
    <div class="section-head"><div><h2>${t("classBoard")}</h2><p>${t("classBlurb")}</p></div>
      ${rows.length>1&&you?`<span class="chip">${t("youAreN",{a:you,b:rows.length})}</span>`:""}</div>
    <div class="rule"></div>
    ${rows.length>1?`<div class="panel">${board}</div>`:solo}
  </section>`;
}
/* ---------- grown-ups report ---------- */
function sectionReport(){
  const acc=st.asked?Math.round(st.right/st.asked*100):0;
  const g=st.grade==="all"?null:st.grade;
  const pool=SKILLS.filter(s=>!g||String(s.grade)===String(g));
  const worked=pool.filter(s=>scoreOf(s.id)>0);
  const strong=worked.slice().sort((a,b)=>scoreOf(b.id)-scoreOf(a.id)).slice(0,5);
  const weak=worked.slice().sort((a,b)=>scoreOf(a.id)-scoreOf(b.id)).slice(0,5);
  const days=last7().filter(d=>d.n).length;
  return `<section id="report" class="shell section reveal">
    <div class="section-head"><div><h2>${t("reportT")}</h2><p>${t("reportBlurb")}</p></div>
      <button class="btn btn-sm btn-aqua" onclick="window.print()">${t("printPage")}</button></div>
    <div class="rule"></div>
    <div class="panel" style="margin-bottom:20px">
      <p style="margin:0;font-size:17px">
        ${st.asked?`Practised on <b>${days}</b> of the last 7 days, answering <b>${st.asked}</b> questions with <b>${acc}%</b> accuracy.
        <b>${masteredCount()}</b> skill${masteredCount()===1?" is":"s are"} fully mastered${g?" in grade "+g:""}, and the current day streak is <b>${st.streak}</b>.`
        :`No practice yet. Pick a grade on the home page and start with today's challenge — five mixed questions takes about four minutes.`}
      </p>
    </div>
    <div class="split">
      <div class="panel"><h3 class="ph">${t("solidGround")}</h3>
        ${strong.length?strong.map(s=>`<div class="mrow" style="margin-bottom:10px"><span>${esc(skillName(s))}</span><span class="bar"><i style="width:${scoreOf(s.id)}%"></i></span><span class="pct mono">${Math.round(scoreOf(s.id))}</span></div>`).join(""):`<p style="color:var(--muted)">Nothing here yet. It fills in after the first few questions.</p>`}
      </div>
      <div class="panel"><h3 class="ph">${t("worthSitting")}</h3>
        ${weak.length?weak.map(s=>`<div class="mrow" style="margin-bottom:10px"><span>${esc(skillName(s))}</span><span class="bar"><i style="width:${scoreOf(s.id)}%;background:var(--punch)"></i></span><span class="pct mono">${Math.round(scoreOf(s.id))}</span></div>`).join(""):`<p style="color:var(--muted)">Nothing flagged yet.</p>`}
      </div>
    </div>
    <div class="panel" style="margin-top:20px"><h3 class="ph">${t("coverage")}</h3>
      <table class="board"><thead><tr><th>${t("subjectC")}</th><th>${t("skillsC")}</th><th>${t("startedC")}</th><th>${t("masteredC")}</th><th>${t("avgScore")}</th></tr></thead><tbody>
      ${SUBJECTS.map(su=>{const l=pool.filter(s=>s.sub===su.id);if(!l.length)return "";
        const startedN=l.filter(s=>scoreOf(s.id)>0).length,mN=l.filter(s=>scoreOf(s.id)>=100).length;
        return `<tr><td>${su.em} ${subjName(su.id)}</td><td class="n">${l.length}</td><td class="n">${startedN}</td><td class="n">${mN}</td><td class="n">${Math.round(subjectMastery(su.id,g))}</td></tr>`;}).join("")}
      </tbody></table>
    </div>
    ${SOLO?"":`<div class="panel" style="margin-top:20px"><h3 class="ph">${t("grownupQ")}</h3>
      <p style="color:var(--muted);margin-bottom:12px">${t("grownupBlurb")}</p>
      <button class="btn btn-sm btn-punch" onclick="go('accounts')">${t("signInGrownup")}</button>
    </div>`}
    <div class="panel" style="margin-top:20px"><h3 class="ph">${t("resetT")}</h3>
      <p style="color:var(--muted);margin-bottom:12px">${t("resetBlurb")}</p>
      <button class="btn btn-sm" onclick="resetAll()">${t("eraseAll")}</button>
    </div>
  </section>`;
}
function resetAll(){
  if(!confirm("Erase all progress on this device? This cannot be undone."))return;
  st=clone(DEFAULT);save();render();window.scrollTo({top:0});toast("Progress erased");
}

/* ============================================================
   8. INPUT + BOOT
   ============================================================ */
function toggleSound(){st.sound=!st.sound;save();hud();toast(st.sound?"Sound on":"Sound off");}
function toggleContrast(){
  st.contrast=st.contrast==="high"?"normal":"high";
  /* Accessibility settings belong to the device, not to an account: someone who
     needs high contrast needs it on the sign-in screen, before they have one. */
  DEVICE_CONTRAST=st.contrast;
  try{STORE.set("yet:contrast",st.contrast);}catch(e){}
  if(ACC.active)save();
  applyContrast();render();
  toast(st.contrast==="high"?t("contrastOn"):t("contrastOff"));
}
function applyContrast(){
  if(st.contrast==="high")document.documentElement.dataset.contrast="high";
  else delete document.documentElement.dataset.contrast;
}
function toggleTheme(){st.night=!st.night;save();hud();}
document.addEventListener("keydown",e=>{
  if(view!=="practice"||!sess)return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(e.key==="Enter"){
    if(sess.answered){e.preventDefault();nextQ();}
    else if(tag==="input"){e.preventDefault();answer(null);}
    return;
  }
  if(tag==="input")return;
  if(/^[1-4]$/.test(e.key)&&sess.q.opts&&!sess.answered){
    const i=Number(e.key)-1;
    if(i<sess.q.opts.length){e.preventDefault();answer(String(i));}
  }
});
(async function boot(){
  await loadAccounts();
  // sanity check: every skill must resolve to a working generator
  const broken=SKILLS.filter(s=>!G[s.gen]||(s.gen==="bank"&&!B[s.p.b]));
  if(broken.length)console.warn("Unmapped skills:",broken.map(s=>s.id));
  if(SOLO&&ACC.active){const a=ACC.list.find(x=>x.id===ACC.active);if(!a||(a.role||"kid")!==BUILD)ACC.active=null;}
  if(ACC.active&&ACC.list.some(a=>a.id===ACC.active)){await loadState(ACC.active);armIdle();}
  else{ACC.active=null;st=clone(DEFAULT);}
  try{const l=await STORE.get("yet:lang");if(l&&l.value&&I18N[l.value])LANG=l.value;}catch(e){}
  try{const c=await STORE.get("yet:contrast");if(c&&c.value){DEVICE_CONTRAST=c.value;st.contrast=c.value;}}catch(e){}
  applyContrast();
  if(st.lang&&I18N[st.lang])LANG=st.lang;
  applyLang();
  if(STORE.kind==="memory")setTimeout(()=>toast(t("noStore")),1400);
  const er=entryRole();
  const wants=r=>r&&!SOLO&&r!==roleOf();      /* already that role? just carry on */
  if(wants(er)){gate.only=er;gate.role=er;checkWeek();hud();view="accounts";render();}
  else{checkWeek();hud();BOARD=null;if(ACC.active)loadBoard();go("home");}
  setTimeout(()=>{booted=true;},600);
  window.addEventListener("hashchange",()=>{
    const r=entryRole();
    if(wants(r))setEntry(r);
  });
})();
</script>
