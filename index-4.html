<meta name="description" content="Free practice for kindergarten to 8th grade. 789 skills, six languages, read aloud.">

<meta property="og:description" content="789 skills across maths, reading, science and more. Free, no ads.">
<meta property="og:type" content="website">
<title>Yet — practice K–8 skills until they click</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Plus+Jakarta+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --ink:#1B1042;
  --paper:#F7F5FF;
  --card:#FFFFFF;
  --punch:#E01A63;
  --zest:#FFC400;--zest-ink:#8A5A00;
  --aqua:#00736B;
  --grape:#7C4DFF;
  --lime:#5FAF2E;
  --muted:#5B4E90;
  --line:rgba(27,16,66,.14);
  --hard:5px 5px 0 rgba(27,16,66,.16);
  --hard-sm:3px 3px 0 rgba(27,16,66,.16);
  --r:18px;
  --display:"Fraunces",Georgia,serif;
  --body:"Plus Jakarta Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
[data-theme="night"]{
  --zest-ink:#FFD24D;
  --ink:#F2EEFF;
  --paper:#150C33;
  --card:#241650;
  --muted:#B7A9EE;
  --line:rgba(242,238,255,.18);
  --hard:5px 5px 0 rgba(0,0,0,.4);
  --hard-sm:3px 3px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
body{overflow-x:clip}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display);font-variation-settings:"SOFT" 40,"WONK" 1;margin:0;line-height:1.05;letter-spacing:-.02em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px;border-radius:6px}
.shell{max-width:1180px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--mono)}
.hidden{display:none !important}

/* ============ topbar ============ */
.topbar{
  position:sticky;top:0;z-index:60;background:var(--paper);
  border-bottom:3px solid var(--ink);
}
.topbar-in{display:flex;align-items:center;gap:14px;min-height:66px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--display);font-weight:900;font-size:23px;letter-spacing:-.03em}
.brand-name em{font-style:normal;color:var(--punch)}
.nav{display:flex;gap:4px;margin-inline-start:auto;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.nav::-webkit-scrollbar{height:4px}
.nav button{
  border:2px solid transparent;background:none;border-radius:999px;
  padding:7px 13px;font-weight:700;font-size:14px;white-space:nowrap;flex:0 0 auto;
}
.nav button:hover{background:rgba(124,77,255,.12)}
.nav button[aria-current="page"]{border-color:var(--ink);background:var(--zest);color:#1B1042}
.hud{display:flex;gap:8px;align-items:center;flex:1 1 auto;margin-inline-start:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{
  display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);
  background:var(--card);border-radius:999px;padding:5px 11px;
  font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap;
}
.chip b{font-family:var(--body);font-weight:800}
.icon-btn{border:2px solid var(--ink);background:var(--card);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;font-size:15px}
.icon-btn:hover{background:var(--zest)}
.burger{display:none}

/* ============ hero ============ */
.hero{
  background:var(--ink);color:#FFF8FF;border-bottom:3px solid var(--ink);
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:-40% -10%;
  background:conic-gradient(from 20deg,
    rgba(255,61,129,.5) 0 12%, transparent 12% 25%,
    rgba(0,209,193,.45) 25% 37%, transparent 37% 50%,
    rgba(255,196,0,.45) 50% 62%, transparent 62% 75%,
    rgba(124,77,255,.6) 75% 87%, transparent 87% 100%);
  filter:blur(2px);opacity:.5;animation:spin 90s linear infinite;
}
@keyframes spin{to{transform:rotate(1turn)}}
.hero-in{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:38px;align-items:center;padding-top:52px;padding-bottom:46px}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--zest-ink);font-weight:700}
.hero .eyebrow{color:#FFD24D}
.hero h1{font-size:clamp(2.5rem,5.6vw,4.1rem);font-weight:900;margin:14px 0 16px;color:#fff}
.hero h1 span{
  background:linear-gradient(100deg,var(--zest),var(--punch) 55%,var(--aqua));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p.lede{font-size:18px;max-width:46ch;color:#E4DAFF;margin:0 0 24px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:26px}
.btn{
  border:3px solid var(--ink);border-radius:14px;padding:12px 20px;font-weight:800;
  background:var(--card);color:var(--ink);box-shadow:var(--hard);transition:transform .12s,box-shadow .12s;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 rgba(27,16,66,.2)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(27,16,66,.2)}
.btn-punch{background:var(--punch);color:#fff}
.btn-zest{background:var(--zest);color:#1B1042}
.btn-aqua{background:var(--aqua);color:#FFFFFF}
.btn-ghost{background:transparent;color:inherit;box-shadow:none;border-color:currentColor}
.btn-sm{padding:8px 14px;border-width:2px;border-radius:11px;box-shadow:var(--hard-sm);font-size:14px}
.grades{display:flex;flex-wrap:wrap;gap:7px}
.grade-pill{
  border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);color:#fff;
  border-radius:999px;padding:6px 13px;font-weight:800;font-size:14px;font-family:var(--mono);
}
.grade-pill:hover{background:rgba(255,255,255,.22)}
.grade-pill[aria-pressed="true"]{background:var(--zest);color:#1B1042;border-color:#1B1042}
.hero-art{display:grid;place-items:center}
.hero-art figcaption{margin-top:14px;text-align:center;font-size:13px;color:#D9CDFF;font-family:var(--mono)}
.ticker{
  border-top:3px solid var(--ink);background:var(--zest);color:#1B1042;
  font-family:var(--mono);font-size:13px;font-weight:600;padding:9px 0;overflow:hidden;white-space:nowrap;
}
.ticker span{display:inline-block;padding-right:44px}

/* ============ sections ============ */
.section{padding-top:48px;padding-bottom:48px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.section-head h2{font-size:clamp(1.7rem,3.2vw,2.4rem);font-weight:900}
.section-head p{margin:6px 0 0;color:var(--muted);max-width:56ch}
.rule{height:3px;background:var(--ink);border-radius:2px;margin:0 0 22px}

/* ============ catalog ============ */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{
  flex:1;min-width:220px;display:flex;align-items:center;gap:8px;
  border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:10px 14px;box-shadow:var(--hard-sm);
}
.search input{border:0;background:none;outline:none;flex:1;font:inherit;color:inherit}
.subject-rail{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.subj{
  border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:7px 14px;
  font-weight:700;font-size:14px;display:inline-flex;gap:7px;align-items:center;
}
.subj .dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink)}
.subj[aria-pressed="true"]{box-shadow:var(--hard-sm);transform:translate(-1px,-1px)}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.skill{
  border:3px solid var(--ink);border-radius:var(--r);background:var(--card);
  box-shadow:var(--hard);padding:15px 16px 13px;text-align:left;position:relative;overflow:hidden;
  transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:9px;min-height:132px;
}
.skill:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 rgba(27,16,66,.2)}
.skill .stripe{position:absolute;inset:0 auto 0 0;width:7px}
.skill .top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-left:8px}
.skill .code{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.skill h3{font-size:17px;font-weight:700;padding-left:8px;font-variation-settings:"SOFT" 60,"WONK" 0}
.skill .meta{margin-top:auto;padding-left:8px;display:flex;align-items:center;gap:8px}
.bar{display:block;flex:1;height:9px;border:2px solid var(--ink);border-radius:999px;background:transparent;overflow:hidden;box-sizing:content-box}
.bar i{display:block;height:100%;background:var(--lime)}
.pct{font-family:var(--mono);font-size:12px;font-weight:600;min-width:34px;text-align:right}
.mastered{position:absolute;top:9px;right:9px;font-size:15px}
.empty{
  border:3px dashed var(--line);border-radius:var(--r);padding:38px;text-align:center;color:var(--muted);
}

/* ============ practice ============ */
.practice-wrap{display:grid;grid-template-columns:1.5fr .85fr;gap:22px;align-items:start;padding-top:26px;padding-bottom:60px}
.qcard{border:3px solid var(--ink);border-radius:22px;background:var(--card);box-shadow:var(--hard);padding:24px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.qhead .code{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.05em}
.tier{font-family:var(--mono);font-size:12px;font-weight:600;border:2px solid var(--ink);border-radius:999px;padding:2px 9px}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,2.6vw,1.9rem);margin:12px 0 6px;font-variation-settings:"SOFT" 50,"WONK" 0}
.qsub{color:var(--muted);margin:0 0 18px;font-size:15px}
.visual{font-size:30px;letter-spacing:6px;line-height:1.5;margin:0 0 18px;word-break:break-word}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{
  border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:14px 16px;
  font-weight:700;text-align:left;box-shadow:var(--hard-sm);display:flex;gap:11px;align-items:center;
  transition:transform .1s,box-shadow .1s;
}
.choice:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:5px 5px 0 rgba(27,16,66,.18)}
.choice:disabled{cursor:default}
.choice .key{
  font-family:var(--mono);font-size:12px;font-weight:600;border:2px solid var(--ink);border-radius:8px;
  width:24px;height:24px;display:grid;place-items:center;flex:none;
}
.choice.right{background:var(--lime);color:#12300a}
.choice.wrong{background:var(--punch);color:#fff}
.entry{display:flex;gap:10px;flex-wrap:wrap}
.entry input{
  border:3px solid var(--ink);border-radius:14px;padding:13px 16px;font:600 20px var(--mono);
  background:var(--card);color:inherit;outline:none;max-width:220px;box-shadow:var(--hard-sm);
}
.verdict{margin-top:18px;border:3px solid var(--ink);border-radius:16px;padding:14px 16px}
.verdict.ok{background:rgba(139,224,76,.22)}
.verdict.no{background:rgba(255,61,129,.16)}
.verdict h4{font-size:17px;margin-bottom:5px}
.verdict p{margin:0;font-size:15px}
.qfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.side{display:grid;gap:16px;position:sticky;top:86px}
.panel{border:3px solid var(--ink);border-radius:22px;background:var(--card);box-shadow:var(--hard);padding:18px}
.panel h3.ph,.panel h4{font-size:15px;letter-spacing:.02em;margin-bottom:12px;font-variation-settings:"SOFT" 60,"WONK" 0;font-weight:700}
.score-num{font-family:var(--mono);font-weight:600;font-size:44px;line-height:1;text-align:center}
.score-lab{text-align:center;font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
.statrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.statrow:last-child{border:0}
.statrow b{font-family:var(--mono)}
.dots{display:flex;gap:5px;margin:14px 0 2px}
.dots i{flex:1;height:11px;border:2px solid var(--ink);border-radius:5px;background:transparent;transition:background .25s}
.dots i.on{background:var(--lime)}
.dots i.now{animation:popIn .4s cubic-bezier(.2,1.6,.4,1) both}
.lvlline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.hintbox{border:2px dashed var(--ink);border-radius:14px;padding:12px;background:rgba(255,196,0,.16);font-size:14px;margin-top:14px}

/* ============ dashboard ============ */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.stat{border:3px solid var(--ink);border-radius:var(--r);padding:16px;box-shadow:var(--hard);background:var(--card)}
.stat .k{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:900;font-size:36px;line-height:1.1;margin-top:4px}
.masterlist{display:grid;gap:12px;margin-top:8px}
.mrow{display:grid;grid-template-columns:170px 1fr 52px;gap:12px;align-items:center}
.mrow span{font-weight:700;font-size:14px}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.day{width:44px;text-align:center}
.day i{display:block;height:44px;border:2px solid var(--ink);border-radius:11px;background:var(--card)}
.day b{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.badge{border:3px solid var(--ink);border-radius:var(--r);padding:14px;text-align:center;background:var(--card);box-shadow:var(--hard-sm)}
.badge b{color:var(--ink)}
.badge small{color:var(--muted)}
.badge.locked{box-shadow:none;border-style:dashed;border-color:var(--line);background:transparent}
.badge.locked .em{opacity:.5}
.badge.locked b,.badge.locked small{opacity:1}

.badge .em{font-size:30px;display:block}
.badge b{display:block;font-size:14px;margin-top:6px}
.badge small{color:var(--muted);font-size:12px}
.board{width:100%;border-collapse:collapse;font-size:15px}
.board th,.board td{text-align:left;padding:10px 8px;border-bottom:2px solid var(--line)}
.board th{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.board tr.you{background:rgba(255,196,0,.22);font-weight:800}
.board td.n{font-family:var(--mono)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.theme-card{border:3px solid var(--ink);border-radius:var(--r);padding:14px;background:var(--card);box-shadow:var(--hard-sm);text-align:center}
.swatches{display:flex;gap:5px;justify-content:center;margin-bottom:9px}
.swatches i{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink)}

/* ============ misc ============ */
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);
  background:var(--ink);color:var(--paper);border:3px solid var(--zest);border-radius:16px;
  padding:12px 20px;font-weight:700;z-index:90;transition:transform .3s cubic-bezier(.2,1.4,.4,1);max-width:90vw;
}
.toast.up{transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.confetti i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 1.5s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
footer{border-top:3px solid var(--ink);padding:26px 0;color:var(--muted);font-size:14px}
footer b{color:var(--ink)}
.kal-wrap{position:relative;width:min(330px,74vw);aspect-ratio:1}
.kal-wrap svg{width:100%;height:100%}
.kal-center{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;
}
.kal-center b{font-family:var(--mono);font-size:30px;font-weight:600;display:block}
.kal-center small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero .kal-center small{color:#CFC0FF}
.hero .kal-center b{color:#fff}

@media (max-width:940px){
  .hero-in{grid-template-columns:1fr;padding-top:36px;padding-bottom:36px}
  .hero-art{order:-1}
  .practice-wrap{grid-template-columns:1fr}
  .side{position:static}
  .split{grid-template-columns:1fr}
  .nav{order:3;width:100%;flex-basis:100%;margin:0;-webkit-overflow-scrolling:touch}
  .nav button{white-space:nowrap}
  .mrow{grid-template-columns:120px 1fr 46px}
}
@media (max-width:560px){
  .choices{grid-template-columns:1fr}
  .hud{width:100%;justify-content:flex-start;order:4}
  .hud .chip.opt{padding:4px 8px}
  #acctBtn{max-width:140px}
  #langSel{max-width:7.5rem}
  .brand-name{font-size:20px}
}
[dir="rtl"] .skill .stripe{left:auto;right:0}
[dir="rtl"] .skill .top,[dir="rtl"] .skill h3,[dir="rtl"] .skill .meta,[dir="rtl"] .skill .code{padding-left:0;padding-right:8px}
[dir="rtl"] .acct-row .sp,[dir="rtl"] .quest{margin-left:0}

[dir="rtl"] .nav{margin-left:0;margin-right:auto}
[dir="rtl"] .acct-row .sp{margin-left:0;margin-right:auto}
[dir="rtl"] .adm th,[dir="rtl"] .adm td,[dir="rtl"] .board th,[dir="rtl"] .board td{text-align:right}
[dir="rtl"] .ticker-track{direction:ltr}
[dir="rtl"] .mono,[dir="rtl"] .pct,[dir="rtl"] .clock{direction:ltr;unicode-bidi:embed}

/* ============ class board ============ */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:8px 0 28px;flex-wrap:nowrap}
.pod{flex:0 1 140px;min-width:0;text-align:center}
.pod-medal{display:block;font-size:20px;line-height:1.1;height:24px;margin-bottom:4px}
.pod-face{display:block;font-size:30px;line-height:1.1;height:36px;margin-bottom:6px}
.pod-name{display:block;font-weight:800;font-size:14px;margin-bottom:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod-block{border:3px solid var(--ink);border-radius:14px 14px 0 0;background:var(--aqua);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  box-shadow:var(--hard-sm);animation:growH .6s cubic-bezier(.2,.9,.3,1) both;overflow:hidden}
.pod-block small{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#fff;line-height:1;font-weight:600}
.pod.p1 .pod-block small{color:#1B1042}
.pod.p1 .pod-block{background:var(--zest)}
.pod.p2 .pod-block{background:var(--grape)}
.pod.p3 .pod-block{background:var(--punch)}
.pod.p1 .pod-block b{color:#1B1042}
.pod-block b{font-family:var(--display);font-size:20px;color:#fff;line-height:1.05}


.boardlist{list-style:none;display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:12px;padding:11px 14px;border:2px solid var(--line);
  border-radius:14px;background:var(--card)}
.brow.you{border-color:var(--ink);border-width:3px;box-shadow:var(--hard-sm)}
.brank{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--muted);
  width:26px;text-align:center;flex:0 0 26px}
.bface{font-size:22px;line-height:1;flex:0 0 auto}
.bname{font-weight:800;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname em{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--punch);margin-inline-start:6px;font-weight:700}
[data-theme="night"] .bname em{color:#FF6FA3}
[data-theme="night"][data-skin="admin"] .bname em{color:#FF8A85}
[data-theme="night"][data-skin="parent"] .bname em{color:#F0907F}
.pod.you .pod-name{color:var(--punch)}
[data-theme="night"] .pod.you .pod-name{color:#FF6FA3}
[data-theme="night"][data-skin="admin"] .pod.you .pod-name{color:#FF8A85}
[data-theme="night"][data-skin="parent"] .pod.you .pod-name{color:#F0907F}
.bbar{flex:0 1 200px;min-width:60px;height:12px;border:2px solid var(--ink);border-radius:999px;
  overflow:hidden;background:var(--paper)}
.bbar i{display:block;height:100%;background:var(--aqua);border-radius:999px;
  animation:growW .7s cubic-bezier(.2,.9,.3,1) both}
.brow.you .bbar i{background:var(--punch)}
.bxp{font-family:var(--display);font-weight:900;font-size:17px;flex:0 0 auto;min-width:64px;text-align:end}
.bxp small{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink);
  margin-inline-start:4px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
@media (max-width:620px){
  .bbar{display:none}
  .podium{gap:8px}
  .pod{flex:0 1 92px}
  .pod-face{font-size:26px}
  .pod-name{font-size:12px}
}

.solo-podium{margin-bottom:6px}
.pod.ghost .pod-block{background:var(--paper);border-style:dashed;box-shadow:none}
.pod.ghost .pod-block b{color:var(--muted)}
.pod.ghost .pod-block small{color:var(--muted)}
.pod.ghost .pod-name,.pod.ghost .pod-face{opacity:.65}
.pod.you.p1 .pod-block{background:var(--zest)}
.pod.you.p1 .pod-block b,.pod.you.p1 .pod-block small{color:#1B1042}

/* ============ streak ============ */
.streak{border:3px solid var(--ink);border-radius:var(--r);padding:18px;background:var(--card);
  box-shadow:var(--hard-sm);position:relative;overflow:hidden}
.streak.alive{background:linear-gradient(160deg,var(--card) 55%,rgba(224,26,99,.10))}
.streak-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.streak-flame{font-size:38px;line-height:1;filter:grayscale(1);opacity:.35;transition:all .3s}
.streak.alive .streak-flame{filter:none;opacity:1;animation:flame 1.6s ease-in-out infinite;transform-origin:50% 85%}
.streak-n{font-family:var(--display);font-size:44px;line-height:.9;font-weight:900}
.streak-lab{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.streak-days{display:flex;gap:7px}
.sday{flex:1;text-align:center;min-width:0}
.sday .dot{position:relative;height:38px;border-radius:11px;border:2px solid var(--line);
  background:transparent;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;color:var(--muted)}
.sday.hit .dot{background:var(--punch);border-color:var(--ink);color:#fff}
.sday.today .dot{border-color:var(--ink);border-width:3px}
.sday.today.miss .dot{border-style:dashed;color:var(--ink)}
.sday .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:5px;display:block}
.sday.today .lab{color:var(--ink);font-weight:700}
.streak-note{margin-top:14px;font-size:14.5px;line-height:1.4}
.streak-note b{color:var(--punch)}
@media (max-width:560px){.streak-n{font-size:36px}.sday .dot{height:32px;font-size:13px}}

/* ============ accessibility ============ */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;top:0;inset-inline-start:0;z-index:200;background:var(--ink);color:var(--paper);
  padding:12px 18px;border-radius:0 0 12px 0;font-weight:800;
  width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip:focus{width:auto;height:auto;overflow:visible;clip:auto}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px;border-radius:6px}
[data-skin="admin"] :focus-visible{outline-color:var(--aqua)}
.ticker:focus-within .ticker-track,.ticker:hover .ticker-track{animation-play-state:paused}
.choice[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
/* High contrast: pure black on white, heavier borders, no decorative
   gradients or shadows. Some children genuinely cannot use the pastel
   palette; this is accessibility, not a skin. */
[data-contrast="high"]{
  --ink:#000000;--paper:#FFFFFF;--card:#FFFFFF;--muted:#1A1A1A;--line:#000000;
  --punch:#B3005E;--zest:#FFD400;--zest-ink:#5A4000;--aqua:#00504A;--grape:#3A1D8F;--lime:#1A5C10;
}
[data-contrast="high"][data-theme="night"]{
  --ink:#FFFFFF;--paper:#000000;--card:#0A0A0A;--muted:#F0F0F0;--line:#FFFFFF;
  --punch:#FF7AB0;--zest:#FFD400;--zest-ink:#FFE45C;--aqua:#5FE3D8;--grape:#B8A5FF;--lime:#8BE04C;
}
[data-contrast="high"] .hero,
[data-contrast="high"] .streak.alive,
[data-contrast="high"] .pod-block{background-image:none!important}
/* the hero is a dark panel in light mode; in night mode the page is already
   black, so invert the pairing instead of stacking white on white */
[data-contrast="high"] .hero{background:#000;color:#fff}
[data-contrast="high"] .hero::before{display:none}   /* the rotating wedges */
[data-contrast="high"] .hero .lede,[data-contrast="high"] .hero h1,
[data-contrast="high"] .hero .eyebrow{color:#fff}
[data-contrast="high"] .hero figcaption{color:#EDEDED}
[data-contrast="high"][data-theme="night"] .hero{background:#000;border-bottom:3px solid #fff}
/* In night mode the accents are lightened so they work as TEXT. Buttons use
   them as a BACKGROUND, so the label has to flip to dark or it washes out. */
/* High contrast is an accessibility override: it must beat the per-skin
   night palettes, which are defined later in this stylesheet. */
[data-contrast="high"][data-theme="night"] .btn-aqua,
[data-contrast="high"][data-theme="night"] .btn-punch,
[data-contrast="high"][data-theme="night"] .btn-zest,
[data-contrast="high"][data-theme="night"] .btn-lime,
[data-contrast="high"][data-theme="night"] .btn-grape{color:#000!important}
[data-contrast="high"][data-theme="night"] .pod-block b,
[data-contrast="high"][data-theme="night"] .pod-block small,
[data-contrast="high"][data-theme="night"] .sday.hit .dot{color:#000!important}
[data-contrast="high"] .btn,[data-contrast="high"] .chip,[data-contrast="high"] .panel,
[data-contrast="high"] .stat,[data-contrast="high"] .skill,[data-contrast="high"] .brow,
[data-contrast="high"] .streak{border-width:3px;box-shadow:none}
[data-contrast="high"] .kal-wrap,[data-contrast="high"] .bubbles,
[data-contrast="high"] .shard,[data-contrast="high"] .confetti{display:none!important}
[data-contrast="high"] .qtext{font-weight:800}
[data-contrast="high"] *{text-shadow:none!important}

@media (prefers-contrast:more){
  :root{--muted:#3A2C6B;--line:rgba(27,16,66,.4)}
  [data-skin="parent"]{--muted:#12312A}
  [data-skin="admin"]{--muted:#232B3A}
  .btn,.chip,.panel,.stat{border-width:3px}
}

/* ============ skins: one product, three rooms ============ */
/* PARENT — calm, editorial, domestic. Pine ink on sage paper, soft shadows. */
[data-skin="parent"]{
  --ink:#12312A;--paper:#F1F5F1;--card:#FFFFFF;
  --punch:#A8412F;--zest:#E8B04A;--zest-ink:#6B4508;--aqua:#125A4A;--grape:#33506B;--lime:#4C7C3A;
  --muted:#4C5F55;--line:rgba(18,49,42,.15);
  --hard:0 10px 26px rgba(18,49,42,.10);--hard-sm:0 4px 14px rgba(18,49,42,.09);
  --r:16px;--display:"Newsreader",Georgia,serif;
}
[data-theme="night"][data-skin="parent"]{
  --zest-ink:#F0C46B;
  --ink:#E7EFE9;--paper:#0F1A16;--card:#17241F;--muted:#9DB4A8;--line:rgba(231,239,233,.17);
  --hard:0 10px 26px rgba(0,0,0,.55);--hard-sm:0 4px 14px rgba(0,0,0,.5);
}
[data-skin="parent"] h1,[data-skin="parent"] h2,[data-skin="parent"] h3,[data-skin="parent"] h4{
  font-variation-settings:normal;font-weight:600;letter-spacing:-.012em;line-height:1.15}
[data-skin="parent"] .panel,[data-skin="parent"] .stat,[data-skin="parent"] .qcard,
[data-skin="parent"] .gate-card,[data-skin="parent"] .chal,[data-skin="parent"] .skill{border-width:2px}
[data-skin="parent"] .btn{border-width:2px;border-radius:12px}
[data-skin="parent"] .btn:hover{transform:translateY(-2px)}
[data-skin="parent"] .topbar{border-bottom-width:2px}
[data-skin="parent"] .hero{background:linear-gradient(155deg,#12312A 0%,#1F5C4E 55%,#2E7D6A 100%)}
[data-skin="parent"] .hero::before{opacity:.14;animation-duration:220s}
[data-skin="parent"] .rule{height:2px;opacity:.5}
[data-skin="parent"] .section{padding-top:56px;padding-bottom:56px}
[data-skin="parent"] .panel{padding:22px}
[data-skin="parent"] .lede,[data-skin="parent"] .section-head p{line-height:1.6}
.hero .eyebrow,[data-skin="parent"] .hero .eyebrow{color:#FFD98A}
[data-skin="admin"] .hero .eyebrow{color:#FFC24D}
[data-skin="parent"] .stat .v{font-family:"Newsreader",Georgia,serif;font-weight:700}

/* ADMIN — an operations console. Cool grey, hairlines, monospace labels. */
[data-skin="admin"]{
  --ink:#111722;--paper:#EDEFF4;--card:#FFFFFF;
  --punch:#B3241F;--zest:#F0A800;--zest-ink:#7A4600;--aqua:#1A3AB8;--grape:#4A25A8;--lime:#137A42;
  --muted:#4B5568;--line:rgba(17,23,34,.17);
  --hard:0 1px 2px rgba(17,23,34,.14);--hard-sm:0 1px 2px rgba(17,23,34,.12);
  --r:6px;--display:"IBM Plex Mono",ui-monospace,monospace;
}
[data-theme="night"][data-skin="admin"]{
  --zest-ink:#FFBF57;
  --ink:#E6EAF2;--paper:#12151C;--card:#1A1F29;--muted:#93A0B5;--line:rgba(230,234,242,.18);
  --hard:0 1px 2px rgba(0,0,0,.6);--hard-sm:0 1px 2px rgba(0,0,0,.55);
}
[data-skin="admin"] h1,[data-skin="admin"] h2,[data-skin="admin"] h3,[data-skin="admin"] h4{
  font-variation-settings:normal;font-weight:600;letter-spacing:-.02em}
[data-skin="admin"] .section-head h2{text-transform:uppercase;letter-spacing:.1em;font-size:clamp(1.2rem,2.2vw,1.55rem)}
[data-skin="admin"] .panel,[data-skin="admin"] .stat,[data-skin="admin"] .gate-card,
[data-skin="admin"] .chal,[data-skin="admin"] .skill,[data-skin="admin"] .qcard{border-width:1px;border-radius:6px}
[data-skin="admin"] .btn{border-width:1px;border-radius:5px;box-shadow:none;font-weight:600}
[data-skin="admin"] .btn:hover{transform:none;box-shadow:0 0 0 2px rgba(45,91,255,.25)}
[data-skin="admin"] .btn:active{transform:none;box-shadow:none}
[data-skin="admin"] .chip,[data-skin="admin"] .tabs button,[data-skin="admin"] .subj{border-width:1px;border-radius:5px}
[data-skin="admin"] .topbar{border-bottom-width:1px}
[data-skin="admin"] .rule{height:1px;opacity:.45}
[data-skin="admin"] .section{padding-top:38px;padding-bottom:38px}
[data-skin="admin"] .panel{padding:16px}
[data-skin="admin"] .hero{background:var(--ink);border-bottom-width:1px}
[data-skin="admin"] .hero::before{
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 44px),
             repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 44px);
  animation:none;opacity:1;filter:none;inset:0}
[data-skin="admin"] .hero h1 span{background:none;-webkit-text-fill-color:var(--zest);color:var(--zest)}
[data-skin="admin"] .hero h1{font-size:clamp(1.9rem,3.6vw,2.7rem)}
[data-skin="admin"] .adm tbody tr:nth-child(odd){background:rgba(17,23,34,.035)}
[data-theme="night"][data-skin="admin"] .adm tbody tr:nth-child(odd){background:rgba(255,255,255,.04)}
[data-skin="admin"] .adm th{background:var(--card);position:sticky;top:0;z-index:2}
[data-skin="admin"] .stat .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:30px}
[data-skin="admin"] .stat .k{color:var(--aqua)}
[data-theme="night"][data-skin="admin"] .stat .k{color:#8FA8FF}
[data-skin="admin"] .bar{border-radius:3px;border-width:1px}
[data-skin="admin"] .bar i{border-radius:0}


/* ============ challenges, quests, avatars ============ */
.chal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:16px}
.chal{
  border:3px solid var(--ink);border-radius:var(--r);background:var(--card);box-shadow:var(--hard);
  padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:186px;
  transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden;
}
.chal:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 rgba(27,16,66,.2)}
.chal .em{font-size:28px}
.chal h3{font-size:19px;font-variation-settings:"SOFT" 60,"WONK" 0}
.chal p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.chal .go{margin-top:auto;font-weight:800;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chal .best{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:11px;border:2px solid var(--ink);border-radius:999px;padding:2px 8px;background:var(--zest);color:#1B1042}
.quest{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.quest:last-child{border:0}
.quest b{font-size:14.5px}
.quest .sub{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ring{width:104px;height:104px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .trk{stroke:var(--line)}
.ring .val{stroke:var(--aqua);stroke-linecap:round;transition:stroke-dasharray .8s cubic-bezier(.2,.9,.3,1)}
.ring span{position:absolute;inset:0;display:grid;place-content:center;font-family:var(--mono);font-weight:600;font-size:19px}
.goalcard{display:flex;gap:16px;align-items:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.tabs button[aria-current="true"]{background:var(--ink);color:var(--paper)}
[data-theme="night"] .tabs button[aria-current="true"]{background:var(--grape);color:#fff}
.adm{width:100%;border-collapse:collapse;font-size:14.5px}
.adm th,.adm td{text-align:left;padding:9px 8px;border-bottom:2px solid var(--line);vertical-align:middle}
.adm th{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.adm td.n{font-family:var(--mono)}
.adm tr.sel{background:rgba(255,196,0,.18)}
.adm .acts{display:flex;gap:6px;flex-wrap:wrap}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lock{max-width:460px}
.meter{display:flex;gap:5px;margin:8px 0 4px}
.meter i{flex:1;height:7px;border-radius:4px;background:var(--line);transition:background .25s}
.meter i.on1{background:var(--punch)}.meter i.on2{background:var(--zest)}
.meter i.on3{background:var(--lime)}.meter i.on4{background:var(--aqua)}
.meterlab{font-family:var(--mono);font-size:12px;color:var(--muted)}
.reccode{
  font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.16em;
  border:3px dashed var(--ink);border-radius:14px;padding:16px;text-align:center;margin:14px 0;
  background:rgba(255,196,0,.16);word-break:break-all;user-select:all;
}
.field.bad input{border-color:var(--punch)}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.secrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.secrow:last-child{border:0}
.pinrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pinrow input{border:3px solid var(--ink);border-radius:14px;padding:11px 14px;font:600 20px var(--mono);width:140px;letter-spacing:.3em;background:var(--card);color:inherit;outline:none}
.assign-list{max-height:330px;overflow:auto;border:2px dashed var(--line);border-radius:14px;padding:10px;margin-top:10px}
.assign-row{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--line)}
.assign-row:last-child{border:0}
.assign-row span{flex:1;font-size:14px}
.exportbox{width:100%;min-height:190px;border:3px solid var(--ink);border-radius:14px;padding:12px;font:400 12px var(--mono);background:var(--card);color:inherit;resize:vertical}
.danger{border-color:var(--punch) !important}
.guestbar{
  background:var(--card);border-bottom:3px solid var(--ink);
}
.guestbar-in{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 0}
.guestbar b{font-size:15px}
.guestbar span{color:var(--muted);font-size:14px}
.guestbar .sp{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.gate{min-height:calc(100vh - 66px);display:grid;place-items:center;padding:40px 20px}
.gate-card{width:min(620px,100%);border:3px solid var(--ink);border-radius:26px;background:var(--card);box-shadow:var(--hard);padding:30px}
.gate-card h1{font-size:clamp(1.9rem,4vw,2.7rem);margin-bottom:8px}
.gate-card .lede{color:var(--muted);margin:0 0 22px}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.who button{border:3px solid var(--ink);border-radius:var(--r);background:var(--card);box-shadow:var(--hard-sm);padding:16px 12px;text-align:center;transition:transform .12s}
.who button:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 rgba(27,16,66,.2)}
.who .face{font-size:34px;display:block}
.who b{display:block;margin-top:6px;font-size:15px}
.who small{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;border:3px solid var(--ink);border-radius:14px;padding:12px 14px;font:600 16px var(--body);background:var(--card);color:inherit;outline:none}
.acct-row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.acct-row:last-child{border:0}
.acct-row .face{font-size:26px}
.acct-row b{font-size:15px}
.acct-row .sp{margin-left:auto;display:flex;gap:8px}
#acctBtn{gap:7px;max-width:190px;overflow:hidden}
#acctBtn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatars{display:flex;flex-wrap:wrap;gap:9px}
.av{width:48px;height:48px;border:3px solid var(--ink);border-radius:14px;background:var(--card);font-size:23px;display:grid;place-items:center;box-shadow:var(--hard-sm)}
.av[aria-pressed="true"]{background:var(--zest);transform:translate(-2px,-2px);box-shadow:5px 5px 0 rgba(27,16,66,.2)}
.av:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.lives{font-size:19px;letter-spacing:3px}
.clock{font-family:var(--mono);font-size:30px;font-weight:600;text-align:center}
.clock.low{color:var(--punch);animation:bump .6s ease infinite}
.sec-nav{position:sticky;top:66px;z-index:40;background:var(--paper);border-bottom:2px solid var(--line);padding:9px 0;overflow-x:auto}
.sec-nav-in{display:flex;gap:7px;min-width:max-content}
.sec-nav button{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 13px;font-weight:700;font-size:13.5px;white-space:nowrap}
.sec-nav button[aria-current="true"]{background:var(--grape);color:#fff}
.reveal{opacity:0}
.reveal.shown{opacity:1;animation:riseIn .55s cubic-bezier(.2,.9,.3,1) both}
.reveal:not(.shown) .stagger,.reveal:not(.shown) .pop,.reveal:not(.shown) .bar i,.reveal:not(.shown) .day i b{animation-play-state:paused}
.reveal.shown .stagger,.reveal.shown .pop,.reveal.shown .bar i,.reveal.shown .day i b{animation-play-state:running}

/* ============ animated home screen ============ */
.bubbles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bubbles i{position:absolute;bottom:-60px;font-size:26px;opacity:0;animation:rise linear infinite;filter:saturate(1.2)}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.5}
  85%{opacity:.5}
  100%{transform:translateY(-115vh) rotate(var(--spin,140deg));opacity:0}
}
.rotw{display:inline-block;min-width:1ch}
.rotw.flip{animation:flipw .5s cubic-bezier(.2,1.2,.3,1) both}
@keyframes flipw{0%{transform:rotateX(-90deg) translateY(12px);opacity:0}100%{transform:none;opacity:1}}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 22px}
.hero-stats div{min-width:74px}
.hero-stats b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;color:#fff;line-height:1}
.hero-stats span{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#CDBEFF;font-family:var(--mono)}
.demo-tag{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--zest)}

/* ============ motion ============ */
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.72)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes facetPop{0%{opacity:0;transform:scale(.15) rotate(-40deg)}65%{opacity:1;transform:scale(1.12) rotate(6deg)}100%{opacity:.92;transform:scale(1) rotate(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
@keyframes cheer{0%{transform:scale(1)}35%{transform:scale(1.07) rotate(-1.2deg)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.32)}100%{transform:scale(1)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes growW{from{width:0}}
@keyframes growH{from{height:0}}
@keyframes shock{from{opacity:.85;transform:scale(.55)}to{opacity:0;transform:scale(1.9)}}
@keyframes flash{from{opacity:.75;transform:scale(.2)}to{opacity:0;transform:scale(2.6)}}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(14px,-22px) rotate(24deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes flame{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(7deg) scale(1.18)}}
@keyframes shine{from{background-position:-140% 0}to{background-position:240% 0}}
@keyframes spinSlow{to{transform:rotate(1turn)}}
@keyframes fall{to{transform:translate(var(--x,0),106vh) rotate(var(--r,720deg));opacity:0}}

#main{animation:viewIn .34s cubic-bezier(.2,.9,.3,1) both}
.stagger{animation:riseIn .5s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d,0ms)}
.pop{animation:popIn .42s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d,0ms)}
.bar i{animation:growW .85s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d,80ms)}
.choice.right{animation:cheer .5s cubic-bezier(.2,1.4,.4,1)}
.choice.wrong{animation:shake .45s ease}
.entry.bad input{animation:shake .45s ease;border-color:var(--punch)}
.verdict{animation:riseIn .34s cubic-bezier(.2,1.2,.4,1) both}
.entry{animation:riseIn .45s cubic-bezier(.2,.9,.3,1) both;animation-delay:130ms}
.subject-rail .subj{animation:riseIn .4s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d,0ms)}
.hero-cta .btn-zest{animation:breathe 2.6s ease-in-out 1.2s 4}
@keyframes breathe{0%,100%{transform:none;box-shadow:var(--hard)}50%{transform:translate(-2px,-2px);box-shadow:9px 9px 0 rgba(255,61,129,.45)}}
.brand:hover .brand-mark{animation:spinSlow 2.4s linear infinite}
.toast.up{animation:popIn .4s cubic-bezier(.2,1.6,.4,1)}
.qtext{animation:riseIn .4s cubic-bezier(.2,.9,.3,1) both;animation-delay:40ms}
.bumped{animation:bump .45s cubic-bezier(.2,1.6,.4,1)}
.ticker{overflow:hidden}
.ticker-track{display:inline-flex;white-space:nowrap;animation:marquee 34s linear infinite}
.ticker-track:hover{animation-play-state:paused}
.hud .flame{display:inline-block;animation:flame 1.1s ease-in-out infinite;transform-origin:50% 80%}
.shard{position:absolute;width:22px;height:22px;border:2px solid rgba(255,255,255,.5);opacity:.35;pointer-events:none;animation:drift 9s ease-in-out infinite}
.kal-wrap svg path{transform-box:view-box;transform-origin:50px 50px}
.shock{position:absolute;inset:0;border-radius:50%;border:5px solid var(--zest);animation:shock .9s ease-out forwards;pointer-events:none}
.flashring{position:fixed;left:50%;top:50%;width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;border:10px solid var(--zest);z-index:85;pointer-events:none;animation:flash .8s ease-out forwards}
.badge.fresh{background:linear-gradient(100deg,var(--card) 30%,rgba(255,196,0,.55) 50%,var(--card) 70%);background-size:220% 100%;animation:popIn .5s cubic-bezier(.2,1.5,.4,1) both,shine 1.5s ease-in-out .3s 2}
.day i b{display:block;width:100%;border-radius:9px;background:var(--aqua);animation:growH .7s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d,0ms)}
.day i{display:flex;align-items:flex-end;overflow:hidden;padding:2px}
.hero-art .kal-wrap>svg{animation:spinSlow 120s linear infinite}
.skill:hover .stripe{width:12px;transition:width .15s}
.stripe{transition:width .15s}

@media print{
  .topbar,footer,.toast,.confetti,.section-head button,.panel h4+p+button{display:none !important}
  body{background:#fff}
  .panel,.stat{box-shadow:none;break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  html{scroll-behavior:auto}
}

/* --- visual models: number line, fraction bar, array --- */
function numberLine(from,to,marks,label){
  const W=620,H=76,pad=28,span=(to-from)||1;
  const x=v=>pad+(v-from)/span*(W-2*pad);
  const step=Math.max(1,Math.round(span/10));
  let ticks="";
  for(let v=from;v<=to;v+=step){
    ticks+='<line class="nl-tick" x1="'+x(v).toFixed(1)+'" y1="34" x2="'+x(v).toFixed(1)+'" y2="46"/>'
         + '<text class="nl-lab" x="'+x(v).toFixed(1)+'" y="62" text-anchor="middle">'+v+'</text>';
  }
  const ms=marks||[];
  const hops=ms.filter(m=>m.from!=null).map(m=>{
    const a=x(m.from),bx=x(m.v),mid=(a+bx)/2;
    return '<path class="nl-hop" d="M'+a.toFixed(1)+' 34 Q'+mid.toFixed(1)+' 6 '+bx.toFixed(1)+' 34"/>';}).join("");
  const dots=ms.map(m=>'<circle cx="'+x(m.v).toFixed(1)+'" cy="40" r="7" fill="'+(m.c||"var(--punch)")+'" stroke="var(--ink)" stroke-width="2"/>'
    +(m.t?'<text class="nl-lab" x="'+x(m.v).toFixed(1)+'" y="22" text-anchor="middle" style="fill:var(--ink);font-weight:700">'+m.t+'</text>':"")).join("");
  return '<div class="model"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(label||"Number line")+'">'
    +'<line class="nl-line" x1="'+pad+'" y1="40" x2="'+(W-pad)+'" y2="40"/>'+ticks+hops+dots+'</svg></div>';
}
function fractionBar(n,d,label){
  const W=560,H=54,cw=(W-4)/d;
  let cells="";
  for(let i=0;i<d;i++)
    cells+='<rect class="fb-cell" x="'+(2+i*cw).toFixed(1)+'" y="8" width="'+cw.toFixed(1)+'" height="38" fill="'+(i<n?"var(--aqua)":"transparent")+'"/>';
  return '<div class="model"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(label||(n+" of "+d+" parts shaded"))+'">'+cells+'</svg></div>';
}
function arrayGrid(rows,cols,label){
  const cell=26,W=cols*cell+8,H=rows*cell+8;
  let dots="";
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
    dots+='<circle class="arr-dot" cx="'+(4+c*cell+cell/2)+'" cy="'+(4+r*cell+cell/2)+'" r="'+(cell/2-5)+'"/>';
  return '<div class="model"><svg viewBox="0 0 '+W+' '+H+'" width="'+Math.min(W,360)+'" role="img" aria-label="'+(label||(rows+" rows of "+cols))+'">'+dots+'</svg></div>';
}

const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const P=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const simp=(n,d)=>{const g=gcd(Math.abs(n),Math.abs(d))||1;return[n/g,d/g];};
/* A "trap" is a wrong answer a learner actually produces, paired with the
   misconception behind it. Traps become the distractors on multiple choice,
   and the diagnosis when a typed answer matches one. */
const trap=(v,why)=>({v:String(v),why});
function trapOpts(ans,traps,filler){
  const out=[String(ans)];
  (traps||[]).forEach(t=>{if(out.length<4&&!out.includes(t.v))out.push(t.v);});
  (filler||[]).forEach(f=>{if(out.length<4&&!out.includes(String(f)))out.push(String(f));});
  return shuffle(out);
}
function cleanTraps(q){
  if(!q||!q.traps)return q;
  const seen=new Set([norm(q.ans)]);
  q.traps=q.traps.filter(tr=>{
    const k=norm(tr.v);
    if(!tr.v||!tr.why||seen.has(k)||/undefined|NaN/.test(String(tr.v)))return false;
    seen.add(k);return true;});
  if(!q.traps.length)delete q.traps;
  return q;
}
function diagnose(q,given){
  if(!q.traps)return null;
  const g=norm(given);
  const hit=q.traps.find(t=>norm(t.v)===g);
  return hit?hit.why:null;
}
const nearby=(n,k)=>{const s=new Set();while(s.size<k){const d=R(1,Math.max(3,Math.round(Math.abs(n)*.3)))*(P([1,-1]));if(n+d!==n&&!s.has(n+d))s.add(n+d);}return[...s];};

fraccmp:()=>{const d=P([3,4,5,6,8,10]);const a=R(1,d-1);let b=R(1,d-1);while(b===a)b=R(1,d-1);const ans=a>b?">":"<";return{q:t("qCompareF",{a:a+"/"+d,b:b+"/"+d}),opts:["<",">","="],ans,model:()=>fractionBar(a,d,a+" of "+d)+fractionBar(b,d,b+" of "+d),exp:"Same denominator, so compare the numerators: "+a+" and "+b+"."};},

fracaddun:()=>{const d1=P([2,3,4,5,6]),d2=P([3,4,6,8,10].filter(x=>x!==d1));const a=R(1,d1-1),b=R(1,d2-1);const n=a*d2+b*d1,d=d1*d2;const[sn,sd]=simp(n,d);return{q:a+"/"+d1+" + "+b+"/"+d2+" = ? (simplest form, like 3/4)",ans:sn+"/"+sd,input:1,exp:"Common denominator "+d+": "+(a*d2)+"/"+d+" + "+(b*d1)+"/"+d+" = "+n+"/"+d+" = "+sn+"/"+sd+".",frac:1};},
fracmul:()=>{const a=R(1,5),b=R(2,7),c=R(1,5),d=R(2,7);const[sn,sd]=simp(a*c,b*d);return{q:a+"/"+b+" × "+c+"/"+d+" = ? (simplest form)",ans:sn+"/"+sd,input:1,exp:"Multiply across: "+(a*c)+"/"+(b*d)+" = "+sn+"/"+sd+".",frac:1};},
fracsimp:()=>{const k=R(2,6),n=R(1,6),d=R(n+1,9);const[sn,sd]=simp(n*k,d*k);return{q:t("qWriteAs",{a:(n*k)+"/"+(d*k),b:t("wFraction")}),model:()=>fractionBar(n*k,d*k,(n*k)+" of "+(d*k)),ans:sn+"/"+sd,input:1,exp:"Divide top and bottom by "+gcd(n*k,d*k)+" to get "+sn+"/"+sd+".",frac:1};},
dec:(p,t)=>{const f=p.places==2?100:10;const a=R(10,t==3?900:200)/f,b=R(10,t==3?900:200)/f;const op=P(p.ops);let ans;if(op=="+")ans=a+b;else if(op=="−")ans=Math.abs(a-b);else ans=Math.round(a*b*f*f)/(f*f);const x=op=="−"?Math.max(a,b):a,y=op=="−"?Math.min(a,b):b;return{q:x.toFixed(p.places)+" "+op+" "+y.toFixed(p.places)+" = ?",ans:String(Number(ans.toFixed(4))),input:1,exp:"Line up the decimal points"+(op=="×"?" after multiplying as whole numbers":"")+". The answer is "+Number(ans.toFixed(4))+"."};},
ooo:(p,t)=>{const a=R(2,9),b=R(2,9),c=R(2,9);if(t<3){const ans=a+b*c;return{q:a+" + "+b+" × "+c+" = ?",ans:String(ans),input:1,exp:"Multiply first: "+b+" × "+c+" = "+(b*c)+", then add "+a+" to get "+ans+"."};}const ans=(a+b)*c-b;return{q:"("+a+" + "+b+") × "+c+" − "+b+" = ?",ans:String(ans),input:1,exp:"Parentheses first: "+(a+b)+". Then × "+c+" = "+((a+b)*c)+". Then − "+b+" = "+ans+"."};},

ratio:()=>{const a=R(2,9),b=R(2,9),k=R(2,6);return{q:"A recipe uses "+a+" cups flour to "+b+" cups milk. If you use "+(a*k)+" cups of flour, how much milk?",ans:String(b*k),input:1,exp:"The ratio scaled by "+k+", so milk is "+b+" × "+k+" = "+(b*k)+" cups."};},
rate:()=>{const n=P([3,4,5,6,8]),per=R(2,12),tot=n*per;return{q:n+" notebooks cost $"+tot+". What is the cost of one notebook?",ans:String(per),input:1,exp:"Divide: $"+tot+" ÷ "+n+" = $"+per+" each."};},
percentof:(p,t)=>{const pc=P(t==3?[12,15,35,45,65,85]:[10,20,25,50,75]);const n=P([20,40,60,80,120,200,240]);return{q:tt("qPctOf",{p:pc,n}),ans:String(Math.round(pc/100*n*100)/100),input:1,traps:[trap(pc,tt("mPctWhole")),trap(Math.round(pc*n/10)/10,tt("mPlaceShift")),trap(n-pc,tt("mSubInstead"))],exp:pc+"% = "+(pc/100)+", and "+(pc/100)+" × "+n+" = "+(Math.round(pc/100*n*100)/100)+"."};},

proportion:()=>{const a=R(2,9),b=R(2,9),k=R(2,7);return{q:"Solve for x: "+a+"/"+b+" = x/"+(b*k),ans:String(a*k),input:1,exp:"The denominator was multiplied by "+k+", so x = "+a+" × "+k+" = "+(a*k)+"."};},

intops:(p,t)=>{const a=R(-15,15),b=R(-15,15);const op=P(t==3?["+","−","×"]:["+","−"]);let ans=op=="+"?a+b:op=="−"?a-b:a*b;const bs=b<0?"("+b+")":String(b);return{q:a+" "+op+" "+bs+" = ?",ans:String(ans),input:1,exp:(op=="×"?"Same signs give a positive, different signs give a negative. ":"")+"The answer is "+ans+"."};},
onestep:()=>{const a=R(2,12),x=R(2,15);const form=P(["mul","add","sub"]);if(form=="mul")return{q:"Solve for x: "+a+"x = "+(a*x),ans:String(x),input:1,exp:"Divide both sides by "+a+": x = "+x+"."};if(form=="add")return{q:"Solve for x: x + "+a+" = "+(x+a),ans:String(x),input:1,exp:"Subtract "+a+" from both sides: x = "+x+"."};return{q:"Solve for x: x − "+a+" = "+x,ans:String(x+a),input:1,exp:"Add "+a+" to both sides: x = "+(x+a)+"."};},

exprules:()=>{const a=R(2,7);let b=R(2,7);while(b===a)b=R(2,7);
  const uniq=(ans,cands)=>{const out=[ans];for(const c of cands){if(out.length<4&&!out.includes(c))out.push(c);}return shuffle(out);};
  const mode=P(["mul","div","pow"]);
  if(mode==="mul"){const ans="x^"+(a+b);return{q:"Simplify: x^"+a+" · x^"+b,opts:uniq(ans,["x^"+(a*b),"x^"+Math.abs(a-b),"x^"+(a+b+1),"2x^"+(a+b)]),ans,exp:"Multiplying powers with the same base adds the exponents: "+a+" + "+b+" = "+(a+b)+"."};}
  if(mode==="div"){const ans="x^"+a;return{q:"Simplify: x^"+(a+b)+" ÷ x^"+b,opts:uniq(ans,["x^"+(a+b),"x^"+b,"x^"+(a+2*b),"x^"+(a+1)]),ans,exp:"Dividing powers with the same base subtracts the exponents: "+(a+b)+" − "+b+" = "+a+"."};}

scinot:()=>{const d=R(1,9)+R(0,99)/100,k=R(3,7);const val=d*Math.pow(10,k);return{q:t("qSciNot",{n:val.toLocaleString(LOCALE[LANG]||"en-US")}),opts:[d+" × 10^"+k,d+" × 10^"+(k+1),(d*10)+" × 10^"+k,d+" × 10^"+(k-1)],ans:d+" × 10^"+k,exp:"Move the decimal so one nonzero digit stays in front: "+d+" × 10^"+k+"."};},

pythag:()=>{const t=P([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[12,16,20],[10,24,26],[20,21,29],[18,24,30],[15,20,25],[12,35,37]]);const k=1;return{q:"A right triangle has legs "+t[0]*k+" and "+t[1]*k+". How long is the hypotenuse?",ans:String(t[2]*k),input:1,exp:"a² + b² = c²: "+(t[0]*t[0])+" + "+(t[1]*t[1])+" = "+(t[2]*t[2])+", so c = "+t[2]+"."};},
arearect:()=>{const a=R(2,14),b=R(2,14);return{q:"A rectangle is "+a+" cm by "+b+" cm. What is its area in square centimeters?",ans:String(a*b),input:1,traps:[trap(2*(a+b),t("mUsedPerim")),trap(a+b,t("mAddedInstead"))],exp:"Area = length × width = "+a+" × "+b+" = "+(a*b)+" cm²."};},

circle:()=>{const r=R(2,12);const mode=P(["area","circ"]);const v=mode=="area"?Math.round(3.14*r*r*100)/100:Math.round(2*3.14*r*100)/100;return{q:t("qCircle",{r,w:mode=="area"?t("wArea"):t("wCirc")}),ans:String(v),input:1,traps:[trap(mode=="area"?Math.round(3.14*(2*r)*(2*r)*100)/100:Math.round(3.14*r*100)/100,t("mRadiusDiam")),trap(mode=="area"?Math.round(2*3.14*r*100)/100:Math.round(3.14*r*r*100)/100,mode=="area"?t("mUsedPerim"):t("mUsedArea"))],exp:(mode=="area"?"A = πr² = 3.14 × "+r+"² = ":"C = 2πr = 2 × 3.14 × "+r+" = ")+v+"."};},
volume:()=>{const a=R(2,9),b=R(2,9),c=R(2,9);return{q:"A rectangular prism is "+a+" × "+b+" × "+c+". What is its volume?",ans:String(a*b*c),input:1,exp:"Volume = l × w × h = "+(a*b*c)+" cubic units."};},
surfarea:()=>{const a=R(2,8),b=R(2,8),c=R(2,8);const sa=2*(a*b+b*c+a*c);return{q:"A box measures "+a+" × "+b+" × "+c+". What is its surface area?",ans:String(sa),input:1,exp:"SA = 2(lw + wh + lh) = 2("+(a*b)+" + "+(b*c)+" + "+(a*c)+") = "+sa+"."};},
angles:(p,t)=>{const mode=P(["comp","supp","tri"]);if(mode=="comp"){const a=R(10,80);return{q:tt("qAngleC",{a}),ans:String(90-a),input:1,exp:"Complementary angles add to 90°, so 90 − "+a+" = "+(90-a)+"°."};}if(mode=="supp"){const a=R(20,160);return{q:tt("qAngleS",{a}),ans:String(180-a),input:1,exp:"Supplementary angles add to 180°, so 180 − "+a+" = "+(180-a)+"°."};}const a=R(20,100),b=R(20,150-a);return{q:"A triangle has angles "+a+"° and "+b+"°. What is the third angle?",ans:String(180-a-b),input:1,exp:"Angles in a triangle add to 180°: 180 − "+a+" − "+b+" = "+(180-a-b)+"°."};},
mmm:()=>{const n=[R(1,9),R(1,9),R(1,9),R(1,9),R(1,9)];const mode=P(["mean","median","range"]);const s=n.slice().sort((x,y)=>x-y);const v=mode=="mean"?Math.round(n.reduce((a,b)=>a+b,0)/5*100)/100:mode=="median"?s[2]:s[4]-s[0];return{q:t("qFindStat",{m:t({mean:"wMean",median:"wMedian",range:"wRange"}[mode]||"wMean"),list:n.join(", ")}),ans:String(v),input:1,exp:mode=="mean"?"Add them (" +n.reduce((a,b)=>a+b,0)+") and divide by 5 = "+v+".":mode=="median"?"Sorted: "+s.join(", ")+". The middle value is "+v+".":"Largest "+s[4]+" − smallest "+s[0]+" = "+v+"."};},
prob:()=>{const r=R(2,8),b=R(2,8),g=R(1,5);const tot=r+b+g;const[sn,sd]=simp(r,tot);return{q:"A bag holds "+r+" red, "+b+" blue, and "+g+" green marbles. What is P(red)? Write as a fraction in simplest form.",ans:sn+"/"+sd,input:1,exp:r+" red out of "+tot+" total = "+r+"/"+tot+(sd!==tot?", which simplifies to "+sn+"/"+sd:"")+".",frac:1};},
timehour:()=>{const h=R(1,12);const half=P([0,30]);const tm=h+":"+(half?"30":"00");return{q:tt("qClock",{h:(half?h+"–"+((h%12)+1):h),m:(half?"6":"12")}),opts:shuffle([tm,(h%12+1)+":"+(half?"30":"00"),h+":"+(half?"00":"30"),(h%12+1)+":15"]),ans:tm,exp:"The hour is "+h+" and the minutes are "+(half?"30":"00")+"."};},

elapsed:()=>{const h=R(1,10),m=P([0,15,30,45]),add=R(20,180);const start=new Date(2020,0,1,h,m);const end=new Date(start.getTime()+add*60000);const f=d=>((d.getHours()%12)||12)+":"+String(d.getMinutes()).padStart(2,"0");return{q:"A class starts at "+f(start)+" and lasts "+add+" minutes. What time does it end?",opts:shuffle([f(end),f(new Date(end.getTime()+15*60000)),f(new Date(end.getTime()-30*60000)),f(new Date(end.getTime()+60*60000))]),ans:f(end),exp:add+" minutes is "+Math.floor(add/60)+" h "+(add%60)+" min after "+f(start)+", which is "+f(end)+"."};},

/* ---- table-driven: one table powers a skill in each direction ---- */
pairs:(p)=>{const T=TBL[p.t];const row=P(T);
  const pool=[...new Set(T.map(r=>r[1]).filter(x=>x!==row[1]))];
  const qt=typeof p.q==="string"?p.q:(p.q&&p.q.k?t(p.q.k):"{}");
  return {q:(qt||"{}").replace("{}",row[0]),ans:row[1],
    opts:shuffle([row[1],...shuffle(pool).slice(0,3)]),
    exp:(p.e||"{0} → {1}").replace("{0}",row[0]).replace("{1}",row[1])};},
pairsR:(p)=>{const T=TBL[p.t];const row=P(T);
  const pool=[...new Set(T.map(r=>r[0]).filter(x=>x!==row[0]))];
  const qt=typeof p.q==="string"?p.q:(p.q&&p.q.k?t(p.q.k):"{}");
  return {q:(qt||"{}").replace("{}",row[1]),ans:row[0],
    opts:shuffle([row[0],...shuffle(pool).slice(0,3)]),
    exp:(p.e||"{1} → {0}").replace("{0}",row[0]).replace("{1}",row[1])};},

/* ---- number facts ---- */
times:(p)=>{const b=R(0,12);return{q:p.n+" × "+b+" = ?",ans:String(p.n*b),input:1,traps:[trap(p.n+b,t("mAddedInstead")),trap(p.n*b-p.n,t("mOffOne")),trap(p.n*(b+1),t("mOffOne"))],hints:[b>1?("Use a fact you know: "+p.n+" × "+(b-1)+" = "+(p.n*(b-1))+", then add "+p.n+"."):("Anything × 1 stays the same."),p.n+" added "+b+" time"+(b===1?"":"s")+"."],model:(b>0&&p.n*b<=48)?()=>arrayGrid(p.n,b,p.n+" rows of "+b):null,exp:t("eTimes",{a:p.n,b,v:p.n*b})};},
divby:(p)=>{const q=R(1,12);return{q:(p.n*q)+" ÷ "+p.n+" = ?",ans:String(q),input:1,traps:[trap(p.n*q*p.n,t("mDivFlip")),trap(q-1,t("mOffOne")),trap(p.n*q-p.n,t("mSubInstead"))],hints:["Ask: "+p.n+" times what makes "+(p.n*q)+"?","Count up in "+p.n+"s until you reach "+(p.n*q)+"."],exp:p.n+" × "+q+" = "+(p.n*q)+"."};},
addmiss:(p)=>{const a=R(1,p.max-1),t=R(a+1,p.max);return{q:a+" + ___ = "+t,ans:String(t-a),input:1,exp:t+" − "+a+" = "+(t-a)+"."};},
submiss:(p)=>{const t=R(2,p.max),a=R(1,t);return{q:t+" − ___ = "+a,ans:String(t-a),input:1,exp:t+" − "+a+" = "+(t-a)+"."};},
evenodd:()=>{const n=R(1,200);const e=t("wEven"),o=t("wOdd");return{q:t("qEvenOdd",{n}),opts:[e,o],ans:n%2?o:e,exp:t("eEvenOdd",{d:String(n).slice(-1),w:n%2?o:e})};},
expanded:(p)=>{let n=R(p.min,p.max),guard=0;
  while(String(n).replace(/0/g,"").length<2&&guard++<20)n=R(p.min,p.max);
  const parts=String(n).split("").map((d,i,a)=>Number(d)*Math.pow(10,a.length-1-i)).filter(x=>x);
  return{q:t("qExpanded",{n}),opts:shuffle([parts.join(" + "),parts.slice().reverse().join(" + "),parts.map(x=>x+1).join(" + "),String(n).split("").join(" + ")]),ans:parts.join(" + "),exp:parts.join(" + ")+" = "+n+"."};},
prime:()=>{const isP=x=>{if(x<2)return false;for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true;};
  const n=R(2,60);return{q:t("qPrimeQ",{n}),opts:[t("wPrime"),t("wComposite")],ans:isP(n)?t("wPrime"):t("wComposite"),
    exp:isP(n)?n+" has no factors besides 1 and itself.":n+" divides by "+(()=>{for(let i=2;i*i<=n;i++)if(n%i===0)return i;})()+"."};},
primefac:()=>{const n=P([12,18,20,24,28,30,36,40,42,45,48,50,54,56,60,72]);const f=[];let x=n;
  for(let d=2;d<=x;d++)while(x%d===0){f.push(d);x/=d;}
  return{q:t("qPrimeFac",{n}),ans:f.join("×"),input:1,exp:f.join(" × ")+" = "+n+". Type it as "+f.join("×")+"."};},
multiples:(p)=>{const n=p.n||R(2,9),k=R(1,12);return{q:t("qMultiple",{k,n}),ans:String(n*k),input:1,exp:n+" × "+k+" = "+(n*k)+"."};},
seqA:()=>{const a=R(1,20),d=R(2,12)*P([1,1,1,-1]);const t=[a,a+d,a+2*d,a+3*d];
  return{q:tt("qSeq",{seq:t.join(", ")}),ans:String(a+4*d),input:1,exp:"Each step "+(d>0?"adds ":"subtracts ")+Math.abs(d)+", so the next term is "+(a+4*d)+"."};},
seqG:()=>{const a=R(1,5),r=R(2,4);const t=[a,a*r,a*r*r,a*r*r*r];
  return{q:tt("qSeq",{seq:t.join(", ")}),ans:String(a*Math.pow(r,4)),input:1,exp:"Each term is multiplied by "+r+"."};},

/* ---- fractions and decimals ---- */
fracsub:()=>{const d=P([4,5,6,8,10,12]);const a=R(2,d-1),bq=R(1,a-1>0?a-1:1);const[sn,sd]=simp(a-bq,d);
  return{q:a+"/"+d+" − "+bq+"/"+d+" = ? (simplest form)",ans:sn+"/"+sd,input:1,traps:[trap((a-bq)+"/"+d,t("mNoSimplify")),trap((a-bq)+"/0",t("mAddedDenoms"))],frac:1,exp:"Subtract the numerators: "+(a-bq)+"/"+d+" = "+sn+"/"+sd+"."};},
fracsubun:()=>{const d1=P([2,3,4,5,6]),d2=P([3,4,6,8,10].filter(x=>x!==d1));
  let a=R(1,d1-1),bq=R(1,d2-1);let n=a*d2-bq*d1;if(n<=0){const t=a;a=bq;bq=t;n=Math.abs(a*d2-bq*d1)||1;}
  const d=d1*d2;const[sn,sd]=simp(Math.abs(a*d2-bq*d1),d);
  return{q:a+"/"+d1+" − "+bq+"/"+d2+" = ? (simplest form)",ans:sn+"/"+sd,input:1,frac:1,exp:"Common denominator "+d+", giving "+Math.abs(a*d2-bq*d1)+"/"+d+" = "+sn+"/"+sd+"."};},
fracdiv:()=>{const a=R(1,6),bq=R(2,8),c=R(1,6),d=R(2,8);const[sn,sd]=simp(a*d,bq*c);
  return{q:a+"/"+bq+" ÷ "+c+"/"+d+" = ? (simplest form)",ans:sn+"/"+sd,input:1,frac:1,exp:"Multiply by the reciprocal: "+a+"/"+bq+" × "+d+"/"+c+" = "+sn+"/"+sd+"."};},
fracof:()=>{const d=P([2,3,4,5,6,8,10]),n=R(1,d-1),k=R(2,12);const tot=d*k;
  return{q:"What is "+n+"/"+d+" of "+tot+"?",ans:String(n*k),input:1,exp:tot+" ÷ "+d+" = "+k+", and "+k+" × "+n+" = "+(n*k)+"."};},
mixed2imp:()=>{const w=R(1,6),d=P([2,3,4,5,6,8]),n=R(1,d-1);
  return{q:"Write "+w+" "+n+"/"+d+" as an improper fraction.",ans:(w*d+n)+"/"+d,input:1,frac:1,exp:w+" × "+d+" + "+n+" = "+(w*d+n)+", so "+(w*d+n)+"/"+d+"."};},
imp2mixed:()=>{const d=P([2,3,4,5,6,8]),w=R(1,6),n=R(1,d-1);
  return{q:"Write "+(w*d+n)+"/"+d+" as a mixed number (like 2 1/3).",ans:w+" "+n+"/"+d,input:1,exp:(w*d+n)+" ÷ "+d+" = "+w+" remainder "+n+"."};},
fraccmpU:()=>{const d1=P([2,3,4,5,6,8]),d2=P([3,4,5,6,8,10].filter(x=>x!==d1));
  const a=R(1,d1-1),bq=R(1,d2-1);const l=a/d1,r=bq/d2;const ans=l>r?">":l<r?"<":"=";
  return{q:t("qCompareF",{a:a+"/"+d1,b:bq+"/"+d2}),opts:["<",">","="],ans,exp:"Common denominator "+(d1*d2)+": "+(a*d2)+" vs "+(bq*d1)+"."};},
dec2frac:()=>{const n=R(1,99);const[sn,sd]=simp(n,100);
  return{q:t("qWriteAs",{a:"0."+String(n).padStart(2,"0"),b:t("wFraction")}),ans:sn+"/"+sd,input:1,frac:1,exp:n+"/100 simplifies to "+sn+"/"+sd+"."};},
frac2dec:()=>{const pick=P([[1,2],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,8],[3,8],[5,8],[7,8],[1,10],[3,10],[7,10],[1,20],[1,25]]);
  const v=pick[0]/pick[1];return{q:t("qWriteAs",{a:pick[0]+"/"+pick[1],b:t("wDecimal")}),ans:String(v),input:1,exp:pick[0]+" ÷ "+pick[1]+" = "+v+"."};},
deccmp:(p)=>{const f=Math.pow(10,p.places||2);const a=R(1,999)/f,b=R(1,999)/f;
  const ans=a>b?">":a<b?"<":"=";return{q:t("qCompareF",{a:a.toFixed(p.places||2),b:b.toFixed(p.places||2)}),opts:["<",">","="],ans,exp:"Compare place by place from the left."};},
decround:(p)=>{const v=R(1000,99999)/1000;const to=p.to;const r=Math.round(v*Math.pow(10,to))/Math.pow(10,to);
  const names={0:"whole number",1:"tenth",2:"hundredth"};
  return{q:t("qRoundTo",{n:v.toFixed(3),to:names[to]}),ans:String(r),input:1,exp:"Look one place to the right, then round to "+r+"."};},
decdiv10:(p)=>{const n=R(10,9999)/10,k=P([10,100,1000]);const op=P(["×","÷"]);
  const v=op==="×"?n*k:n/k;return{q:n+" "+op+" "+k+" = ?",ans:String(Number(v.toFixed(5))),input:1,exp:"Shift the decimal point "+(String(k).length-1)+" places "+(op==="×"?"right":"left")+"."};},
decdiv:()=>{const q=R(2,20),d=R(2,9);const n=Math.round(q*d*100)/100;
  return{q:(n).toFixed(2)+" ÷ "+d+" = ?",ans:String(Number((n/d).toFixed(4))),input:1,exp:"Divide as whole numbers, then place the decimal point: "+Number((n/d).toFixed(4))+"."};},

/* ---- integers, powers, roots ---- */
absval:()=>{const n=R(-40,40);return{q:"What is |"+n+"| ?",ans:String(Math.abs(n)),input:1,model:()=>numberLine(-40,40,[{v:n,t:String(n)},{v:0,t:"0",c:"var(--lime)"}],"Number line"),exp:"Absolute value is the distance from zero, so "+Math.abs(n)+"."};},
intmuldiv:()=>{const a=R(2,12)*P([1,-1]),b=R(2,12)*P([1,-1]);const op=P(["×","÷"]);
  if(op==="×")return{q:a+" × ("+b+") = ?",ans:String(a*b),input:1,exp:"Same signs give a positive, different signs give a negative: "+(a*b)+"."};
  return{q:(a*b)+" ÷ ("+b+") = ?",ans:String(a),input:1,exp:"Different signs give a negative, same signs a positive: "+a+"."};},
expo:()=>{const b=R(2,9),e=R(2,4);return{q:"What is "+b+"^"+e+" ?",ans:String(Math.pow(b,e)),input:1,traps:[trap(b*e,t("mSquaredOnce")),trap(Math.pow(b,e)-b,t("mOffOne"))],exp:b+" multiplied by itself "+e+" times is "+Math.pow(b,e)+"."};},
cuberoot:()=>{const n=R(2,10);return{q:"What is the cube root of "+(n*n*n)+"?",ans:String(n),input:1,exp:n+" × "+n+" × "+n+" = "+(n*n*n)+"."};},
negexp:()=>{const b=R(2,5),e=R(1,3);return{q:"Write "+b+"^-"+e+" as a fraction.",ans:"1/"+Math.pow(b,e),input:1,frac:1,exp:"A negative exponent means one over the positive power: 1/"+Math.pow(b,e)+"."};},
scinotBack:()=>{const d=R(1,9)+R(0,99)/100,k=R(2,6);const val=d*Math.pow(10,k);
  return{q:"Write "+d+" × 10^"+k+" as an ordinary number.",ans:String(Math.round(val*100)/100),input:1,exp:"Move the decimal point "+k+" places right."};},

/* ---- algebra ---- */
onestepOp:(p)=>{const a=R(2,12),x=R(2,15);
  if(p.op==="+")return{q:t("qSolveX",{e:"x + "+a+" = "+(x+a)}),ans:String(x),input:1,traps:[trap(x+2*a,t("mAddInstead")),trap(x+a,t("mBothSides"))],exp:"Subtract "+a+" from both sides."};
  if(p.op==="-")return{q:t("qSolveX",{e:"x − "+a+" = "+x}),ans:String(x+a),input:1,exp:"Add "+a+" to both sides."};
  if(p.op==="*")return{q:t("qSolveX",{e:a+"x = "+(a*x)}),ans:String(x),input:1,traps:[trap(a*x*a,t("mDivFlip")),trap(a*x-a,t("mSubInstead"))],exp:"Divide both sides by "+a+"."};
  return{q:t("qSolveX",{e:"x ÷ "+a+" = "+x}),ans:String(a*x),input:1,exp:"Multiply both sides by "+a+"."};},
liketerms:()=>{const a=R(2,9),b=R(2,9),c=R(1,9),d=R(1,9);
  return{q:"Simplify: "+a+"x + "+c+" + "+b+"x + "+d,opts:shuffle([(a+b)+"x + "+(c+d),(a+b)+"x + "+(c*d),(a*b)+"x + "+(c+d),(a+b+c+d)+"x"]),
    ans:(a+b)+"x + "+(c+d),exp:"Add the x terms and the numbers separately."};},
inequality:()=>{const a=R(2,9),x=R(2,12);
  return{q:"Solve:  "+a+"x < "+(a*x),opts:shuffle(["x < "+x,"x > "+x,"x < "+(x+a),"x > "+(x-1)]),ans:"x < "+x,exp:"Divide both sides by "+a+", keeping the direction because "+a+" is positive."};},
functable:()=>{const m=R(2,6),b=R(-6,8),x=R(1,9);
  return{q:t("qRule",{e:m+"x "+(b<0?"− "+Math.abs(b):"+ "+b),x}),ans:String(m*x+b),input:1,exp:m+"×"+x+(b<0?" − "+Math.abs(b):" + "+b)+" = "+(m*x+b)+"."};},
slopeint:(p)=>{const m=R(-6,6)||3,b=R(-9,9);
  const askM=p.part==="m";
  return{q:"For y = "+m+"x "+(b<0?"− "+Math.abs(b):"+ "+b)+", what is the "+(askM?"slope":"y-intercept")+"?",
    ans:String(askM?m:b),input:1,exp:"In y = mx + b the slope is m and the y-intercept is b."};},
midpoint:()=>{const x1=R(-8,8),y1=R(-8,8),x2=x1+2*R(1,6),y2=y1+2*R(1,6);
  return{q:"What is the midpoint of ("+x1+", "+y1+") and ("+x2+", "+y2+")? Write it as x,y",ans:((x1+x2)/2)+","+((y1+y2)/2),input:1,exp:"Average the x values and the y values."};},
distform:()=>{const t=P([[3,4,5],[6,8,10],[5,12,13],[8,15,17]]);const x1=R(-5,5),y1=R(-5,5);
  return{q:"How far is ("+x1+", "+y1+") from ("+(x1+t[0])+", "+(y1+t[1])+")?",ans:String(t[2]),input:1,exp:"√("+t[0]+"² + "+t[1]+"²) = √"+(t[2]*t[2])+" = "+t[2]+"."};},
quadrant:()=>{const x=R(1,9)*P([1,-1]),y=R(1,9)*P([1,-1]);
  const q=x>0&&y>0?"I":x<0&&y>0?"II":x<0&&y<0?"III":"IV";
  return{q:"Which quadrant contains ("+x+", "+y+")?",opts:["I","II","III","IV"],ans:q,exp:(x>0?"x is positive":"x is negative")+" and "+(y>0?"y is positive":"y is negative")+", so quadrant "+q+"."};},

/* ---- geometry and measurement ---- */
paral:()=>{const b=R(3,15),h=R(2,12);return{q:"A parallelogram has base "+b+" and height "+h+". What is its area?",ans:String(b*h),input:1,traps:[trap(b*h/2,t("mForgotHalf")),trap(2*(b+h),t("mUsedPerim"))],exp:"Area = base × height = "+(b*h)+"."};},
trapez:()=>{const a=R(3,12),b=R(a+1,18),h=P([2,4,6,8,10]);
  return{q:"A trapezium has parallel sides "+a+" and "+b+" with height "+h+". What is its area?",ans:String((a+b)*h/2),input:1,exp:"Area = ½ × ("+a+" + "+b+") × "+h+" = "+((a+b)*h/2)+"."};},
cylinder:(p)=>{const r=R(2,8),h=R(3,12);
  const v=Math.round(3.14*r*r*h*100)/100, sa=Math.round((2*3.14*r*r+2*3.14*r*h)*100)/100;
  return p.mode==="v"?{q:t("qCircle",{r:r+" ("+t("wVolume")+", h="+h+")",w:t("wVolume")}),ans:String(v),input:1,exp:"V = πr²h = 3.14 × "+(r*r)+" × "+h+" = "+v+"."}
   :{q:t("qCircle",{r:r+" (h="+h+")",w:t("wSurface")}),ans:String(sa),input:1,exp:"SA = 2πr² + 2πrh = "+sa+"."};},
perimShape:(p)=>{const n=p.n,side=R(2,20);return{q:t("qPerim",{n,s:side}),ans:String(n*side),input:1,exp:n+" sides × "+side+" cm = "+(n*side)+" cm."};},
angleType:()=>{const kinds=[["an angle less than 90°","acute"],["an angle of exactly 90°","right"],["an angle between 90° and 180°","obtuse"],["an angle of exactly 180°","straight"],["an angle greater than 180°","reflex"]];
  const k=P(kinds);return{q:"What do you call "+k[0]+"?",opts:shuffle([k[1],...shuffle(kinds.filter(x=>x[1]!==k[1]).map(x=>x[1])).slice(0,3)]),ans:k[1],exp:k[0]+" is "+k[1]+"."};},
polyangle:()=>{const n=P([3,4,5,6,8,10,12]);
  return{q:"What do the interior angles of a "+n+"-sided polygon add up to?",ans:String((n-2)*180),input:1,exp:"(n − 2) × 180 = ("+n+" − 2) × 180 = "+((n-2)*180)+"°."};},
convMetric:(p)=>{const set=P(p.set);const n=R(2,40);
  return{q:t("qConvert",{n,a:set[0],b:set[1]}),ans:String(Number((n*set[2]).toFixed(4))),input:1,exp:"1 "+set[0].replace(/s$/,"")+" = "+set[2]+" "+set[1]+"."};},
timeUnit:()=>{const set=P([["minutes","seconds",60],["hours","minutes",60],["days","hours",24],["weeks","days",7],["years","months",12]]);
  const n=R(2,12);return{q:"How many "+set[1]+" are in "+n+" "+set[0]+"?",ans:String(n*set[2]),input:1,exp:n+" × "+set[2]+" = "+(n*set[2])+"."};},
simpleint:()=>{const pr=P([200,400,500,800,1000,1500]),rt=P([2,3,4,5,6,8]),t=R(1,5);
  return{q:tt("qInterest",{p:pr,r:rt,y:t}),ans:String(pr*rt*t/100),input:1,exp:"I = P × r × t = "+pr+" × 0."+String(rt).padStart(2,"0")+" × "+t+" = "+(pr*rt*t/100)+"."};},
discount:()=>{const pr=P([20,25,40,50,60,80,120]),pc=P([10,15,20,25,30,50]);
  return{q:t("qDiscount",{p:pr,d:pc}),ans:String(Number((pr-pr*pc/100).toFixed(2))),input:1,exp:pc+"% of "+pr+" is "+(pr*pc/100)+", so you pay "+(pr-pr*pc/100)+"."};},
unitprice:()=>{const n=P([2,3,4,5,6,8,10,12]),each=P([0.25,0.5,0.75,1.2,1.5,2,2.5]);
  const tot=Number((n*each).toFixed(2));return{q:t("qUnitPrice",{n,t:tot}),ans:String(each),input:1,exp:"$"+tot+" ÷ "+n+" = $"+each+"."};},
statOne:(p)=>{const n=[R(1,20),R(1,20),R(1,20),R(1,20),R(1,20)];
  const s=n.slice().sort((a,b)=>a-b);
  const v=p.mode==="mean"?Math.round(n.reduce((a,b)=>a+b,0)/5*100)/100:p.mode==="median"?s[2]:p.mode==="range"?s[4]-s[0]:s[0];
  return{q:t("qFindStat",{m:t({mean:"wMean",median:"wMedian",range:"wRange",mode:"wMode"}[p.mode]||"wMean"),list:n.join(", ")}),ans:String(v),input:1,
    exp:p.mode==="mean"?"Add them ("+n.reduce((a,b)=>a+b,0)+") and divide by 5.":p.mode==="median"?"Sorted: "+s.join(", ")+".":"Largest minus smallest."};},
probComp:()=>{const r=R(2,6),b=R(2,6);const tot=r+b;
  const[sn,sd]=simp(r*(r-1),tot*(tot-1));
  return{q:"A bag has "+r+" red and "+b+" blue counters. Two are drawn without replacing. P(both red)? Simplest form.",ans:sn+"/"+sd,input:1,frac:1,
    exp:r+"/"+tot+" × "+(r-1)+"/"+(tot-1)+" = "+sn+"/"+sd+"."};},
combos:()=>{const a=R(2,6),b=R(2,6);
  return{q:"A menu has "+a+" mains and "+b+" sides. How many different meals of one main and one side?",ans:String(a*b),input:1,exp:a+" × "+b+" = "+(a*b)+"."};},
boolq:()=>{const a=P([true,false]),b=P([true,false]),op=P(["AND","OR"]);
  const v=op==="AND"?(a&&b):(a||b);
  return{q:"What is "+a+" "+op+" "+b+"?",opts:["True","False"],ans:v?"True":"False",exp:op==="AND"?"AND is true only when both sides are true.":"OR is true when either side is true."};},
binaryTo:()=>{const n=R(3,255);return{q:"Write "+n+" in binary.",ans:n.toString(2),input:1,exp:n+" = "+n.toString(2)+" in base 2."};},
/* ---- more number work ---- */
mulSize:(p)=>{const a=R(p.a[0],p.a[1]),b=R(p.b[0],p.b[1]);return{q:a+" × "+b+" = ?",ans:String(a*b),input:1,exp:"Break it apart if it helps: "+a+" × "+b+" = "+(a*b)+"."};},
divRem:(p)=>{const d=R(2,p.max||9),q=R(p.qmin||2,p.qmax||40),r=R(1,d-1);
  return{q:t("qRemainder",{a:d*q+r,b:d}),ans:String(r),input:1,exp:d+" × "+q+" = "+(d*q)+", leaving "+r+"."};},
mulPow10:(p)=>{const n=R(2,99),k=P([10,100,1000]);const op=p.op||"×";
  return op==="×"?{q:n+" × "+k+" = ?",ans:String(n*k),input:1,exp:"Add "+(String(k).length-1)+" zeros: "+(n*k)+"."}
   :{q:(n*k)+" ÷ "+k+" = ?",ans:String(n),input:1,exp:"Remove "+(String(k).length-1)+" zeros: "+n+"."};},
add3:(p)=>{const a=R(1,p.max),b=R(1,p.max),c=R(1,p.max);
  return{q:a+" + "+b+" + "+c+" = ?",ans:String(a+b+c),input:1,exp:"Add two at a time: "+(a+b)+" + "+c+" = "+(a+b+c)+"."};},
subZeros:()=>{const a=P([100,200,300,500,1000,2000,5000]),b=R(11,99);
  return{q:a+" − "+b+" = ?",ans:String(a-b),input:1,exp:"Regroup across the zeros: "+a+" − "+b+" = "+(a-b)+"."};},
estimate:(p)=>{const a=R(11,89)*10+R(1,9),b=R(11,89)*10+R(1,9);
  const ra=Math.round(a/10)*10,rb=Math.round(b/10)*10;
  return p.op==="+"?{q:t("qEstimate",{a,b}),ans:String(ra+rb),input:1,exp:a+"→"+ra+", "+b+"→"+rb+", giving "+(ra+rb)+"."}

function t(k,v){
  let out=(I18N[LANG]&&I18N[LANG][k])!=null?I18N[LANG][k]:(I18N.en[k]!=null?I18N.en[k]:k);
  if(v)Object.keys(v).forEach(x=>{out=out.split("{"+x+"}").join(v[x]);});
  return out;
}
const tt=(k,v)=>t(k,v);      /* alias: some generators use t as a local variable */
const num=n=>Number(n).toLocaleString(LOCALE[LANG]||"en-US");
/* ---- read aloud: browser speech, matched to the interface language ---- */
const SPEECH_OK=typeof window!=="undefined"&&"speechSynthesis"in window;
function sayable(txt){
  return String(txt)
    .replace(/×/g," times ").replace(/÷/g," divided by ").replace(/−/g," minus ")
    .replace(/\+/g," plus ").replace(/=/g," equals ").replace(/\bx\^(\d+)/g,"x to the power $1")
    .replace(/(\d+)\/(\d+)/g,"$1 over $2").replace(/\s+/g," ").trim();
}
function speak(txt){
  if(!SPEECH_OK||!st.speak)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(sayable(txt));
    u.lang=LOCALE[LANG]||"en-US";
    u.rate=.92;u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeech(){if(SPEECH_OK){try{speechSynthesis.cancel();}catch(e){}}}
function toggleSpeak(){
  st.speak=!st.speak;save();
  if(!st.speak)stopSpeech();
  render();
  if(st.speak&&sess&&sess.q)speak(sess.q.q);
  toast(st.speak?t("readOn"):t("readOff"));
}
function sayQuestion(){
  if(!sess||!sess.q)return;
  const parts=[sess.q.q];
  if(sess.q.opts)parts.push(sess.q.opts.map((o,i)=>(i+1)+". "+o).join(". "));
  const was=st.speak;st.speak=true;speak(parts.join(". "));st.speak=was;
}
const subjName=id=>t("sub"+id.charAt(0).toUpperCase()+id.slice(1));
const skillName=s=>!s?"":(typeof s.name==="string"?s.name:t(s.name.k,s.name.v));
const barA11y=(pct,label)=>`role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"${label?` aria-label="${label}"`:""}`;
function applyLang(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=RTL.includes(LANG)?"rtl":"ltr";
}
function setLang(code){
  if(!I18N[code])return;
  LANG=code;st.lang=code;
  try{STORE.set("yet:lang",code);}catch(e){}
  if(ACC.active)save();
  applyLang();render();window.scrollTo({top:0,behavior:"instant"});
}
function langPicker(){
  return `<select id="langSel" aria-label="${t("language")}" onchange="setLang(this.value)"
    style="border:2px solid var(--ink);border-radius:999px;padding:5px 9px;background:var(--card);color:inherit;font:700 13px var(--body);max-width:9.5rem">
    ${LANGS.map(([c,n,f])=>`<option value="${c}" ${LANG===c?"selected":""}>${f} ${n}</option>`).join("")}
  </select>`;
}

const SEEN=new Set();
function S(sub,grade,name,gen,p){
  const shown=typeof name==="string"?name
    :String((I18N.en[name.k]||name.k)).replace(/\{(\w+)\}/g,(m,x)=>((name.v||{})[x]));
  const key=sub+"|"+shown;
  if(SEEN.has(key))return;                       /* first registration wins */
  SEEN.add(key);
  counters[sub+grade]=(counters[sub+grade]||0)+1;
  SKILLS.push({id:PREFIX[sub]+grade+"."+counters[sub+grade],sub,grade,name,gen,p:p||{}});
}

const BUILD="all";                 /* all | kid | parent | admin — set per build */
const SOLO=BUILD!=="all";
const adultBuild=BUILD==="parent"||BUILD==="admin";
/* Storage: use the host's API when it exists (the Claude artifact preview
   provides window.storage), otherwise fall back to this browser's own
   localStorage, and finally to memory so nothing ever throws. */
const STORE=(()=>{
  /* Resolve the host API at CALL time, not at parse time. A cloud adapter
     loaded with <script type="module"> is deferred and therefore runs AFTER
     this script, so checking once here would always miss it. */
  const PRE="yet.store.";
  let ls=null;
  try{const k=PRE+"__t";window.localStorage.setItem(k,"1");window.localStorage.removeItem(k);ls=window.localStorage;}catch(e){ls=null;}
  const mem={};
  const host=()=>(typeof window!=="undefined"&&window.storage&&typeof window.storage.get==="function")?window.storage:null;
  const local={
    async get(k){const v=ls?ls.getItem(PRE+k):mem[k];if(v==null)throw new Error("missing "+k);return{key:k,value:v};},
    async set(k,v){if(ls)ls.setItem(PRE+k,String(v));else mem[k]=String(v);return{key:k,value:v};},
    async delete(k){if(ls)ls.removeItem(PRE+k);else delete mem[k];return{key:k,deleted:true};},
    async list(pre){const out=[];
      if(ls){for(let i=0;i<ls.length;i++){const kk=ls.key(i);
        if(kk&&kk.indexOf(PRE)===0){const n=kk.slice(PRE.length);if(!pre||n.indexOf(pre)===0)out.push(n);}}}
      else out.push(...Object.keys(mem).filter(n=>!pre||n.indexOf(pre)===0));
      return {keys:out};}
  };
  return {
    get kind(){return host()?"host":(ls?"local":"memory");},
    async get(k){const h=host();return h?h.get(k):local.get(k);},
    async set(k,v){const h=host();return h?h.set(k,v):local.set(k,v);},
    async delete(k){const h=host();return h?h.delete(k):local.delete(k);},
    async list(p){const h=host();return h&&h.list?h.list(p):local.list(p);}
  };
})();

const DEFAULT={grade:"3",xp:0,coins:40,streak:0,bestStreak:0,lastDay:null,days:{},prog:{},due:{},bestWeek:0,asked:0,right:0,secs:0,
