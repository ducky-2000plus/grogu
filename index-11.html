lsTimes:"Multiplying is adding the same number over and over. 4 × 3 means four groups of three.|4 × 3 = ?|Draw 4 groups with 3 in each;Count them all: 3, 6, 9, 12;So 4 × 3 = 12",lsDiv:"Dividing shares a number into equal groups. 12 ÷ 3 asks: how many threes fit into twelve?|12 ÷ 3 = ?|Count up in 3s: 3, 6, 9, 12;That took 4 steps;So 12 ÷ 3 = 4",lsAdd:"Adding puts two amounts together. Start at the first number and count on.|8 + 5 = ?|Start at 8;Count on 5: 9, 10, 11, 12, 13;So 8 + 5 = 13",lsSub:"Subtracting takes one amount away. Count back, or ask what you would add to get there.|13 − 5 = ?|Start at 13 and count back 5: 12, 11, 10, 9, 8;So 13 − 5 = 8",lsMul:"For bigger numbers, break one apart. 23 × 4 is easier as 20 × 4 plus 3 × 4.|23 × 4 = ?|20 × 4 = 80;3 × 4 = 12;80 + 12 = 92",lsRem:"Sometimes a number will not share out evenly. What is left over is the remainder.|17 ÷ 5 = ?|5 × 3 = 15, which fits;17 − 15 = 2 left over;So 3 remainder 2",lsFracCmp:"When two fractions have the same bottom number, the pieces are the same size. More pieces means more.|Compare 3/8 and 5/8|Both are eighths, so the pieces match;5 pieces beats 3 pieces;So 3/8 < 5/8",lsFracCmpU:"Different bottom numbers mean different sized pieces. Give them the same bottom number first.|Compare 2/3 and 3/5|Use fifteenths: 2/3 = 10/15;3/5 = 9/15;10 > 9, so 2/3 > 3/5",lsFracSimp:"Simplifying finds the same amount written with smaller numbers. Divide top and bottom by what they share.|Simplify 6/8|Both divide by 2;6 ÷ 2 = 3 and 8 ÷ 2 = 4;So 6/8 = 3/4",lsFracAdd:"With the same bottom number, add only the tops. The size of the pieces does not change.|1/5 + 2/5 = ?|Add the tops: 1 + 2 = 3;Keep the bottom as 5;So 3/5",lsFracSub:"Same idea for subtracting: take the tops away and leave the bottom alone.|4/7 − 2/7 = ?|Subtract the tops: 4 − 2 = 2;Bottom stays 7;So 2/7",lsFracMul:"To multiply fractions, multiply across the top and across the bottom.|2/3 × 3/4 = ?|Tops: 2 × 3 = 6;Bottoms: 3 × 4 = 12;6/12 simplifies to 1/2",lsHalf:"A fraction is more than a half when the top is more than half the bottom.|Is 5/8 more than 1/2?|Half of 8 is 4;The top is 5, which is more than 4;So 5/8 is greater than 1/2",lsMixed:"A mixed number like 2 1/3 means two wholes and a third. Turn the wholes into thirds to make one fraction.|Write 2 1/3 as an improper fraction|Each whole is 3 thirds, so 2 wholes is 6;Add the extra 1 third: 6 + 1 = 7;So 7/3",lsPct:"Percent means out of a hundred. To find a percent of a number, work out one percent first, or use a fraction you know.|What is 25% of 60?|25% is the same as one quarter;60 ÷ 4 = 15;So 25% of 60 is 15",lsPctFrac:"Every percent is a fraction over 100. Simplify it and you have the fraction.|Write 75% as a fraction|75% means 75/100;Both divide by 25;So 3/4",lsDiscount:"A discount takes part of the price away. Find the discount, then subtract it.|A $40 item is 25% off|25% of 40 is 10;40 − 10 = 30;The sale price is $30",lsArea:"Area is how much space is inside a shape. For a rectangle, multiply the two sides.|A rectangle 6 by 4|Area = length × width;6 × 4 = 24;So 24 square units",lsTri:"A triangle is exactly half of the rectangle around it, so work out the rectangle and halve it.|Base 8, height 5|8 × 5 = 40;Halve it: 40 ÷ 2 = 20;So the area is 20",lsPerim:"Perimeter is the distance all the way round the edge. Add every side.|A rectangle 7 by 3|Two long sides: 7 + 7 = 14;Two short sides: 3 + 3 = 6;14 + 6 = 20",lsCircle:"Radius is the middle to the edge. Area uses the radius squared; circumference uses the radius doubled.|A circle with radius 5|Area = π × 5 × 5 = 78.5;Circumference = 2 × π × 5 = 31.4;π is about 3.14",lsOneStep:"To solve for x, undo whatever was done to it — and do the same to both sides.|x + 7 = 12|7 was added, so subtract 7;Do it to both sides: x = 12 − 7;x = 5",lsTwoStep:"Two steps means undoing twice. Take away the added number first, then undo the multiplying.|3x + 4 = 19|Subtract 4 from both sides: 3x = 15;Divide both sides by 3;x = 5",lsLike:"Like terms have the same letter. Add those together, and add the plain numbers separately.|2x + 5 + 3x + 1|x terms: 2x + 3x = 5x;Numbers: 5 + 1 = 6;So 5x + 6",lsInt:"On a number line, numbers get smaller as you go left. So −7 is less than −2.|Compare −7 and −2|Picture the line: −7 sits further left;Further left means smaller;So −7 < −2",lsIntOps:"Adding a negative moves left. Subtracting a negative moves right.|−3 + 5 = ?|Start at −3;Move right 5: −2, −1, 0, 1, 2;So 2",lsAbs:"Absolute value is the distance from zero, and distance is never negative.|The absolute value of −6|−6 sits 6 steps away from zero;Distance ignores which direction;So the answer is 6",lsExpo:"An exponent says how many times to multiply a number by itself. It is not multiplying by the exponent.|What is 3⁴?|3 × 3 = 9;9 × 3 = 27;27 × 3 = 81",lsSqrt:"A square root asks: what number times itself gives this?|What is the square root of 49?|Try 7: 7 × 7 = 49;That works;So the answer is 7",lsRound:"Rounding looks at the digit to the right. 5 or more rounds up, less than 5 rounds down.|Round 384 to the nearest 100|The hundreds digit is 3;Look right: 8, which is 5 or more;Round up to 400",lsPlace:"Each digit is worth more depending on where it sits: ones, tens, hundreds, thousands.|What is the 7 in 4,700 worth?|It sits in the hundreds place;7 hundreds is 700;So it is worth 700",lsEvenOdd:"Even numbers split into two equal groups. Look only at the last digit: 0, 2, 4, 6, 8 are even.|Is 47 even or odd?|The last digit is 7;7 is not in 0, 2, 4, 6, 8;So 47 is odd",lsSkip:"Skip counting jumps by the same amount each time. It is the start of multiplying.|Count by 4s|Start at 4;Add 4 each time: 8, 12, 16, 20;Each jump is the same size",lsMultiples:"A multiple is what you get when you multiply by 1, 2, 3 and so on.|Multiples of 6|6 × 1 = 6;6 × 2 = 12;6 × 3 = 18",lsFactors:"A factor divides into a number exactly, with nothing left over.|Factors of 12|12 ÷ 1 = 12, so 1 and 12;12 ÷ 2 = 6, so 2 and 6;12 lsConv:"Metric units go up in tens. Bigger unit to smaller means multiply; smaller to bigger means divide.|How many centimetres in 3 metres?|1 metre is 100 centimetres;Going to a smaller unit, so multiply;3 × 100 = 300 cm",lsExpanded:"Expanded form splits a number into what each digit is worth.|Write 546 in expanded form|The 5 is 5 hundreds: 500;The 4 is 4 tens: 40;500 + 40 + 6",lsCmpNum:"To compare numbers, line up the places and check from the left.|Which is bigger: 4,512 or 4,519?|Thousands match, hundreds match, tens match;Compare the ones: 2 against 9;So 4,519 is bigger",lsDec:"A decimal point separates whole numbers from parts. The first place after it is tenths, then hundredths.|What is 0.7 as a fraction?|0.7 means 7 tenths;Write it over 10;So 7/10",lsBeats:"In 4/4 time, a whole note lasts 4 beats, a half note 2, a quarter note 1.|A half note plus a quarter note|The half note is 2 beats;The quarter is 1 beat;2 + 1 = 3 beats",lsMissing:"A missing number puzzle asks what fits. Work backwards using the opposite operation.|7 + ? = 12|The opposite of adding is subtracting;12 − 7 = 5;So the missing number is 5",lsTip:"A tip is a percent of the bill, added on top.|A 20% tip on $30|10% of 30 is 3;20% is double that: 6;The tip is $6",lsFunc:"A function table follows one rule for every row. Find the rule, then apply it.|In: 1, 2, 3 → Out: 4, 5, 6|Each output is 3 more than its input;The rule is add 3;So an input of 10 gives 13",lsCylinder:"A cylinder's volume is the circle at the bottom times how tall it is.|Radius 3, height 10|Circle area: π × 3 × 3 = 28.26;Multiply by the height: × 10;About 282.6",lsCoins:"Count the biggest coins first, then add the smaller ones on.|2 quarters and 3 dimes|Quarters: 25 + 25 = 50;Dimes: 10 + 10 + 10 = 30;50 + 30 = 80 cents",lsAngle:"A right angle is 90°. Less than that is acute, more is obtuse, and a straight line is 180°.|Is 120° acute or obtuse?|It is more than 90°;But less than 180°;So it is obtuse",lsFracUnlike:"Different bottoms must be made the same before you add. Find a number both go into.|1/2 + 1/3|Use sixths: 1/2 = 3/6 and 1/3 = 2/6;Add the tops: 3 + 2 = 5;So 5/6",lsDecCmp:"Compare decimals place by place from the left, not by how many digits there are.|Which is bigger: 0.4 or 0.35?|Tenths first: 4 against 3;4 is bigger;So 0.4 is bigger, even though it is shorter",lsInterest:"Simple interest is the amount, times the rate, times the years.|$200 at 5% for 3 years|5% of 200 is 10;That is per year;10 × 3 = $30 interest",lsUnit:"Unit price is the cost of one. Divide the price by how many you get.|$6 for 4 apples|6 ÷ 4;Each apple costs 1.50;So $1.50 per apple",lsRatio:"A ratio compares two amounts. Simplify it the same way as a fraction.|The ratio 8 : 12|Both divide by 4;8 ÷ 4 = 2 and 12 ÷ 4 = 3;So 2 : 3",lsPropor:"In a proportion, two ratios are equal. Cross multiply to find what is missing.|2/3 = x/12|Cross multiply: 3x = 2 × 12;3x = 24;x = 8",lsSciNot:"Scientific notation writes big numbers as a number between 1 and 10, times a power of ten.|Write 4,500 in scientific notation|Move the point to get 4.5;It moved 3 places;So 4.5 × 10³",lsElapsed:"Elapsed time is how long something took. Count on from the start to the end.|9:40 to 11:15|9:40 to 11:40 would be 2 hours;But we stop at 11:15, which is 25 minutes earlier;So 1 hour 35 minutes",lsClock:"The short hand shows the hour, the long hand the minutes. Each number on the face is 5 minutes.|The long hand is on 3|3 × 5 = 15;So it is quarter past;Read the hour from the short hand",lsVolume:"Volume is how much fits inside. For a box, multiply all three sides.|A box 2 by 3 by 4|2 × 3 = 6;6 × 4 = 24;So 24 cubic units",lsQuad:"The grid has four quadrants. Signs tell you which: (+,+) is I, (−,+) is II, (−,−) is III, (+,−) is IV.|Which quadrant is (−3, 5)?|x is negative, y is positive;That pattern is quadrant II;So II",lsIneq:"An inequality works like an equation, with one rule: multiplying or dividing by a negative flips the sign.|Solve 2x > 10|Divide both sides by 2;Two is positive, so the sign stays;x > 5",lsDistrib:"Distributing multiplies the outside number by everything inside the brackets.|3(x + 4)|3 × x = 3x;3 × 4 = 12;So 3x + 12",lsOrderFrac:"To order fractions, give them the same bottom number, then compare the tops.|Order 1/2, 2/3, 1/4|Use twelfths: 6/12, 8/12, 3/12;Compare the tops: 3, 6, 8;So 1/4, 1/2, 2/3",lsFrac2Dec:"A fraction is a division. Divide the top by the bottom.|Write 3/4 as a decimal|3 ÷ 4;4 goes into 3.00 seven times with 2 left, then five more;So 0.75",lsTrace:"Tracing means following the code line by line, keeping track of what each variable holds.|x = 2 + 3, then x = x × 4|First line: x becomes 5;Second line uses that 5;5 × 4 = 20",lsDays:"To turn weeks and days into days, multiply the weeks by 7 and add the rest.|2 weeks and 3 days|2 × 7 = 14;14 + 3;So 17 days",lsExpRules:"When multiplying powers of the same number, add the exponents. When dividing, subtract them.|2³ × 2⁴|Same base, so add the exponents;3 + 4 = 7;So 2⁷",lsNegMul:"Two negatives multiply to a positive. One negative gives a negative.|−3 × −4|Multiply the numbers: 3 × 4 = 12;Two negatives make a positive;So 12",lsSlope:"Slope is how steep a line is: how far up, divided by how far along.|From (1,2) to (3,8)|Up: 8 − 2 = 6;Along: 3 − 1 = 2;6 ÷ 2 = 3",

polPrivacy:"Yet is a practice app for children, so we collect as little as we can.::We do not ask for a child's real name — a nickname is what we recommend.;We do not ask for a date of birth, only a grade level.;There is no advertising in Yet, and no third-party advertising or analytics code of any kind.;We do not sell or share personal information.|What we collect::A nickname, an email address (the sign-in name), a password, and a grade level.;As you practise: which skills you tried, whether each answer was right, and how long it took.;Streaks, coins, XP and awards.|What we never collect::Real names, dates of birth, addresses, phone numbers, photographs, voice recordings, or precise location. Yet asks for no device permissions.|Read aloud::If read-aloud is on, the question text is spoken by your browser's own speech feature. Depending on the browser, that text may be sent to the browser maker to produce the voice. That is governed by their privacy policy, not ours. It is off by default.|Children and consent::A parent or guardian must create the account and agree before a child uses Yet with a profile. We keep a record of when that agreement was given.;A parent may at any time see what we hold, download it, and have it deleted.|How we protect it::Passwords are hashed and never stored in readable form.;All traffic is encrypted in transit.;The database enforces access rules row by row, so a signed-in user can only read their own data, or that of a child they have been linked to.;A parent is linked to a child only by a one-time code the child generates, which expires after 15 minutes.|Your controls::See everything: the Profile page shows your data, and a parent's dashboard shows each linked child.;Download everything: the Export button produces a complete copy as a JSON file.;Delete everything: the Delete button permanently removes the profile, its progress and its answer history. It cannot be undone.",polTerms:"Yet is a free practice app for children, roughly kindergarten to eighth grade.::It is a practice tool. It is not a curriculum, and a score in Yet is not an assessment of a child's ability.|Who may use it::A child may use Yet with the permission of a parent or guardian.;If the child is under 13, a parent or guardian must create the account and hold the password.;A parent or guardian is responsible for what happens under accounts they create.|What it costs::Nothing. If that ever changes we will say so clearly beforehand, and existing accounts will not be charged without agreement.|What you may not do::Try to break, overload, or gain unauthorised access to the service or to other people's accounts.;Use another person's account, or create one for a child you are not responsible for.;Scrape or resell the question content as your own product.|Accuracy::We try hard to make the questions correct, and we track which ones learners get wrong so we can find the ones that are not. Some will still contain errors. Do not rely on Yet as the sole basis for any decision about a child's education.|If we shut down::Yet is provided as is, and we do not promise it will always be available. If we ever close it down, we will give at least 30 days' notice by email and provide a way to export all data first.|Ending it::You may delete your account at any time from the Profile page. That is permanent.",privacyLink:"Privacy",termsLink:"Terms",andWord:"and",policyUpdated:"Last updated {d}",policyContact:"Questions about your data? Ask a grown-up to contact us.",consentKid:"A parent or guardian has said I may use Yet, and agrees to the",consentAdult:"I am the parent, guardian or teacher of any learners I add, and I agree to the",consentNeeded:"Please tick the box to say a grown-up agrees.",exportDone:"Downloaded a copy of your data",exportBtn:"Download my data",exportWhat:"Everything Yet holds about this profile, as a file",deleteBtn:"Delete this profile",deleteWhat:"Removes the profile and all its progress. This cannot be undone.",delConfirm1:"Permane lsFracEq:"Two fractions are equivalent when they mean the same amount. Multiply or divide top and bottom by the same number.|Is 2/3 the same as 6/9?|Multiply 2/3 top and bottom by 3;That gives 6/9;So yes, they are equivalent",lsFracDiv:"To divide by a fraction, flip it and multiply instead.|1/2 ÷ 1/4|Flip the second: 1/4 becomes 4/1;Multiply: 1/2 × 4 = 4/2;Simplify to 2",lsFracOf:"“Of” means multiply. A fraction of a number is that fraction times the number.|What is 2/3 of 12?|12 ÷ 3 = 4, which is one third;Two thirds is 4 × 2;So 8",lsDecDiv:"Dividing decimals: move the point in both numbers until the divisor is whole.|4.8 ÷ 0.4|Move both one place: 48 ÷ 4;48 ÷ 4 = 12;So the answer is 12",lsPow10:"Multiplying by ten moves every digit one place left. Dividing moves it right.|3.5 × 100|Two zeros means two places left;3.5 becomes 350;So 350",lsPctChange:"Percent change compares the difference to what you started with.|From 40 to 50|Difference: 50 − 40 = 10;Divide by the start: 10 ÷ 40 = 0.25;That is a 25% increase",lsRate:"A rate compares two different units — miles per hour, cost per item.|120 miles in 3 hours|Divide the distance by the time;120 ÷ 3;That is 40 miles per hour",lsCube:"A cube root asks: what number times itself three times gives this?|The cube root of 27|3 × 3 = 9;9 × 3 = 27;So the answer is 3",lsNegExp:"A negative exponent means one over the positive power.|What is 2⁻³?|2³ = 8;A negative power flips it;So 1/8",lsOoo:"Do brackets first, then indices, then multiply and divide, then add and subtract.|2 + 3 × 4|Multiplication comes before addition;3 × 4 = 12;2 + 12 = 14",lsParal:"A parallelogram's area is the base times the perpendicular height — not the slanted side.|Base 8, height 5|Area = base × height;8 × 5;So 40",lsTrapez:"A trapezium's area averages the two parallel sides, then multiplies by the height.|Sides 6 and 10, height 4|Average: (6 + 10) ÷ 2 = 8;Multiply by height: 8 × 4;So 32",lsSurface:"Surface area is the total of every face added together.|A cube with side 3|One face is 3 × 3 = 9;A cube has 6 faces;9 × 6 = 54",lsPolyAngle:"The angles inside a polygon add to 180 times two fewer than the number of sides.|A pentagon|5 sides, so (5 − 2) = 3;3 × 180 = 540;The angles add to 540°",lsPythag:"In a right triangle, the two shorter sides squared add to the longest squared.|Legs 3 and 4|3² + 4² = 9 + 16 = 25;√25 = 5;The hypotenuse is 5",lsDist:"The distance between two points uses the same idea as Pythagoras.|From (0,0) to (3,4)|Across: 3, up: 4;3² + 4² = 25;√25 = 5",lsMidpoint:"The midpoint is the average of the x values and the average of the y values.|Between (2,4) and (6,10)|x: (2 + 6) ÷ 2 = 4;y: (4 + 10) ÷ 2 = 7;So (4, 7)",lsTimeUnit:"To change a bigger time unit into a smaller one, multiply.|How many minutes in 3 hours?|1 hour is 60 minutes;3 × 60;So 180 minutes",lsProbComp:"The chance of something NOT happening is one minus the chance it does.|P(rain) = 1/4. P(no rain)?|The whole is 1;1 − 1/4;So 3/4",lsCombos:"When you choose without caring about order, some arrangements count as the same.|Choosing 2 from 4|The pairs are AB, AC, AD, BC, BD, CD;AB and BA are the same choice;So 6",lsArrays:"An array shows multiplication as rows and columns.|3 rows of 5|Count one row: 5;Three rows: 5 + 5 + 5;Or 3 × 5 = 15",lsLongDiv:"Long division works one digit at a time, from the left.|84 ÷ 4|4 goes into 8 twice;4 goes into 4 once;So 21",lsCount:"Counting on means starting from a number and going forward one at a time.|Count on 3 from 7|Start at 7;8, 9, 10;So 10",lsAdd3:"With three numbers, add two of them first, then add the third.|4 + 6 + 5|4 + 6 = 10;10 + 5;So 15",lsSubZeros:"When subtracting across zeros, borrow from the nearest digit that can spare it.|400 − 137|You cannot take 7 from 0, so borrow along;400 becomes 39 tens and 10 ones;The answer is 263",lsEstimate:"Round each number first, then work with the easier numbers.|Estimate 297 + 412|297 rounds to 300;412 rounds to 400;About 700",lsMixedAdd:"Add the whole numbers, then the fractions, then tidy up.|1 1/4 + 2 1/4|Wholes: 1 + 2 = 3;Fractions: 1/4 + 1/4 = 2/4 = 1/2;So 3 1/2",lsPctDec:"A percent is just hundredths, so move the point two places.|Write 45% as a decimal|45% means 45 out of 100;Move the point two places left;So 0.45",lsScale:"A scale factor multiplies every length by the same amount.|A 3 cm side, scale factor 4|Multiply the length by 4;3 × 4;So 12 cm",lsSystems:"Two equations, two unknowns. Cancel one variable, solve, then substitute back.|x + y = 10, x − y = 2|Add them: 2x = 12, so x = 6;Substitute: 6 + y = 10;So y = 4",lsBudget:"A budget is income minus what you spend. What is left is what you can save.|Earn 50, spend 32|50 − 32;That leaves 18;So 18 can be saved",

lsTimes:"Multiplying is adding the same number over and over. 4 × 3 means four groups of three.|4 × 3 = ?|Draw 4 groups with 3 in each;Count them all: 3, 6, 9, 12;So 4 × 3 = 12",lsDiv:"Dividing shares a number into equal groups. 12 ÷ 3 asks: how many threes fit into twelve?|12 ÷ 3 = ?|Count up in 3s: 3, 6, 9, 12;That took 4 steps;So 12 ÷ 3 = 4",lsAdd:"Adding puts two amounts together. Start at the first number and count on.|8 + 5 = ?|Start at 8;Count on 5: 9, 10, 11, 12, 13;So 8 + 5 = 13",lsSub:"Subtracting takes one amount away. Count back, or ask what you would add to get there.|13 − 5 = ?|Start at 13 and count back 5: 12, 11, 10, 9, 8;So 13 − 5 = 8",lsMul:"For bigger numbers, break one apart. 23 × 4 is easier as 20 × 4 plus 3 × 4.|23 × 4 = ?|20 × 4 = 80;3 × 4 = 12;80 + 12 = 92",lsRem:"Sometimes a number will not share out evenly. What is left over is the remainder.|17 ÷ 5 = ?|5 × 3 = 15, which fits;17 − 15 = 2 left over;So 3 remainder 2",lsFracCmp:"When two fractions have the same bottom number, the pieces are the same size. More pieces means more.|Compare 3/8 and 5/8|Both are eighths, so the pieces match;5 pieces beats 3 pieces;So 3/8 < 5/8",lsFracCmpU:"Different bottom numbers mean different sized pieces. Give them the same bottom number first.|Compare 2/3 and 3/5|Use fifteenths: 2/3 = 10/15;3/5 = 9/15;10 > 9, so 2/3 > 3/5",lsFracSimp:"Simplifying finds the same amount written with smaller numbers. Divide top and bottom by what they share.|Simplify 6/8|Both divide by 2;6 ÷ 2 = 3 and 8 ÷ 2 = 4;So 6/8 = 3/4",lsFracAdd:"With the same bottom number, add only the tops. The size of the pieces does not change.|1/5 + 2/5 = ?|Add the tops: 1 + 2 = 3;Keep the bottom as 5;So 3/5",lsFracSub:"Same idea for subtracting: take the tops away and leave the bottom alone.|4/7 − 2/7 = ?|Subtract the tops: 4 − 2 = 2;Bottom stays 7;So 2/7",lsFracMul:"To multiply fractions, multiply across the top and across the bottom.|2/3 × 3/4 = ?|Tops: 2 × 3 = 6;Bottoms: 3 × 4 = 12;6/12 simplifies to 1/2",lsHalf:"A fraction is more than a half when the top is more than half the bottom.|Is 5/8 more than 1/2?|Half of 8 is 4;The top is 5, which is more than 4;So 5/8 is greater than 1/2",lsMixed:"A mixed number like 2 1/3 means two wholes and a third. Turn the wholes into thirds to make one fraction.|Write 2 1/3 as an improper fraction|Each whole is 3 thirds, so 2 wholes is 6;Add the extra 1 third: 6 + 1 = 7;So 7/3",lsPct:"Percent means out of a hundred. To find a percent of a number, work out one percent first, or use a fraction you know.|What is 25% of 60?|25% is the same as one quarter;60 ÷ 4 = 15;So 25% of 60 is 15",lsPctFrac:"Every percent is a fraction over 100. Simplify it and you have the fraction.|Write 75% as a fraction|75% means 75/100;Both divide by 25;So 3/4",lsDiscount:"A discount takes part of the price away. Find the discount, then subtract it.|A $40 item is 25% off|25% of 40 is 10;40 − 10 = 30;The sale price is $30",lsArea:"Area is how much space is inside a shape. For a rectangle, multiply the two sides.|A rectangle 6 by 4|Area = length × width;6 × 4 = 24;So 24 square units",lsTri:"A triangle is exactly half of the rectangle around it, so work out the rectangle and halve it.|Base 8, height 5|8 × 5 = 40;Halve it: 40 ÷ 2 = 20;So the area is 20",lsPerim:"Perimeter is the distance all the way round the edge. Add every side.|A rectangle 7 by 3|Two long sides: 7 + 7 = 14;Two short sides: 3 + 3 = 6;14 + 6 = 20",lsCircle:"Radius is the middle to the edge. Area uses the radius squared; circumference uses the radius doubled.|A circle with radius 5|Area = π × 5 × 5 = 78.5;Circumference = 2 × π × 5 = 31.4;π is about 3.14",lsOneStep:"To solve for x, undo whatever was done to it — and do the same to both sides.|x + 7 = 12|7 was added, so subtract 7;Do it to both sides: x = 12 − 7;x = 5",lsTwoStep:"Two steps means undoing twice. Take away the added number first, then undo the multiplying.|3x + 4 = 19|Subtract 4 from both sides: 3x = 15;Divide both sides by 3;x = 5",lsLike:"Like terms have the same letter. Add those together, and add the plain numbers separately.|2x + 5 + 3x + 1|x terms: 2x + 3x = 5x;Numbers: 5 + 1 = 6;So 5x + 6",lsInt:"On a number line, numbers get smaller as you go left. So −7 is less than −2.|Compare −7 and −2|Picture the line: −7 sits further left;Further left means smaller;So −7 < −2",lsIntOps:"Adding a negative moves left. Subtracting a negative moves right.|−3 + 5 = ?|Start at −3;Move right 5: −2, −1, 0, 1, 2;So 2",lsAbs:"Absolute value is the distance from zero, and distance is never negative.|The absolute value of −6|−6 sits 6 steps away from zero;Distance ignores which direction;So the answer is 6",lsExpo:"An exponent says how many times to multiply a number by itself. It is not multiplying by the exponent.|What is 3⁴?|3 × 3 = 9;9 × 3 = 27;27 × 3 = 81",lsSqrt:"A square root asks: what number times itself gives this?|What is the square root of 49?|Try 7: 7 × 7 = 49;That works;So the answer is 7",lsRound:"Rounding looks at the digit to the right. 5 or more rounds up, less than 5 rounds down.|Round 384 to the nearest 100|The hundreds digit is 3;Look right: 8, which is 5 or more;Round up to 400",lsPlace:"Each digit is worth more depending on where it sits: ones, tens, hundreds, thousands.|What is the 7 in 4,700 worth?|It sits in the hundreds place;7 hundreds is 700;So it is worth 700",lsEvenOdd:"Even numbers split into two equal groups. Look only at the last digit: 0, 2, 4, 6, 8 are even.|Is 47 even or odd?|The last digit is 7;7 is not in 0, 2, 4, 6, 8;So 47 is odd",lsSkip:"Skip counting jumps by the same amount each time. It is the start of multiplying.|Count by 4s|Start at 4;Add 4 each time: 8, 12, 16, 20;Each jump is the same size",lsMultiples:"A multiple is what you get when you multiply by 1, 2, 3 and so on.|Multiples of 6|6 × 1 = 6;6 × 2 = 12;6 × 3 = 18",lsFactors:"A factor divides into a number exactly, with nothing left over.|Factors of 12|12 ÷ 1 = 12, so 1 and 12;12 ÷ 2 = 6, so 2 and 6;12 ÷ 3 = 4, so 3 and 4",lsPrime:"A prime number has exactly two factors: 1 and itself. Everything else is composite.|Is 15 prime?|15 ÷ 3 = 5, with nothing left over;So it has more than two factors;15 is composite",lsGcfLcm:"The greatest common factor is the biggest number that divides both. The lowest common multiple is the smallest number both divide into.|GCF of 12 and 18|Factors of 12: 1, 2, 3, 4, 6, 12;Factors of 18: 1, 2, 3, 6, 9, 18;The biggest shared one is 6",lsStats:"The mean is the average, the median is the middle when sorted, the range is largest minus smallest.|Find the mean of 4, 8, 6|Add them: 4 + 8 + 6 = 18;Divide by how many: 18 ÷ 3;The mean is 6",lsProb:"Probability is how many ways it can happen, out of how many things could happen.|A bag has 3 red and 5 blue. P(red)?|Ways to get red: 3;Total counters: 8;So 3/8",lsSeq:"In a sequence, find what changes from one term to the next, then keep doing it.|3, 7, 11, 15, ?|7 − 3 = 4, and 11 − 7 = 4;Each step adds 4;15 + 4 = 19",lsLoop:"A loop repeats. Counting from a to b, the number of turns includes both ends.|A loop from 1 to 5|It lands on 1, 2, 3, 4, 5;That is 5 numbers;So it runs 5 times",lsBool:"AND needs both sides true. OR needs only one. NOT flips it.|True AND False|The first is true;The second is false;AND needs both, so the answer is False",lsBinary:"Binary uses only 0 and 1. Each place is worth double the one to its right: 1, 2, 4, 8.|What is 1011 in decimal?|Places from the right: 1, 2, 4, 8;The 1s are in places 1, 2 and 8;1 + 2 + 8 = 11",lsChange:"Change is what is left after paying. Subtract the price from what you handed over.|A $6.50 item, paid with $10|10 − 6.50;Take away 6 to get 4;Take away 0.50 to get 3.50",lsSplit:"Splitting a bill evenly means dividing the total by the number of people.|$24 between 4 people|24 ÷ 4;Each person pays the same;So $6 each",lsPairs:"This skill is about remembering pairs that go together. Read the pair, then see if you can recall it the other way round.|How to lsConv:"Metric units go up in tens. Bigger unit to smaller means multiply; smaller to bigger means divide.|How many centimetres in 3 metres?|1 metre is 100 centimetres;Going to a smaller unit, so multiply;3 × 100 = 300 cm",lsExpanded:"Expanded form splits a number into what each digit is worth.|Write 546 in expanded form|The 5 is 5 hundreds: 500;The 4 is 4 tens: 40;500 + 40 + 6",lsCmpNum:"To compare numbers, line up the places and check from the left.|Which is bigger: 4,512 or 4,519?|Thousands match, hundreds match, tens match;Compare the ones: 2 against 9;So 4,519 is bigger",lsDec:"A decimal point separates whole numbers from parts. The first place after it is tenths, then hundredths.|What is 0.7 as a fraction?|0.7 means 7 tenths;Write it over 10;So 7/10",lsBeats:"In 4/4 time, a whole note lasts 4 beats, a half note 2, a quarter note 1.|A half note plus a quarter note|The half note is 2 beats;The quarter is 1 beat;2 + 1 = 3 beats",lsMissing:"A missing number puzzle asks what fits. Work backwards using the opposite operation.|7 + ? = 12|The opposite of adding is subtracting;12 − 7 = 5;So the missing number is 5",lsTip:"A tip is a percent of the bill, added on top.|A 20% tip on $30|10% of 30 is 3;20% is double that: 6;The tip is $6",lsFunc:"A function table follows one rule for every row. Find the rule, then apply it.|In: 1, 2, 3 → Out: 4, 5, 6|Each output is 3 more than its input;The rule is add 3;So an input of 10 gives 13",lsCylinder:"A cylinder's volume is the circle at the bottom times how tall it is.|Radius 3, height 10|Circle area: π × 3 × 3 = 28.26;Multiply by the height: × 10;About 282.6",lsCoins:"Count the biggest coins first, then add the smaller ones on.|2 quarters and 3 dimes|Quarters: 25 + 25 = 50;Dimes: 10 + 10 + 10 = 30;50 + 30 = 80 cents",lsAngle:"A right angle is 90°. Less than that is acute, more is obtuse, and a straight line is 180°.|Is 120° acute or obtuse?|It is more than 90°;But less than 180°;So it is obtuse",lsFracUnlike:"Different bottoms must be made the same before you add. Find a number both go into.|1/2 + 1/3|Use sixths: 1/2 = 3/6 and 1/3 = 2/6;Add the tops: 3 + 2 = 5;So 5/6",lsDecCmp:"Compare decimals place by place from the left, not by how many digits there are.|Which is bigger: 0.4 or 0.35?|Tenths first: 4 against 3;4 is bigger;So 0.4 is bigger, even though it is shorter",lsInterest:"Simple interest is the amount, times the rate, times the years.|$200 at 5% for 3 years|5% of 200 is 10;That is per year;10 × 3 = $30 interest",lsUnit:"Unit price is the cost of one. Divide the price by how many you get.|$6 for 4 apples|6 ÷ 4;Each apple costs 1.50;So $1.50 per apple",lsRatio:"A ratio compares two amounts. Simplify it the same way as a fraction.|The ratio 8 : 12|Both divide by 4;8 ÷ 4 = 2 and 12 ÷ 4 = 3;So 2 : 3",lsPropor:"In a proportion, two ratios are equal. Cross multiply to find what is missing.|2/3 = x/12|Cross multiply: 3x = 2 × 12;3x = 24;x = 8",lsSciNot:"Scientific notation writes big numbers as a number between 1 and 10, times a power of ten.|Write 4,500 in scientific notation|Move the point to get 4.5;It moved 3 places;So 4.5 × 10³",lsElapsed:"Elapsed time is how long something took. Count on from the start to the end.|9:40 to 11:15|9:40 to 11:40 would be 2 hours;But we stop at 11:15, which is 25 minutes earlier;So 1 hour 35 minutes",lsClock:"The short hand shows the hour, the long hand the minutes. Each number on the face is 5 minutes.|The long hand is on 3|3 × 5 = 15;So it is quarter past;Read the hour from the short hand",lsVolume:"Volume is how much fits inside. For a box, multiply all three sides.|A box 2 by 3 by 4|2 × 3 = 6;6 × 4 = 24;So 24 cubic units",lsQuad:"The grid has four quadrants. Signs tell you which: (+,+) is I, (−,+) is II, (−,−) is III, (+,−) is IV.|Which quadrant is (−3, 5)?|x is negative, y is positive;That pattern is quadrant II;So II",lsIneq:"An inequality works like an equation, with one rule: multiplying or dividing by a negative flips the sign.|Solve 2x > 10|Divide both sides by 2;Two is positive, so the sign stays;x > 5",lsDistrib:"Distributing multiplies the outside number by everything inside the brackets.|3(x + 4)|3 × x = 3x;3 × 4 = 12;So 3x + 12",lsOrderFrac:"To order fractions, give them the same bottom number, then compare the tops.|Order 1/2, 2/3, 1/4|Use twelfths: 6/12, 8/12, 3/12;Compare the tops: 3, 6, 8;So 1/4, 1/2, 2/3",lsFrac2Dec:"A fraction is a division. Divide the top by the bottom.|Write 3/4 as a decimal|3 ÷ 4;4 goes into 3.00 seven times with 2 left, then five more;So 0.75",lsTrace:"Tracing means following the code line by line, keeping track of what each variable holds.|x = 2 + 3, then x = x × 4|First line: x becomes 5;Second line uses that 5;5 × 4 = 20",lsDays:"To turn weeks and days into days, multiply the weeks by 7 and add the rest.|2 weeks and 3 days|2 × 7 = 14;14 + 3;So 17 days",lsExpRules:"When multiplying powers of the same number, add the exponents. When dividing, subtract them.|2³ × 2⁴|Same base, so add the exponents;3 + 4 = 7;So 2⁷",lsNegMul:"Two negatives multiply to a positive. One negative gives a negative.|−3 × −4|Multiply the numbers: 3 × 4 = 12;Two negatives make a positive;So 12",lsSlope:"Slope is how steep a line is: how far up, divided by how far along.|From (1,2) to (3,8)|Up: 8 − 2 = 6;Along: 3 − 1 = 2;6 ÷ 2 = 3",

polPrivacy:"Yet is a practice app for children, so we collect as little as we can.::We do not ask for a child's real name — a nickname is what we recommend.;We do not ask for a date of birth, only a grade level.;There is no advertising in Yet, and no third-party advertising or analytics code of any kind.;We do not sell or share personal information.|What we collect::A nickname, an email address (the sign-in name), a password, and a grade level.;As you practise: which skills you tried, whether each answer was right, and how long it took.;Streaks, coins, XP and awards.|What we never collect::Real names, dates of birth, addresses, phone numbers, photographs, voice recordings, or precise location. Yet asks for no device permissions.|Read aloud::If read-aloud is on, the question text is spoken by your browser's own speech feature. Depending on the browser, that text may be sent to the browser maker to produce the voice. That is governed by their privacy policy, not ours. It is off by default.|Children and consent::A parent or guardian must create the account and agree before a child uses Yet with a profile. We keep a record of when that agreement was given.;A parent may at any time see what we hold, download it, and have it deleted.|How we protect it::Passwords are hashed and never stored in readable form.;All traffic is encrypted in transit.;The database enforces access rules row by row, so a signed-in user can only read their own data, or that of a child they have been linked to.;A parent is linked to a child only by a one-time code the child generates, which expires after 15 minutes.|Your controls::See everything: the Profile page shows your data, and a parent's dashboard shows each linked child.;Download everything: the Export button produces a complete copy as a JSON file.;Delete everything: the Delete button permanently removes the profile, its progress and its answer history. It cannot be undone.",polTerms:"Yet is a free practice app for children, roughly kindergarten to eighth grade.::It is a practice tool. It is not a curriculum, and a score in Yet is not an assessment of a child's ability.|Who may use it::A child may use Yet with the permission of a parent or guardian.;If the child is under 13, a parent or guardian must create the account and hold the password.;A parent or guardian is responsible for what happens under accounts they create.|What it costs::Nothing. If that ever changes we will say so clearly beforehand, and existing accounts will not be charged without agreement.|What you may not do::Try to break, overload, or gain unauthorised access to the service or to other people's accounts.;Use another person's account, or create one for a child you are not responsible for.;Scrape or resell the question content as your own product.|Accuracy::We try hard to make the questions correct, and we track which ones learners get wrong so we can find the ones that are not. Some will still contain errors. Do not rely on Yet as the sole basis for any decision about a child's education.|If we shut down::Yet is provided as is, and we do not promise it will always be available. If we ever close it down, we will give at least 30 days' notice by email and provide a way to export all data first.|Ending it::You may delete your account at any time from the Profile page. That is permanent.",privacyLink:"Privacy",termsLink:"Terms",andWord:"and",policyUpdated:"Last updated {d}",policyContact:"Questions about your data? Ask a grown-up to contact us.",consentKid:"A parent or guardian has said I may use Yet, and agrees to the",consentAdult:"I am the parent, guardian or teacher of any learners I add, and I agree to the",consentNeeded:"Please tick the box to say a grown-up agrees.",exportDone:"Downloaded a copy of your data",exportBtn:"Download my data",exportWhat:"Everything Yet holds about this profile, as a file",deleteBtn:"Delete this profile",deleteWhat:"Removes the profile and all its progress. This cannot be undone.",delConfirm1:"Permane lsFracEq:"Two fractions are equivalent when they mean the same amount. Multiply or divide top and bottom by the same number.|Is 2/3 the same as 6/9?|Multiply 2/3 top and bottom by 3;That gives 6/9;So yes, they are equivalent",lsFracDiv:"To divide by a fraction, flip it and multiply instead.|1/2 ÷ 1/4|Flip the second: 1/4 becomes 4/1;Multiply: 1/2 × 4 = 4/2;Simplify to 2",lsFracOf:"“Of” means multiply. A fraction of a number is that fraction times the number.|What is 2/3 of 12?|12 ÷ 3 = 4, which is one third;Two thirds is 4 × 2;So 8",lsDecDiv:"Dividing decimals: move the point in both numbers until the divisor is whole.|4.8 ÷ 0.4|Move both one place: 48 ÷ 4;48 ÷ 4 = 12;So the answer is 12",lsPow10:"Multiplying by ten moves every digit one place left. Dividing moves it right.|3.5 × 100|Two zeros means two places left;3.5 becomes 350;So 350",lsPctChange:"Percent change compares the difference to what you started with.|From 40 to 50|Difference: 50 − 40 = 10;Divide by the start: 10 ÷ 40 = 0.25;That is a 25% increase",lsRate:"A rate compares two different units — miles per hour, cost per item.|120 miles in 3 hours|Divide the distance by the time;120 ÷ 3;That is 40 miles per hour",lsCube:"A cube root asks: what number times itself three times gives this?|The cube root of 27|3 × 3 = 9;9 × 3 = 27;So the answer is 3",lsNegExp:"A negative exponent means one over the positive power.|What is 2⁻³?|2³ = 8;A negative power flips it;So 1/8",lsOoo:"Do brackets first, then indices, then multiply and divide, then add and subtract.|2 + 3 × 4|Multiplication comes before addition;3 × 4 = 12;2 + 12 = 14",lsParal:"A parallelogram's area is the base times the perpendicular height — not the slanted side.|Base 8, height 5|Area = base × height;8 × 5;So 40",lsTrapez:"A trapezium's area averages the two parallel sides, then multiplies by the height.|Sides 6 and 10, height 4|Average: (6 + 10) ÷ 2 = 8;Multiply by height: 8 × 4;So 32",lsSurface:"Surface area is the total of every face added together.|A cube with side 3|One face is 3 × 3 = 9;A cube has 6 faces;9 × 6 = 54",lsPolyAngle:"The angles inside a polygon add to 180 times two fewer than the number of sides.|A pentagon|5 sides, so (5 − 2) = 3;3 × 180 = 540;The angles add to 540°",lsPythag:"In a right triangle, the two shorter sides squared add to the longest squared.|Legs 3 and 4|3² + 4² = 9 + 16 = 25;√25 = 5;The hypotenuse is 5",lsDist:"The distance between two points uses the same idea as Pythagoras.|From (0,0) to (3,4)|Across: 3, up: 4;3² + 4² = 25;√25 = 5",lsMidpoint:"The midpoint is the average of the x values and the average of the y values.|Between (2,4) and (6,10)|x: (2 + 6) ÷ 2 = 4;y: (4 + 10) ÷ 2 = 7;So (4, 7)",lsTimeUnit:"To change a bigger time unit into a smaller one, multiply.|How many minutes in 3 hours?|1 hour is 60 minutes;3 × 60;So 180 minutes",lsProbComp:"The chance of something NOT happening is one minus the chance it does.|P(rain) = 1/4. P(no rain)?|The whole is 1;1 − 1/4;So 3/4",lsCombos:"When you choose without caring about order, some arrangements count as the same.|Choosing 2 from 4|The pairs are AB, AC, AD, BC, BD, CD;AB and BA are the same choice;So 6",lsArrays:"An array shows multiplication as rows and columns.|3 rows of 5|Count one row: 5;Three rows: 5 + 5 + 5;Or 3 × 5 = 15",lsLongDiv:"Long division works one digit at a time, from the left.|84 ÷ 4|4 goes into 8 twice;4 goes into 4 once;So 21",lsCount:"Counting on means starting from a number and going forward one at a time.|Count on 3 from 7|Start at 7;8, 9, 10;So 10",lsAdd3:"With three numbers, add two of them first, then add the third.|4 + 6 + 5|4 + 6 = 10;10 + 5;So 15",lsSubZeros:"When subtracting across zeros, borrow from the nearest digit that can spare it.|400 − 137|You cannot take 7 from 0, so borrow along;400 becomes 39 tens and 10 ones;The answer is 263",lsEstimate:"Round each number first, then work with the easier numbers.|Estimate 297 + 412|297 rounds to 300;412 rounds to 400;About 700",lsMixedAdd:"Add the whole numbers, then the fractions, then tidy up.|1 1/4 + 2 1/4|Wholes: 1 + 2 = 3;Fractions: 1/4 + 1/4 = 2/4 = 1/2;So 3 1/2",lsPctDec:"A percent is just hundredths, so move the point two places.|Write 45% as a decimal|45% means 45 out of 100;Move the point two places left;So 0.45",lsScale:"A scale factor multiplies every length by the same amount.|A 3 cm side, scale factor 4|Multiply the length by 4;3 × 4;So 12 cm",lsSystems:"Two equations, two unknowns. Cancel one variable, solve, then substitute back.|x + y = 10, x − y = 2|Add them: 2x = 12, so x = 6;Substitute: 6 + y = 10;So y = 4",lsBudget:"A budget is income minus what you spend. What is left is what you can save.|Earn 50, spend 32|50 − 32;That leaves 18;So 18 can be saved",

lsTimes:"Multiplying is adding the same number over and over. 4 × 3 means four groups of three.|4 × 3 = ?|Draw 4 groups with 3 in each;Count them all: 3, 6, 9, 12;So 4 × 3 = 12",lsDiv:"Dividing shares a number into equal groups. 12 ÷ 3 asks: how many threes fit into twelve?|12 ÷ 3 = ?|Count up in 3s: 3, 6, 9, 12;That took 4 steps;So 12 ÷ 3 = 4",lsAdd:"Adding puts two amounts together. Start at the first number and count on.|8 + 5 = ?|Start at 8;Count on 5: 9, 10, 11, 12, 13;So 8 + 5 = 13",lsSub:"Subtracting takes one amount away. Count back, or ask what you would add to get there.|13 − 5 = ?|Start at 13 and count back 5: 12, 11, 10, 9, 8;So 13 − 5 = 8",lsMul:"For bigger numbers, break one apart. 23 × 4 is easier as 20 × 4 plus 3 × 4.|23 × 4 = ?|20 × 4 = 80;3 × 4 = 12;80 + 12 = 92",lsRem:"Sometimes a number will not share out evenly. What is left over is the remainder.|17 ÷ 5 = ?|5 × 3 = 15, which fits;17 − 15 = 2 left over;So 3 remainder 2",lsFracCmp:"When two fractions have the same bottom number, the pieces are the same size. More pieces means more.|Compare 3/8 and 5/8|Both are eighths, so the pieces match;5 pieces beats 3 pieces;So 3/8 < 5/8",lsFracCmpU:"Different bottom numbers mean different sized pieces. Give them the same bottom number first.|Compare 2/3 and 3/5|Use fifteenths: 2/3 = 10/15;3/5 = 9/15;10 > 9, so 2/3 > 3/5",lsFracSimp:"Simplifying finds the same amount written with smaller numbers. Divide top and bottom by what they share.|Simplify 6/8|Both divide by 2;6 ÷ 2 = 3 and 8 ÷ 2 = 4;So 6/8 = 3/4",lsFracAdd:"With the same bottom number, add only the tops. The size of the pieces does not change.|1/5 + 2/5 = ?|Add the tops: 1 + 2 = 3;Keep the bottom as 5;So 3/5",lsFracSub:"Same idea for subtracting: take the tops away and leave the bottom alone.|4/7 − 2/7 = ?|Subtract the tops: 4 − 2 = 2;Bottom stays 7;So 2/7",lsFracMul:"To multiply fractions, multiply across the top and across the bottom.|2/3 × 3/4 = ?|Tops: 2 × 3 = 6;Bottoms: 3 × 4 = 12;6/12 simplifies to 1/2",lsHalf:"A fraction is more than a half when the top is more than half the bottom.|Is 5/8 more than 1/2?|Half of 8 is 4;The top is 5, which is more than 4;So 5/8 is greater than 1/2",lsMixed:"A mixed number like 2 1/3 means two wholes and a third. Turn the wholes into thirds to make one fraction.|Write 2 1/3 as an improper fraction|Each whole is 3 thirds, so 2 wholes is 6;Add the extra 1 third: 6 + 1 = 7;So 7/3",lsPct:"Percent means out of a hundred. To find a percent of a number, work out one percent first, or use a fraction you know.|What is 25% of 60?|25% is the same as one quarter;60 ÷ 4 = 15;So 25% of 60 is 15",lsPctFrac:"Every percent is a fraction over 100. Simplify it and you have the fraction.|Write 75% as a fraction|75% means 75/100;Both divide by 25;So 3/4",lsDiscount:"A discount takes part of the price away. Find the discount, then subtract it.|A $40 item is 25% off|25% of 40 is 10;40 − 10 = 30;The sale price is $30",lsArea:"Area is how much space is inside a shape. For a rectangle, multiply the two sides.|A rectangle 6 by 4|Area = length × width;6 × 4 = 24;So 24 square units",lsTri:"A triangle is exactly half of the rectangle around it, so work out the rectangle and halve it.|Base 8, height 5|8 × 5 = 40;Halve it: 40 ÷ 2 = 20;So the area is 20",lsPerim:"Perimeter is the distance all the way round the edge. Add every side.|A rectangle 7 by 3|Two long sides: 7 + 7 = 14;Two short sides: 3 + 3 = 6;14 + 6 = 20",lsCircle:"Radius is the middle to the edge. Area uses the radius squared; circumference uses the radius doubled.|A circle with radius 5|Area = π × 5 × 5 = 78.5;Circumference = 2 × π × 5 = 31.4;π is about 3.14",lsOneStep:"To solve for x, undo whatever was done to it — and do the same to both sides.|x + 7 = 12|7 was added, so subtract 7;Do it to both sides: x = 12 − 7;x = 5",lsTwoStep:"Two steps means undoing twice. Take away the added number first, then undo the multiplying.|3x + 4 = 19|Subtract 4 from both sides: 3x = 15;Divide both sides by 3;x = 5",lsLike:"Like terms have the same letter. Add those together, and add the plain numbers separately.|2x + 5 + 3x + 1|x terms: 2x + 3x = 5x;Numbers: 5 + 1 = 6;So 5x + 6",lsInt:"On a number line, numbers get smaller as you go left. So −7 is less than −2.|Compare −7 and −2|Picture the line: −7 sits further left;Further left means smaller;So −7 < −2",lsIntOps:"Adding a negative moves left. Subtracting a negative moves right.|−3 + 5 = ?|Start at −3;Move right 5: −2, −1, 0, 1, 2;So 2",lsAbs:"Absolute value is the distance from zero, and distance is never negative.|The absolute value of −6|−6 sits 6 steps away from zero;Distance ignores which direction;So the answer is 6",lsExpo:"An exponent says how many times to multiply a number by itself. It is not multiplying by the exponent.|What is 3⁴?|3 × 3 = 9;9 × 3 = 27;27 × 3 = 81",lsSqrt:"A square root asks: what number times itself gives this?|What is the square root of 49?|Try 7: 7 × 7 = 49;That works;So the answer is 7",lsRound:"Rounding looks at the digit to the right. 5 or more rounds up, less than 5 rounds down.|Round 384 to the nearest 100|The hundreds digit is 3;Look right: 8, which is 5 or more;Round up to 400",lsPlace:"Each digit is worth more depending on where it sits: ones, tens, hundreds, thousands.|What is the 7 in 4,700 worth?|It sits in the hundreds place;7 hundreds is 700;So it is worth 700",lsEvenOdd:"Even numbers split into two equal groups. Look only at the last digit: 0, 2, 4, 6, 8 are even.|Is 47 even or odd?|The last digit is 7;7 is not in 0, 2, 4, 6, 8;So 47 is odd",lsSkip:"Skip counting jumps by the same amount each time. It is the start of multiplying.|Count by 4s|Start at 4;Add 4 each time: 8, 12, 16, 20;Each jump is the same size",lsMultiples:"A multiple is what you get when you multiply by 1, 2, 3 and so on.|Multiples of 6|6 × 1 = 6;6 × 2 = 12;6 × 3 = 18",lsFactors:"A factor divides into a number exactly, with nothing left over.|Factors of 12|12 ÷ 1 = 12, so 1 and 12;12 ÷ 2 = 6, so 2 and 6;12 ÷ 3 = 4, so 3 and 4",lsPrime:"A prime number has exactly two factors: 1 and itself. Everything else is composite.|Is 15 prime?|15 ÷ 3 = 5, with nothing left over;So it has more than two factors;15 is composite",lsGcfLcm:"The greatest common factor is the biggest number that divides both. The lowest common multiple is the smallest number both divide into.|GCF of 12 and 18|Factors of 12: 1, 2, 3, 4, 6, 12;Factors of 18: 1, 2, 3, 6, 9, 18;The biggest shared one is 6",lsStats:"The mean is the average, the median is the middle when sorted, the range is largest minus smallest.|Find the mean of 4, 8, 6|Add them: 4 + 8 + 6 = 18;Divide by how many: 18 ÷ 3;The mean is 6",lsProb:"Probability is how many ways it can happen, out of how many things could happen.|A bag has 3 red and 5 blue. P(red)?|Ways to get red: 3;Total counters: 8;So 3/8",lsSeq:"In a sequence, find what changes from one term to the next, then keep doing it.|3, 7, 11, 15, ?|7 − 3 = 4, and 11 − 7 = 4;Each step adds 4;15 + 4 = 19",lsLoop:"A loop repeats. Counting from a to b, the number of turns includes both ends.|A loop from 1 to 5|It lands on 1, 2, 3, 4, 5;That is 5 numbers;So it runs 5 times",lsBool:"AND needs both sides true. OR needs only one. NOT flips it.|True AND False|The first is true;The second is false;AND needs both, so the answer is False",lsBinary:"Binary uses only 0 and 1. Each place is worth double the one to its right: 1, 2, 4, 8.|What is 1011 in decimal?|Places from the right: 1, 2, 4, 8;The 1s are in places 1, 2 and 8;1 + 2 + 8 = 11",lsChange:"Change is what is left after paying. Subtract the price from what you handed over.|A $6.50 item, paid with $10|10 − 6.50;Take away 6 to get 4;Take away 0.50 to get 3.50",lsSplit:"Splitting a bill evenly means dividing the total by the number of people.|$24 between 4 people|24 ÷ 4;Each person pays the same;So $6 each",lsPairs:"This skill is about remembering pairs that go together. Read the pair, then see if you can recall it the other way round.|How to lsConv:"Metric units go up in tens. Bigger unit to smaller means multiply; smaller to bigger means divide.|How many centimetres in 3 metres?|1 metre is 100 centimetres;Going to a smaller unit, so multiply;3 × 100 = 300 cm",lsExpanded:"Expanded form splits a number into what each digit is worth.|Write 546 in expanded form|The 5 is 5 hundreds: 500;The 4 is 4 tens: 40;500 + 40 + 6",lsCmpNum:"To compare numbers, line up the places and check from the left.|Which is bigger: 4,512 or 4,519?|Thousands match, hundreds match, tens match;Compare the ones: 2 against 9;So 4,519 is bigger",lsDec:"A decimal point separates whole numbers from parts. The first place after it is tenths, then hundredths.|What is 0.7 as a fraction?|0.7 means 7 tenths;Write it over 10;So 7/10",lsBeats:"In 4/4 time, a whole note lasts 4 beats, a half note 2, a quarter note 1.|A half note plus a quarter note|The half note is 2 beats;The quarter is 1 beat;2 + 1 = 3 beats",lsMissing:"A missing number puzzle asks what fits. Work backwards using the opposite operation.|7 + ? = 12|The opposite of adding is subtracting;12 − 7 = 5;So the missing number is 5",lsTip:"A tip is a percent of the bill, added on top.|A 20% tip on $30|10% of 30 is 3;20% is double that: 6;The tip is $6",lsFunc:"A function table follows one rule for every row. Find the rule, then apply it.|In: 1, 2, 3 → Out: 4, 5, 6|Each output is 3 more than its input;The rule is add 3;So an input of 10 gives 13",lsCylinder:"A cylinder's volume is the circle at the bottom times how tall it is.|Radius 3, height 10|Circle area: π × 3 × 3 = 28.26;Multiply by the height: × 10;About 282.6",lsCoins:"Count the biggest coins first, then add the smaller ones on.|2 quarters and 3 dimes|Quarters: 25 + 25 = 50;Dimes: 10 + 10 + 10 = 30;50 + 30 = 80 cents",lsAngle:"A right angle is 90°. Less than that is acute, more is obtuse, and a straight line is 180°.|Is 120° acute or obtuse?|It is more than 90°;But less than 180°;So it is obtuse",lsFracUnlike:"Different bottoms must be made the same before you add. Find a number both go into.|1/2 + 1/3|Use sixths: 1/2 = 3/6 and 1/3 = 2/6;Add the tops: 3 + 2 = 5;So 5/6",lsDecCmp:"Compare decimals place by place from the left, not by how many digits there are.|Which is bigger: 0.4 or 0.35?|Tenths first: 4 against 3;4 is bigger;So 0.4 is bigger, even though it is shorter",lsInterest:"Simple interest is the amount, times the rate, times the years.|$200 at 5% for 3 years|5% of 200 is 10;That is per year;10 × 3 = $30 interest",lsUnit:"Unit price is the cost of one. Divide the price by how many you get.|$6 for 4 apples|6 ÷ 4;Each apple costs 1.50;So $1.50 per apple",lsRatio:"A ratio compares two amounts. Simplify it the same way as a fraction.|The ratio 8 : 12|Both divide by 4;8 ÷ 4 = 2 and 12 ÷ 4 = 3;So 2 : 3",lsPropor:"In a proportion, two ratios are equal. Cross multiply to find what is missing.|2/3 = x/12|Cross multiply: 3x = 2 × 12;3x = 24;x = 8",lsSciNot:"Scientific notation writes big numbers as a number between 1 and 10, times a power of ten.|Write 4,500 in scientific notation|Move the point to get 4.5;It moved 3 places;So 4.5 × 10³",lsElapsed:"Elapsed time is how long something took. Count on from the start to the end.|9:40 to 11:15|9:40 to 11:40 would be 2 hours;But we stop at 11:15, which is 25 minutes earlier;So 1 hour 35 minutes",lsClock:"The short hand shows the hour, the long hand the minutes. Each number on the face is 5 minutes.|The long hand is on 3|3 × 5 = 15;So it is quarter past;Read the hour from the short hand",lsVolume:"Volume is how much fits inside. For a box, multiply all three sides.|A box 2 by 3 by 4|2 × 3 = 6;6 × 4 = 24;So 24 cubic units",lsQuad:"The grid has four quadrants. Signs tell you which: (+,+) is I, (−,+) is II, (−,−) is III, (+,−) is IV.|Which quadrant is (−3, 5)?|x is negative, y is positive;That pattern is quadrant II;So II",lsIneq:"An inequality works like an equation, with one rule: multiplying or dividing by a negative flips the sign.|Solve 2x > 10|Divide both sides by 2;Two is positive, so the sign stays;x > 5",lsDistrib:"Distributing multiplies the outside number by everything inside the brackets.|3(x + 4)|3 × x = 3x;3 × 4 = 12;So 3x + 12",lsOrderFrac:"To order fractions, give them the same bottom number, then compare the tops.|Order 1/2, 2/3, 1/4|Use twelfths: 6/12, 8/12, 3/12;Compare the tops: 3, 6, 8;So 1/4, 1/2, 2/3",lsFrac2Dec:"A fraction is a division. Divide the top by the bottom.|Write 3/4 as a decimal|3 ÷ 4;4 goes into 3.00 seven times with 2 left, then five more;So 0.75",lsTrace:"Tracing means following the code line by line, keeping track of what each variable holds.|x = 2 + 3, then x = x × 4|First line: x becomes 5;Second line uses that 5;5 × 4 = 20",lsDays:"To turn weeks and days into days, multiply the weeks by 7 and add the rest.|2 weeks and 3 days|2 × 7 = 14;14 + 3;So 17 days",lsExpRules:"When multiplying powers of the same number, add the exponents. When dividing, subtract them.|2³ × 2⁴|Same base, so add the exponents;3 + 4 = 7;So 2⁷",lsNegMul:"Two negatives multiply to a positive. One negative gives a negative.|−3 × −4|Multiply the numbers: 3 × 4 = 12;Two negatives make a positive;So 12",lsSlope:"Slope is how steep a line is: how far up, divided by how far along.|From (1,2) to (3,8)|Up: 8 − 2 = 6;Along: 3 − 1 = 2;6 ÷ 2 = 3",

polPrivacy:"Yet is a practice app for children, so we collect as little as we can.::We do not ask for a child's real name — a nickname is what we recommend.;We do not ask for a date of birth, only a grade level.;There is no advertising in Yet, and no third-party advertising or analytics code of any kind.;We do not sell or share personal information.|What we collect::A nickname, an email address (the sign-in name), a password, and a grade level.;As you practise: which skills you tried, whether each answer was right, and how long it took.;Streaks, coins, XP and awards.|What we never collect::Real names, dates of birth, addresses, phone numbers, photographs, voice recordings, or precise location. Yet asks for no device permissions.|Read aloud::If read-aloud is on, the question text is spoken by your browser's own speech feature. Depending on the browser, that text may be sent to the browser maker to produce the voice. That is governed by their privacy policy, not ours. It is off by default.|Children and consent::A parent or guardian must create the account and agree before a child uses Yet with a profile. We keep a record of when that agreement was given.;A parent may at any time see what we hold, download it, and have it deleted.|How we protect it::Passwords are hashed and never stored in readable form.;All traffic is encrypted in transit.;The database enforces access rules row by row, so a signed-in user can only read their own data, or that of a child they have been linked to.;A parent is linked to a child only by a one-time code the child generates, which expires after 15 minutes.|Your controls::See everything: the Profile page shows your data, and a parent's dashboard shows each linked child.;Download everything: the Export button produces a complete copy as a JSON file.;Delete everything: the Delete button permanently removes the profile, its progress and its answer history. It cannot be undone.",polTerms:"Yet is a free practice app for children, roughly kindergarten to eighth grade.::It is a practice tool. It is not a curriculum, and a score in Yet is not an assessment of a child's ability.|Who may use it::A child may use Yet with the permission of a parent or guardian.;If the child is under 13, a parent or guardian must create the account and hold the password.;A parent or guardian is responsible for what happens under accounts they create.|What it costs::Nothing. If that ever changes we will say so clearly beforehand, and existing accounts will not be charged without agreement.|What you may not do::Try to break, overload, or gain unauthorised access to the service or to other people's accounts.;Use another person's account, or create one for a child you are not responsible for.;Scrape or resell the question content as your own product.|Accuracy::We try hard to make the questions correct, and we track which ones learners get wrong so we can find the ones that are not. Some will still contain errors. Do not rely on Yet as the sole basis for any decision about a child's education.|If we shut down::Yet is provided as is, and we do not promise it will always be available. If we ever close it down, we will give at least 30 days' notice by email and provide a way to export all data first.|Ending it::You may delete your account at any time from the Profile page. That is permanent.",privacyLink:"Privacy",termsLink:"Terms",andWord:"and",policyUpdated:"Last updated {d}",policyContact:"Questions about your data? Ask a grown-up to contact us.",consentKid:"A parent or guardian has said I may use Yet, and agrees to the",consentAdult:"I am the parent, guardian or teacher of any learners I add, and I agree to the",consentNeeded:"Please tick the box to say a grown-up agrees.",exportDone:"Downloaded a copy of your data",exportBtn:"Download my data",exportWhat:"Everything Yet holds about this profile, as a file",deleteBtn:"Delete this profile",deleteWhat:"Removes the profile and all its progress. This cannot be undone.",delConfirm1:"Permane lsFracEq:"Two fractions are equivalent when they mean the same amount. Multiply or divide top and bottom by the same number.|Is 2/3 the same as 6/9?|Multiply 2/3 top and bottom by 3;That gives 6/9;So yes, they are equivalent",lsFracDiv:"To divide by a fraction, flip it and multiply instead.|1/2 ÷ 1/4|Flip the second: 1/4 becomes 4/1;Multiply: 1/2 × 4 = 4/2;Simplify to 2",lsFracOf:"“Of” means multiply. A fraction of a number is that fraction times the number.|What is 2/3 of 12?|12 ÷ 3 = 4, which is one third;Two thirds is 4 × 2;So 8",lsDecDiv:"Dividing decimals: move the point in both numbers until the divisor is whole.|4.8 ÷ 0.4|Move both one place: 48 ÷ 4;48 ÷ 4 = 12;So the answer is 12",lsPow10:"Multiplying by ten moves every digit one place left. Dividing moves it right.|3.5 × 100|Two zeros means two places left;3.5 becomes 350;So 350",lsPctChange:"Percent change compares the difference to what you started with.|From 40 to 50|Difference: 50 − 40 = 10;Divide by the start: 10 ÷ 40 = 0.25;That is a 25% increase",lsRate:"A rate compares two different units — miles per hour, cost per item.|120 miles in 3 hours|Divide the distance by the time;120 ÷ 3;That is 40 miles per hour",lsCube:"A cube root asks: what number times itself three times gives this?|The cube root of 27|3 × 3 = 9;9 × 3 = 27;So the answer is 3",lsNegExp:"A negative exponent means one over the positive power.|What is 2⁻³?|2³ = 8;A negative power flips it;So 1/8",lsOoo:"Do brackets first, then indices, then multiply and divide, then add and subtract.|2 + 3 × 4|Multiplication comes before addition;3 × 4 = 12;2 + 12 = 14",lsParal:"A parallelogram's area is the base times the perpendicular height — not the slanted side.|Base 8, height 5|Area = base × height;8 × 5;So 40",lsTrapez:"A trapezium's area averages the two parallel sides, then multiplies by the height.|Sides 6 and 10, height 4|Average: (6 + 10) ÷ 2 = 8;Multiply by height: 8 × 4;So 32",lsSurface:"Surface area is the total of every face added together.|A cube with side 3|One face is 3 × 3 = 9;A cube has 6 faces;9 × 6 = 54",lsPolyAngle:"The angles inside a polygon add to 180 times two fewer than the number of sides.|A pentagon|5 sides, so (5 − 2) = 3;3 × 180 = 540;The angles add to 540°",lsPythag:"In a right triangle, the two shorter sides squared add to the longest squared.|Legs 3 and 4|3² + 4² = 9 + 16 = 25;√25 = 5;The hypotenuse is 5",lsDist:"The distance between two points uses the same idea as Pythagoras.|From (0,0) to (3,4)|Across: 3, up: 4;3² + 4² = 25;√25 = 5",lsMidpoint:"The midpoint is the average of the x values and the average of the y values.|Between (2,4) and (6,10)|x: (2 + 6) ÷ 2 = 4;y: (4 + 10) ÷ 2 = 7;So (4, 7)",lsTimeUnit:"To change a bigger time unit into a smaller one, multiply.|How many minutes in 3 hours?|1 hour is 60 minutes;3 × 60;So 180 minutes",lsProbComp:"The chance of something NOT happening is one minus the chance it does.|P(rain) = 1/4. P(no rain)?|The whole is 1;1 − 1/4;So 3/4",lsCombos:"When you choose without caring about order, some arrangements count as the same.|Choosing 2 from 4|The pairs are AB, AC, AD, BC, BD, CD;AB and BA are the same choice;So 6",lsArrays:"An array shows multiplication as rows and columns.|3 rows of 5|Count one row: 5;Three rows: 5 + 5 + 5;Or 3 × 5 = 15",lsLongDiv:"Long division works one digit at a time, from the left.|84 ÷ 4|4 goes into 8 twice;4 goes into 4 once;So 21",lsCount:"Counting on means starting from a number and going forward one at a time.|Count on 3 from 7|Start at 7;8, 9, 10;So 10",lsAdd3:"With three numbers, add two of them first, then add the third.|4 + 6 + 5|4 + 6 = 10;10 + 5;So 15",lsSubZeros:"When subtracting across zeros, borrow from the nearest digit that can spare it.|400 − 137|You cannot take 7 from 0, so borrow along;400 becomes 39 tens and 10 ones;The answer is 263",lsEstimate:"Round each number first, then work with the easier numbers.|Estimate 297 + 412|297 rounds to 300;412 rounds to 400;About 700",lsMixedAdd:"Add the whole numbers, then the fractions, then tidy up.|1 1/4 + 2 1/4|Wholes: 1 + 2 = 3;Fractions: 1/4 + 1/4 = 2/4 = 1/2;So 3 1/2",lsPctDec:"A percent is just hundredths, so move the point two places.|Write 45% as a decimal|45% means 45 out of 100;Move the point two places left;So 0.45",lsScale:"A scale factor multiplies every length by the same amount.|A 3 cm side, scale factor 4|Multiply the length by 4;3 × 4;So 12 cm",lsSystems:"Two equations, two unknowns. Cancel one variable, solve, then substitute back.|x + y = 10, x − y = 2|Add them: 2x = 12, so x = 6;Substitute: 6 + y = 10;So y = 4",lsBudget:"A budget is income minus what you spend. What is left is what you can save.|Earn 50, spend 32|50 − 32;That leaves 18;So 18 can be saved",

function t(k,v){
  let out=(I18N[LANG]&&I18N[LANG][k])!=null?I18N[LANG][k]:(I18N.en[k]!=null?I18N.en[k]:k);
  if(v)Object.keys(v).forEach(x=>{out=out.split("{"+x+"}").join(v[x]);});
  return out;
}
const tt=(k,v)=>t(k,v);      /* alias: some generators use t as a local variable */
const num=n=>Number(n).toLocaleString(LOCALE[LANG]||"en-US");
/* ---- read aloud: browser speech, matched to the interface language ---- */
const SPEECH_OK=typeof window!=="undefined"&&"speechSynthesis"in window;
function sayable(txt){
  return String(txt)
    .replace(/×/g," times ").replace(/÷/g," divided by ").replace(/−/g," minus ")
    .replace(/\+/g," plus ").replace(/=/g," equals ").replace(/\bx\^(\d+)/g,"x to the power $1")
    .replace(/(\d+)\/(\d+)/g,"$1 over $2").replace(/\s+/g," ").trim();
}
function speak(txt){
  if(!SPEECH_OK||!st.speak)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(sayable(txt));
    u.lang=LOCALE[LANG]||"en-US";
    u.rate=.92;u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeech(){if(SPEECH_OK){try{speechSynthesis.cancel();}catch(e){}}}
function toggleSpeak(){
  st.speak=!st.speak;save();
  if(!st.speak)stopSpeech();
  render();
  if(st.speak&&sess&&sess.q)speak(sess.q.q);
  toast(st.speak?t("readOn"):t("readOff"));
}
function sayQuestion(){
  if(!sess||!sess.q)return;
  const parts=[sess.q.q];
  if(sess.q.opts)parts.push(sess.q.opts.map((o,i)=>(i+1)+". "+o).join(". "));
  const was=st.speak;st.speak=true;speak(parts.join(". "));st.speak=was;
}
const subjName=id=>t("sub"+id.charAt(0).toUpperCase()+id.slice(1));
const skillName=s=>!s?"":(typeof s.name==="string"?s.name:t(s.name.k,s.name.v));
const barA11y=(pct,label)=>`role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"${label?` aria-label="${label}"`:""}`;
function applyLang(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=RTL.includes(LANG)?"rtl":"ltr";
}
function setLang(code){
  if(!I18N[code])return;
  LANG=code;st.lang=code;
  try{STORE.set("yet:lang",code);}catch(e){}
  if(ACC.active)save();
  applyLang();render();window.scrollTo({top:0,behavior:"instant"});
}
function langPicker(){
  return `<select id="langSel" aria-label="${t("language")}" onchange="setLang(this.value)"
    style="border:1.5px solid var(--edge);border-radius:999px;padding:5px 9px;background:var(--card);color:inherit;font:700 13px var(--body);max-width:9.5rem">
    ${LANGS.map(([c,n,f])=>`<option value="${c}" ${LANG===c?"selected":""}>${f} ${n}</option>`).join("")}
  </select>`;
}

const SKILLS=[];
const PREFIX={math:"MA",ela:"LA",sci:"SC",soc:"SS",spa:"SP",code:"CS",art:"AM",life:"LS"};
const counters={};
const SEEN=new Set();
function S(sub,grade,name,gen,p){
  const shown=typeof name==="string"?name
    :String((I18N.en[name.k]||name.k)).replace(/\{(\w+)\}/g,(m,x)=>((name.v||{})[x]));
  const key=sub+"|"+shown;
  if(SEEN.has(key))return;                       /* first registration wins */
  /* Two skills with the same generator AND the same parameters ask the same
     questions under different names. That is padding, not content, so refuse
     it here rather than trusting every future registration to be careful. */
  const sig=gen+"|"+JSON.stringify(p||{});
  if(SEEN.has(sig))return;
  SEEN.add(key); SEEN.add(sig);
  counters[sub+grade]=(counters[sub+grade]||0)+1;
  SKILLS.push({id:PREFIX[sub]+grade+"."+counters[sub+grade],sub,grade,name,gen,p:p||{}});
}

const BUILD="all";                 /* all | kid | parent | admin — set per build */
const SOLO=BUILD!=="all";
const adultBuild=BUILD==="parent"||BUILD==="admin";
/* Storage: use the host's API when it exists (the Claude artifact preview
   provides window.storage), otherwise fall back to this browser's own
   localStorage, and finally to memory so nothing ever throws. */
const STORE=(()=>{
  /* Resolve the host API at CALL time, not at parse time. A cloud adapter
     loaded with <script type="module"> is deferred and therefore runs AFTER
     this script, so checking once here would always miss it. */
  const PRE="yet.store.";
  let ls=null;
  try{const k=PRE+"__t";window.localStorage.setItem(k,"1");window.localStorage.removeItem(k);ls=window.localStorage;}catch(e){ls=null;}
  const mem={};
  const host=()=>(typeof window!=="undefined"&&window.storage&&typeof window.storage.get==="function")?window.storage:null;
  const local={
    async get(k){const v=ls?ls.getItem(PRE+k):mem[k];if(v==null)throw new Error("missing "+k);return{key:k,value:v};},
    async set(k,v){if(ls)ls.setItem(PRE+k,String(v));else mem[k]=String(v);return{key:k,value:v};},
    async delete(k){if(ls)ls.removeItem(PRE+k);else delete mem[k];return{key:k,deleted:true};},
    async list(pre){const out=[];
      if(ls){for(let i=0;i<ls.length;i++){const kk=ls.key(i);
        if(kk&&kk.indexOf(PRE)===0){const n=kk.slice(PRE.length);if(!pre||n.indexOf(pre)===0)out.push(n);}}}
      else out.push(...Object.keys(mem).filter(n=>!pre||n.indexOf(pre)===0));
      return {keys:out};}
  };
  return {
    get kind(){return host()?"host":(ls?"local":"memory");},
    async get(k){const h=host();return h?h.get(k):local.get(k);},

  if(!st.prog||typeof st.prog!=="object")st.prog={};

  if(!Array.isArray(st.claimed))st.claimed=[];

  if(typeof st.yetBest!=="number")st.yetBest=0;
  if(typeof st.bestStreak!=="number")st.bestStreak=st.streak||0;
  if(st.streak>st.bestStreak)st.bestStreak=st.streak;
  if(st.lang&&I18N[st.lang])LANG=st.lang;

async function loadAccounts(){
  try{const r=await STORE.get(AKEY);if(r&&r.value)ACC=JSON.parse(r.value);}catch(e){}
  if(!ACC||!Array.isArray(ACC.list)||!ACC.list.length){          /* carry over anything saved under an earlier name */
    for(const pre of LEGACY){
      try{
        const old=await STORE.get(pre+":accounts:v1");
        const o=old&&old.value?JSON.parse(old.value):null;
        if(!o||!Array.isArray(o.list)||!o.list.length)continue;
        for(const a of o.list){
          try{const s0=await STORE.get(pre+":acct:"+a.id);
            if(s0&&s0.value)await STORE.set(acctKey(a.id),s0.value);}catch(e){}
        }
        ACC=o;await saveAccounts();break;
      }catch(e){}
    }
  }
  if(!ACC||!Array.isArray(ACC.list))ACC={list:[],active:null};
  ACC.list.forEach(a=>{if(!a.role)a.role="kid";if(!Array.isArray(a.kids))a.kids=[];});
  if(ACC.pin){delete ACC.pin;saveAccounts();}
}

async function createAccount(name,avatar,grade,role,kids,cred){
  const wasGuest=!ACC.active;                       /* only a guest's work carries into a new profile */
  lockAdmin(true);ADMIN.asking=false;
  await flush();
  const id="p"+Date.now().toString(36)+R(100,999);
  const entry={id,name:name.slice(0,22),avatar,grade,xp:0,mastered:0,weekly:0,made:todayStr(),role:role||"kid",kids:kids||[]};
  if(cred){entry.email=cred.email;entry.auth=cred.auth;entry.rec=cred.rec;}
  ACC.list.push(entry);
  ACC.active=id;
  const carry=wasGuest&&(st.asked>0||Object.keys(st.prog||{}).length>0)?st:null;
  const a11y={contrast:st.contrast||"normal",speak:!!st.speak,seenUpdate:st.seenUpdate||DEVICE_SEEN||""};
  st=carry||clone(DEFAULT);
  st.avatar=avatar;st.grade=grade;st.lang=LANG;
  st.contrast=a11y.contrast;st.speak=a11y.speak;   /* never reset an accessibility choice */
  /* COPPA and GDPR-K both want a record that consent was given, not just a
     ticked box that vanishes. Keep when, and which policy version. */
  st.consent={at:new Date().toISOString(),privacy:POLICY_VERSION,terms:POLICY_VERSION,
              by:isAdult(role)?"self":"guardian"};
  st.seenUpdate=a11y.seenUpdate;                   /* nor re-announce updates they have read */
  if(carry)setTimeout(()=>{toast(t("carriedOver",{n:carry.asked}));burst(30);},900);
  gate.pick=null;gate.err="";
  await saveAccounts();save();
  ROSTER=[];
}

async function deleteAccount(id){
  const a=ACC.list.find(x=>x.id===id);if(!a)return;
  await flush();
  if(!confirm("Delete the profile for "+a.name+"? Their progress is erased and cannot be recovered."))return;
  ACC.list=ACC.list.filter(x=>x.id!==id);
  try{await STORE.delete(acctKey(id));}catch(e){}

/* count a number up instead of snapping to it */
function tick(el,to,dur){
  if(!el)return; const from=Number(String(el.textContent).replace(/[^0-9.-]/g,""))||0;
  to=Number(to);
  if(RM()||from===to){el.textContent=to;return;}
  const t0=performance.now();dur=dur||520;
  (function step(t){const k=Math.min(1,(t-t0)/dur);
    el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));

/* The mastery wheel: 12 facets that fill and brighten with the score */
function wheel(score,opts){
  opts=opts||{};
  const cols=themeColors(),filled=Math.round(score/100*12),rot=opts.rot||0;
  const from=opts.from==null?filled:opts.from;
  let p="";
  for(let i=0;i<12;i++){
    const a0=(i*30-90+1)*Math.PI/180,a1=(i*30-60-1)*Math.PI/180,r=46;
    const x0=50+r*Math.cos(a0),y0=50+r*Math.sin(a0),x1=50+r*Math.cos(a1),y1=50+r*Math.sin(a1);
    const on=i<filled, fresh=on&&i>=from;
    p+=`<path d="M50 50 L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z"
      fill="${cols[i%cols.length]}" opacity="${on?.92:.11}"
      style="${fresh?`animation:facetPop .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:${(i-from)*90}ms`:""}"
      stroke="${on?"rgba(27,16,66,.55)":"rgba(140,120,200,.4)"}" stroke-width="1.4"/>`;
  }
  return `<svg viewBox="0 0 100 100" role="img" aria-label="Mastery wheel, ${Math.round(score)} out of 100"
    style="transform:rotate(${rot}deg);transition:transform .5s cubic-bezier(.2,1.3,.4,1)">
    ${p}<circle cx="50" cy="50" r="17" fill="var(--card)" stroke="rgba(27,16,66,.5)" stroke-width="2"/></svg>`;
}

  $("#brandg").innerHTML=p;
}

async function gateSignIn(){
  const a=ACC.list.find(x=>x.id===gate.pick);if(!a||gate.busy)return;
  if(lockedFor(a)){gate.err="Too many tries. Wait "+lockedFor(a)+"s.";return render();}
  const pw=($("#pw")||{}).value||"";
  gate.busy=true;gate.err="Checking…";render();
  const ok=await verifyAuth(a.auth,pw);
  gate.busy=false;
  if(!ok)return noteFail(a,"That password does not match.");
  a.fails=0;delete a.lockUntil;await saveAccounts();
  gate.pick=null;gate.err="";gate.mode="list";
  switchAccount(a.id,true);
}
async function gateUpgrade(){
  const a=ACC.list.find(x=>x.id===gate.pick);if(!a||gate.busy)return;
  if(lockedFor(a)){gate.err="Too many tries. Wait "+lockedFor(a)+"s.";return render();}
  if(a.pinh){
    const pin=($("#oldpin")||{}).value||"";
    if(pinHash(pin)!==a.pinh)return noteFail(a,"That PIN does not match.");
  }
  const mail=(($("#email")||{}).value||"").trim().toLowerCase();
  const pw=($("#pw")||{}).value||"", pw2=($("#pw2")||{}).value||"";
  if(!EMAIL_RE.test(mail)){gate.err="That email address does not look right.";return render();}
  if(emailTaken(mail,a.id)){gate.err="Another profile already uses that email.";return render();}
  const bad=pwProblem(pw);
  if(bad){gate.err=bad;return render();}
  if(pw!==pw2){gate.err="The two passwords do not match.";return render();}
  gate.busy=true;gate.err="Securing…";render();
  const code=makeRecoveryCode();
  a.email=mail;a.auth=await makeAuth(pw);a.rec=await makeAuth(code);
  delete a.pinh;a.fails=0;delete a.lockUntil;
  await saveAccounts();
  gate.busy=false;gate.code=code;gate.mode="recovery";gate.err="";render();
}
async function gateForgot(){
  const a=ACC.list.find(x=>x.id===gate.pick);if(!a||gate.busy)return;
  const code=(($("#rec")||{}).value||"").trim().toUpperCase();
  const pw=($("#pw")||{}).value||"", pw2=($("#pw2")||{}).value||"";
  const bad=pwProblem(pw);
  if(bad){gate.err=bad;return render();}
  if(pw!==pw2){gate.err="The two passwords do not match.";return render();}
  gate.busy=true;gate.err="Checking the code…";render();
  const ok=await verifyAuth(a.rec,code);
  gate.busy=false;
  if(!ok)return noteFail(a,"That recovery code does not match.");
  a.auth=await makeAuth(pw);a.fails=0;delete a.lockUntil;
  const fresh=makeRecoveryCode();a.rec=await makeAuth(fresh);
  await saveAccounts();
  gate.code=fresh;gate.mode="recovery";gate.err="";render();
  toast("Password changed");
}
async function submitNewProfile2(){
  if(gate.busy)return;
  const n=(($("#newName")||{}).value||"").trim()||"Learner";
  const mail=(($("#email")||{}).value||"").trim().toLowerCase();
  const pw=($("#pw")||{}).value||"", pw2=($("#pw2")||{}).value||"";
  const av=($("#newAv")||{}).value||"🦊";
  const gr=($("#newGrade")||{}).value||"3";
  const role=gate.role;
  const consented=(($("#consentBox")||{}).checked)||gate.consent;
  gate.consent=consented;
  if(!consented){gate.err=t("consentNeeded");return render();}
  if(!EMAIL_RE.test(mail)){gate.err="Enter an email address — it is the sign-in name for this profile.";return render();}
  if(emailTaken(mail)){gate.err="A profile on this device already uses that email.";return render();}
  const bad=pwProblem(pw);
  if(bad){gate.err=bad;return render();}
  if(pw!==pw2){gate.err="The two passwords do not match.";return render();}
  const kids=[...document.querySelectorAll(".kidpick:checked")].map(e=>e.value);   /* read before any re-render */
  gate.busy=true;gate.err="Securing the profile…";render();
  const code=makeRecoveryCode();
  const auth=await makeAuth(pw), rec=await makeAuth(code);
  gate.busy=false;
  await createAccount(n,isAdult(role)?ROLE_EM[role]:av,gr,role,kids,{email:mail,auth,rec});
  gate.code=code;gate.mode="recovery";gate.err="";render();
}
function gateDone(){
  gate.code="";gate.mode="list";gate.pick=null;gate.err="";
  if(ACC.active){view="home";render();window.scrollTo({top:0,behavior:"instant"});armIdle();}
  else enterApp();
}
function copyRecovery(){
  const el=$("#reccode");if(!el)return;
  const r=document.createRange();r.selectNodeContents(el);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
  try{document.execCommand("copy");toast("Recovery code copied");}catch(e){toast("Select the code and copy it");}
}
