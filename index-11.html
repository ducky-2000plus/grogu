/* Everything Yet holds about this learner, as one file. A subject access
   request covers the answer history too, not only the summary. */
function exportMyData(){
  const a=me();
  const payload={
    exportedAt:new Date().toISOString(),
    policyVersion:POLICY_VERSION,
    profile:{name:a?a.name:"",role:roleOf(),grade:st.grade,avatar:st.avatar,
             language:st.lang||LANG,consent:st.consent||null},
    progress:{xp:st.xp,coins:st.coins,streak:st.streak,bestStreak:st.bestStreak,
              asked:st.asked,right:st.right,secondsPractised:st.secs,
              daysPractised:st.days,skills:st.prog},
    awards:st.awards||[],
    reviewSchedule:st.due||{},
    lessonsSeen:Object.keys(st.taught||{}),
    note:"This is everything Yet holds about this learner."
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const el=document.createElement("a");
  el.href=url;
  el.download="yet-data-"+((a&&a.name)||"learner").replace(/[^a-z0-9]/gi,"-").toLowerCase()+".json";
  document.body.appendChild(el); el.click(); el.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast(t("exportDone"));
}

/* Deletion has to actually delete. Two confirmations, because it cannot be
   undone and a child could tap it by accident. */
async function deleteMyProfile(){
  const a=me(); if(!a)return;
  if(!confirm(t("delConfirm1",{n:a.name})))return;
  const typed=prompt(t("delConfirm2"));
  if(!typed||typed.trim().toUpperCase()!==t("delWord").toUpperCase()){toast(t("delCancelled"));return;}
  if(typeof deleteMyAccount==="function"){await deleteMyAccount();return;}   /* cloud build */
  try{await STORE.delete("yet:acct:"+a.id);}catch(e){}
  ACC.list=ACC.list.filter(x=>x.id!==a.id);
  ACC.active=null;
  try{await saveAccounts();}catch(e){}
  st=clone(DEFAULT);
  toast(t("delDone"));
  view=adultBuild?"accounts":"home"; render(); hud();
}

let ADMIN={open:false,asking:false,tab:"roster",sel:null,q:"",target:"all",busy:false,expires:0,timer:null};
const IDLE_MS=180000;                       /* the console locks itself after 3 quiet minutes */
/* ---------- credentials ----------
   PBKDF2-SHA256 over a per-profile random salt. The password is never stored,
   only the derived hash, so reading the saved data does not reveal it. */
const ITERS=150000;
const B64=buf=>btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));
const randB64=n=>{const a=new Uint8Array(n);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.floor(Math.random()*256));return B64(a);};
const CRYPTO_OK=!!(window.crypto&&window.crypto.subtle&&window.isSecureContext);
async function derive(pw,saltB64,iters){
  if(!CRYPTO_OK)return "weak:"+pinHash(saltB64+"|"+pw);          /* only if WebCrypto is unavailable */
  const salt=Uint8Array.from(atob(saltB64),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:iters,hash:"SHA-256"},key,256);
  return "pbkdf2:"+B64(bits);
}
async function makeAuth(pw){const salt=randB64(16);return {salt,iters:ITERS,hash:await derive(pw,salt,ITERS),v:1};}
async function verifyAuth(rec,pw){
  if(!rec||!rec.hash)return false;
  const h=await derive(pw,rec.salt,rec.iters||ITERS);
  return h.length===rec.hash.length&&h===rec.hash;
}
const RECCHARS="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function makeRecoveryCode(){
  const a=new Uint8Array(16);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.floor(Math.random()*256));
  const c=[...a].map(x=>RECCHARS[x%RECCHARS.length]).join("");
  return c.slice(0,4)+"-"+c.slice(4,8)+"-"+c.slice(8,12)+"-"+c.slice(12,16);
}
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const emailTaken=(mail,skip)=>ACC.list.some(a=>a.id!==skip&&(a.email||"").toLowerCase()===mail.toLowerCase());
const COMMON=["password","password1","12345678","123456789","qwerty123","letmein1","iloveyou","football","baseball","sunshine","princess","admin123","welcome1","abc12345"];
function pwScore(pw){
  if(!pw)return 0;
  let s=0;
  if(pw.length>=8)s++;
  if(pw.length>=12)s++;
  if(/[a-z]/.test(pw)&&/[A-Z]/.test(pw))s++;
  if(/\d/.test(pw)&&/[^A-Za-z0-9]/.test(pw))s++;
  if(/^\d+$/.test(pw))s=Math.min(s,1);
  if(COMMON.includes(pw.toLowerCase()))s=0;
  return Math.min(4,s);
}
function pwProblem(pw){
  if(!pw||pw.length<8)return "Use at least 8 characters.";
  if(/^\d+$/.test(pw))return "Digits alone are easy to guess — add letters.";
  if(COMMON.includes(pw.toLowerCase()))return "That is one of the most common passwords.";
  return "";
}
const PW_LABEL=()=>[t("pw0"),t("pw1"),t("pw2"),t("pw3"),t("pw4")];
function paintMeter(){
  const el=$("#pw"),m=$("#meter"),l=$("#meterlab");
  if(!el||!m)return;
  const n=pwScore(el.value);
  [...m.children].forEach((c,i)=>{c.className=i<n?"on"+n:"";});
  if(l)l.textContent=el.value?PW_LABEL()[n]:t("meterHint");
}
/* backoff after repeated failures, kept in storage so a reload does not clear it */
function failWait(n){return Math.min(300,Math.pow(2,Math.max(0,n-2)))*1000;}
const SALT="facet/";   /* fixed forever: rehashing on a rename would lock people out */
function pinHash(v){let h=2166136261;const s=SALT+v;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
function hasPin(){return !!ACC.pinh;}
function touchAdmin(){
  ADMIN.expires=Date.now()+IDLE_MS;
  clearInterval(ADMIN.timer);
  ADMIN.timer=setInterval(()=>{
    if(!ADMIN.open)return clearInterval(ADMIN.timer);
    if(Date.now()>ADMIN.expires){lockAdmin();toast("Admin console locked itself");if(view==="home")render();}
  },15000);
}
function lockAdmin(quiet){

}

async function writeProfile(id,state){

};

/* ---- unlocking ---- */
function shakePin(){
  const w=document.querySelector(".gate-card")||document.querySelector(".pinrow input");
  if(w&&!RM()){w.style.animation="none";void w.offsetWidth;w.style.animation="shake .45s ease";setTimeout(()=>w.style.animation="",520);}
}
function coolingDown(){return ACC.lockUntil&&Date.now()<ACC.lockUntil;}
function adminUnlock(){
  if(coolingDown())return toast("Too many tries. Wait "+Math.ceil((ACC.lockUntil-Date.now())/1000)+"s.");
  const v=($("#pin")||{}).value||"";
  if(!hasPin()){
    const c=($("#pin2")||{}).value||"";
    if(!/^\d{4,8}$/.test(v)){shakePin();return toast("Use 4 to 8 digits");}
    if(v!==c){shakePin();return toast("The two PINs do not match");}
    ACC.pinh=pinHash(v);ACC.tries=0;delete ACC.pin;saveAccounts();
    ADMIN.open=true;toast("PIN set — write it down, it cannot be recovered");
  }else if(pinHash(v)===ACC.pinh){
    ACC.tries=0;delete ACC.lockUntil;saveAccounts();ADMIN.open=true;
  }else{
    ACC.tries=(ACC.tries||0)+1;
    if(ACC.tries>=5){ACC.lockUntil=Date.now()+60000;ACC.tries=0;saveAccounts();shakePin();render();go("admin");
      return toast("Too many tries. Locked for a minute.");}
    saveAccounts();shakePin();render();go("admin");
    return toast("That PIN does not match — "+(5-ACC.tries)+" tries left");
  }
  touchAdmin();loadRoster();render();go("admin");
}
function adminLock(){lockAdmin();render();go("admin");}
async function adminForgotPin(){

async function adminLinkTo(kidId){
  const parents=ACC.list.filter(a=>a.role==="parent");
  if(!parents.length)return toast("No parent profiles yet");
  const names=parents.map((p,i)=>(i+1)+". "+p.name).join("\n");
  const pick=prompt("Link this learner to which parent?\n"+names+"\n\nType a number, or 0 to unlink from all.");
  const n=Number(pick);
  if(isNaN(n))return;
  parents.forEach(p=>{p.kids=(p.kids||[]).filter(x=>x!==kidId);});
  if(n>=1&&n<=parents.length){parents[n-1].kids.push(kidId);toast("Linked to "+parents[n-1].name);}
  else toast("Unlinked");
  await saveAccounts();render();go("roles");
}

/* ============================================================
   FIRST RUN — three short steps, then straight into a real skill.
   Not a tour of buttons: a child who is shown where the nav is has
   learned the interface, not the app. Ending inside a lesson means
   the first thing they meet is the thing Yet is actually for.
   Skippable at every step, and reopenable from Profile.
   ============================================================ */
let tour=null;
const tourSeen=()=>!!st.tourDone||DEVICE_TOUR;
let DEVICE_TOUR=false;
function startTour(){tour={step:0,grade:st.grade||"3"};view="tour";render();window.scrollTo({top:0,behavior:"instant"});}
function tourNext(){
  if(!tour)return;
  if(tour.step===1){st.grade=tour.grade;save();}
  tour.step++;
  if(tour.step===TOUR_LAST){tourStartPractice();return;}
  render();window.scrollTo({top:0,behavior:"instant"});
}
const TOUR_STEPS=[
  {k:"tw1",em:"✦"},              /* welcome */
  {k:"tw2",em:"🎒",grade:true},  /* pick a grade */
  {k:"tw3",em:"📖"},             /* learn then practise */
  {k:"tw4",em:"🔥"},             /* streaks + mastery */
  {k:"tw5",em:"🗺️"}             /* paths, festivals, more */
];
const TOUR_LAST=TOUR_STEPS.length;   /* the step index that means "go practise" */

/* The last step is a real question, walked through gently: read the idea,
   pick an answer, see what happens — inside the tutorial, with a safety net. */
function tourStartPractice(){
  const g=tour?tour.grade:(st.grade||"3");
  const pool=SKILLS.filter(x=>String(x.grade)===String(g)&&LESSONS[x.gen]&&t(LESSONS[x.gen])!==LESSONS[x.gen]);
  const hasExample=x=>{const L=LESSONS[x.gen];if(!L)return false;const parts=String(t(L)).split("|");return parts.length>=2&&parts[1];};
  const sk=pool.find(x=>x.sub==="math"&&x.gen==="times"&&hasExample(x))
    ||pool.find(x=>x.sub==="math"&&hasExample(x))||pool.find(hasExample)||pool[0]||SKILLS[0];
  const q=makeGuided(sk);
  tour.practice={sk,q,phase:"lesson",tries:0};
  render();window.scrollTo({top:0,behavior:"instant"});
}
/* A gentle multiple-choice question, so a first-timer picks rather than types. */
function makeGuided(sk){
  let q,guard=0;
  do{q=G[sk.gen](sk.p,1);guard++;}while(guard<20&&!q.opts);
  if(!q.opts){                       /* fall back: build options around a typed answer */
    const a=Number(q.ans);
    if(!isNaN(a)){
      const opts=[...new Set([q.ans,String(a+1),String(a-1),String(a+2)])].slice(0,4);
      q.opts=shuffle(opts.length>=3?opts:[q.ans,String(a+1),String(a+2),String(a+3)]);
      delete q.input;
    }
  }
  return q;
}
function tourGuidedAnswer(choice){
  if(!tour||!tour.practice)return;
  const P=tour.practice; if(!P||P.phase!=="done"&&P.answered)return;
  const ok=String(choice)===String(P.q.ans);
  P.answered=true; P.right=ok; P.tries++;
  render();
}
function tourPractiseMore(){
  const P=tour.practice;
  if(typeof PAY_MODE!=="undefined"&&PAY_MODE&&!st.paid){
    endTour(); st._afterPay={id:P.sk.id};
    view="pay";render();window.scrollTo({top:0,behavior:"instant"});return;
  }
  endTour();
  st.taught[P.sk.id]=1;              /* they have seen this lesson now */
  startSkill(P.sk.id,true);          /* straight into the real skill, no lesson repeat */
}
function tourExplore(){
  if(typeof PAY_MODE!=="undefined"&&PAY_MODE&&!st.paid){
    endTour();view="pay";render();window.scrollTo({top:0,behavior:"instant"});return;
  }
  endTour();view="home";render();go("home");
}

const CHECKOUT_URL="https://qksijzzlwpcjismyvxcb.functions.supabase.co/create-checkout";
async function payDo(){
  /* If there is no backend wired yet (offline demo), fall back to the old
     instant unlock so the flow is still clickable. */
  if(typeof sb==="undefined"||!sb){ return payDemoUnlock(); }
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ toast(t("paySignInFirst")||"Sign in first"); return; }
    const r=await fetch(CHECKOUT_URL,{
      method:"POST",
      headers:{ "Authorization":"Bearer "+session.access_token, "Content-Type":"application/json" }
    });
    const j=await r.json();
    if(j.url){ location.href=j.url; }           /* off to Stripe's hosted page */
    else { toast(j.error||"Could not start checkout"); }
  }catch(e){ toast("Payment error: "+e.message); }
}

/* After returning from Stripe with ?paid=1, confirm and let them in. */
async function checkPaidReturn(){
  const u=new URL(location.href);
  if(u.searchParams.get("paid")!=="1")return;
  u.searchParams.delete("paid"); history.replaceState(null,"",u);
  if(typeof sb!=="undefined"&&sb){
    try{
      const { data:{ user } }=await sb.auth.getUser();
      if(user){
        const { data }=await sb.from("profiles").select("paid").eq("id",user.id).single();
        if(data&&data.paid){ st.paid=true; save(); }
      }
    }catch(e){}
  } else { st.paid=true; save(); }
  toast(t("payThanks")); view="home"; render(); go("home");
}

/* ============================================================
   LEARNING PATHS — an ordered route through a topic.
   789 tiles is a catalogue, not a curriculum. A path says what to
   do first, what comes next, and why. Each step unlocks when the
   one before it is properly under way, so a child is never guessing.
   Steps name GENERATORS, so a path survives skills being added.
   ============================================================ */
const PATHS=[
 {id:"p-mult", sub:"math", grade:"3", k:"pathMult",
  steps:["skipc","times","mulSize","multiples","factors"]},
 {id:"p-frac", sub:"math", grade:"4", k:"pathFrac",
  steps:["cmpHalf","fraccmp","fracsimp","fracaddlike","fracsub","fraccmpU"]},
 {id:"p-div", sub:"math", grade:"4", k:"pathDiv",
  steps:["divby","divRem","gcflcm","unitprice"]},
 {id:"p-dec", sub:"math", grade:"5", k:"pathDec",
  steps:["dec","deccmp","decround","frac2dec"]},
 {id:"p-pct", sub:"math", grade:"6", k:"pathPct",
  steps:["pctFrac","percentof","discount","tip","simpleint"]},
 {id:"p-geo", sub:"math", grade:"5", k:"pathGeo",
  steps:["perim","arearect","areatri","volume","circle"]},
 {id:"p-alg", sub:"math", grade:"7", k:"pathAlg",
  steps:["liketerms","onestepOp","twostep","distribute","inequality"]},
 {id:"p-int", sub:"math", grade:"6", k:"pathInt",
  steps:["intcmp","absval","intops","intmuldiv"]},
 {id:"p-code", sub:"code", grade:"5", k:"pathCode",
  steps:["boolExpr","loopCount","varTrace","binaryN"]},
 {id:"p-money", sub:"life", grade:"4", k:"pathMoney",
  steps:["coins","makeChange","splitBill","unitprice"]}
];
function pathSteps(pl){
  /* Resolve each generator to a real skill, preferring the learner's grade. */
  return pl.steps.map(gen=>{
    const all=SKILLS.filter(x=>x.gen===gen);
    if(!all.length)return null;
    const near=all.slice().sort((a,b)=>
      Math.abs(gradeNum(a.grade)-gradeNum(pl.grade))-Math.abs(gradeNum(b.grade)-gradeNum(pl.grade)));
    return near[0];
  }).filter(Boolean);
}
const gradeNum=g=>g==="K"?0:Number(g)||0;
function stepState(sk,i,steps){
  const done=(st.prog[sk.id]||0)>=10;          /* one level cleared counts as under way */
  const mastered=(st.prog[sk.id]||0)>=30;
  const prevOk=i===0||((st.prog[steps[i-1].id]||0)>=10);
  return mastered?"done":done?"open":prevOk?"open":"locked";
}
function pathProgress(steps){
  const done=steps.filter(s=>(st.prog[s.id]||0)>=30).length;
  return {done,total:steps.length,pct:Math.round(done/steps.length*100)};
}
/* ============================================================
   FESTIVALS — skills that come forward at the right time of year.
   They APPEAR during the festival and stay in the catalogue after.
   Nothing is ever taken away: a child who was ill that fortnight, or
   who hears about it in March, can still find it. Seasonal delight
   without "do it now or lose it" aimed at eight-year-olds.
   ============================================================ */
/* A date window, ignoring the year, so it works every year. Windows that
   cross new year (12-28 to 01-10) are handled by the OR branch. */
function festivalOn(f,d){
  const md=(d||new Date());
  const key=String(md.getMonth()+1).padStart(2,"0")+"-"+String(md.getDate()).padStart(2,"0");
  return f.from<=f.to ? (key>=f.from&&key<=f.to) : (key>=f.from||key<=f.to);
}
/* Festivals overlap in real life — Diwali and Día de Muertos share late
   October, and New Year sits inside the winter window. Showing only the
   first match meant Día de Muertos never appeared at all. Show them all,
   and tint with whichever is closest to its own middle day. */
function activeFestivals(d){
  if(FEST_PREVIEW==="__none")return [];
  if(FEST_PREVIEW){const f=FESTIVALS.find(x=>x.id===FEST_PREVIEW);return f?[f]:[];}
  return FESTIVALS.filter(f=>festivalOn(f,d));
}
function daysFromMiddle(f,d){
  const md=d||new Date(), y=md.getFullYear();
  const mk=(str,yy)=>new Date(yy,Number(str.slice(0,2))-1,Number(str.slice(3,5)));
  let a=mk(f.from,y), b=mk(f.to,y);
  if(b<a)b=mk(f.to,y+1);                       /* window crosses new year */
  const mid=new Date((a.getTime()+b.getTime())/2);
  let diff=Math.abs(md-mid);
  /* also compare against last year's window, for the wrap-around case */
  const a2=mk(f.from,y-1); let b2=mk(f.to,y-1);
  if(b2<a2)b2=mk(f.to,y);
  diff=Math.min(diff,Math.abs(md-new Date((a2.getTime()+b2.getTime())/2)));
  return diff/86400000;
}
function windowDays(f){
  const y=2026, mk=(str,yy)=>new Date(yy,Number(str.slice(0,2))-1,Number(str.slice(3,5)));
  let a=mk(f.from,y), b=mk(f.to,y);
  if(b<a)b=mk(f.to,y+1);
  return Math.round((b-a)/86400000)+1;
}
function activeFestival(d){
  const on=activeFestivals(d);
  if(!on.length)return null;
  /* Nearest to its own middle, and on a tie the narrower window wins: a
     10-day festival is a more precise claim on today than a month-long one.
     Without this, Día de Muertos never led, because Diwali shares its
     midpoint and simply came first in the list. */
  return on.slice().sort((x,y)=>{
    const dx=daysFromMiddle(x,d), dy=daysFromMiddle(y,d);
    if(Math.abs(dx-dy)>0.5)return dx-dy;
    return windowDays(x)-windowDays(y);
  })[0];
}
function previewFestival(id){
  FEST_PREVIEW=id||null;
  /* Put it in the address bar so a preview can be sent to someone else,
     or opened on a phone, without touching the clock. */
  try{
    const u=new URL(location.href);
    if(id)u.searchParams.set("fest",id); else u.searchParams.delete("fest");
    history.replaceState(null,"",u);
  }catch(e){}
  applyFestival();
  /* Show the result. Now that each nav item is its own page, previewing from
     the What's new page changed nothing the user could see — the festival look
     lives on Home and the Festivals page, so go where it is visible. */
  go(id?"festival":"home");
}
function festivalFromURL(){
  try{
    const v=new URL(location.href).searchParams.get("fest");
    if(v&&FESTIVALS.some(f=>f.id===v))FEST_PREVIEW=v;
    else if(v==="off")FEST_PREVIEW="__none";

}

/* The banner tints the app for the duration, using the same contrast-safe
   machinery as the colour sets, so nothing becomes unreadable. */
function applyFestival(){
  const root=document.documentElement;
  if(st.contrast==="high"){
    /* Keep the festival's identity — the emoji, the name, its skills — but
       drop the colour wash and the pattern, which are what make it unreadable. */
    ["--f1","--f2","--f3","--f4","--fest-ground","--punch","--zest","--aqua","--grape",
     "--on-punch","--on-zest","--on-aqua","--on-grape","--zest-ink","--punch-ink"]
      .forEach(v=>root.style.removeProperty(v));
    const f0=activeFestival();
    if(f0)root.dataset.fest=f0.id; else delete root.dataset.fest;
    return;
  }
  const f=activeFestival();
  ["--f1","--f2","--f3","--f4"].forEach(v=>root.style.removeProperty(v));
  /* Setting dataset.fest="" leaves the attribute in place, and [data-fest]
     matches on presence — so the hero's wedges stayed hidden forever once a
     festival had ended. Remove it outright. */
  if(f)root.dataset.fest=f.id; else delete root.dataset.fest;
  root.style.removeProperty("--fest-ground");
  if(!f){applyTheme();return;}   /* hand the palette back to the colour set */
  const L=FEST_LOOK[f.id];
  if(L)root.style.setProperty("--fest-ground",L.ground);
  const rgba=(hex,a)=>{const [r,g,b]=_srgb(hex);return "rgba("+r+","+g+","+b+","+a+")";};
  root.style.setProperty("--f1",rgba(f.colours[0],.55));
  root.style.setProperty("--f2",rgba(f.colours[1],.45));
  root.style.setProperty("--f3",rgba(f.colours[2],.45));
  root.style.setProperty("--f4",rgba(f.colours[3],.60));
  /* Run the festival palette through the same contrast machinery the colour
     sets use, so buttons, bars and chips change too — and stay readable. */
  if(skinName()==="kid"){
    const [p1,t1]=safePair(f.colours[0]);
    const [p2,t2]=safePair(f.colours[1]);
    const [p3,t3]=safePair(f.colours[2]);
    const [p4,t4]=safePair(f.colours[3]);
    root.style.setProperty("--punch",p1); root.style.setProperty("--on-punch",t1);
    root.style.setProperty("--zest",p2);  root.style.setProperty("--on-zest",t2);
    root.style.setProperty("--aqua",p3);  root.style.setProperty("--on-aqua",t3);
    root.style.setProperty("--grape",p4); root.style.setProperty("--on-grape",t4);
    const paper=getComputedStyle(root).getPropertyValue("--paper").trim()||"#F7F5FF";
    let pink=f.colours[0], ink=f.colours[1];
    for(let i=0;i<14&&contrastRatio(pink,paper)<4.5;i++)pink=mix(pink,_lum(paper)>0.5?0.85:1.15);
    for(let i=0;i<14&&contrastRatio(ink,paper)<4.5;i++)ink=mix(ink,_lum(paper)>0.5?0.85:1.15);
    root.style.setProperty("--punch-ink",pink);
    root.style.setProperty("--zest-ink",ink);
  }
}

   const [a,b,m]=base.map(x=>x*k);
   return{q:"What is the modulus of "+a+" + "+b+"i?",ans:String(m),input:1,
     hints:["|a + bi| = √(a² + b²)"],
     exp:"√("+(a*a)+" + "+(b*b)+") = √"+(a*a+b*b)+" = "+m+"."};},

     hints:["Bring the power down and subtract one from it."],
     exp:"d/dx("+a+"x^"+n+") = "+(a*n)+"x^"+(n-1)+"."};},

   const co=a/(n+1);
   const coS=co===1?"":Number.isInteger(co)?String(co):a+"/"+(n+1);

     ans:coS+"x^"+(n+1),input:1,
     hints:["Add one to the power, then divide by the new power."],
     exp:"∫"+a+"x^"+n+" dx = "+coS+"x^"+(n+1)+" + C."};},

   const v=a*k*k+b;
   const bs=b<0?" − "+Math.abs(b):" + "+b;
   return{q:"Evaluate lim(x→"+k+") of "+a+"x²"+bs+".",ans:String(v),input:1,
     hints:["A polynomial is continuous, so substitute directly."],
     exp:a+"("+k+")²"+bs+" = "+v+"."};},
 det2:()=>{const a=R(-6,6),b=R(-6,6),c=R(-6,6),d=R(-6,6);
   return{q:"Find the determinant of [["+a+", "+b+"], ["+c+", "+d+"]].",
     ans:String(a*d-b*c),input:1,hints:["ad − bc"],
     exp:"("+a+")("+d+") − ("+b+")("+c+") = "+(a*d-b*c)+"."};},
 dotProd:()=>{const a=R(-6,6),b=R(-6,6),c=R(-6,6),d=R(-6,6);

   let v=1;for(let i=0;i<k;i++)v*=(n-i);

let labIdx=0, labCode="", labOut="", labPass=false, labTicks=0;

/* Run kid code safely: a fresh Function scope, a print() that collects output,
   and a step counter injected into loops so an infinite loop can't freeze the tab. */
function labRun(){
  const ch=LAB_CHALLENGES[labIdx];
  const code=($("#labEditor")?$("#labEditor").value:labCode)||"";
  labCode=code;
  const lines=[];
  const print=(...a)=>{lines.push(a.map(x=>typeof x==="object"?JSON.stringify(x):String(x)).join(" "));};
  let err="";
  try{
    /* Loop guard: insert a tick() call as the FIRST statement inside every
       for/while body, so a never-ending loop throws instead of freezing. */
    let guarded=code.replace(/\b(for|while)\s*\(([^)]*)\)\s*\{/g,'$1($2){__t();');
    /* also handle brace-less single-line loops: for(...) stmt  ->  for(...){__t(); stmt} */
    guarded=guarded.replace(/\b(for|while)\s*\(([^)]*)\)\s*(?!\{)([^\n;]+)/g,'$1($2){__t();$3}');
    /* Sandbox: shadow every dangerous global with undefined so kid code
       cannot touch the page, network, storage or timers. */
    const BLOCK=["window","document","globalThis","self","top","parent","fetch",
      "XMLHttpRequest","localStorage","sessionStorage","indexedDB","location",
      "navigator","alert","Function","setTimeout","setInterval",
      "WebSocket","Worker","postMessage","history","cookie","st","sb","SKILLS","G","DEEPG"];
    const runner=new Function(...BLOCK,"print","__t",
      '"use strict";let __n=0;'+guarded);
    const tick=()=>{if(++labTicks>200000)throw new Error("Your code ran too long — is there a loop that never stops?");};
    labTicks=0;
    runner(...BLOCK.map(()=>undefined),print,tick);
  }catch(e){ err=e.message; }
  labOut = err ? ("⚠️ "+err) : (lines.length?lines.join("\n"):"(no output — did you use print?)");
  labPass = !err && ch.check(lines.join("\n"));
  paintLab();
}

  if(pyodide||pyLoading||pyFailed)return;

     which Pyodide needs. Give it a time limit so it can't hang forever, and
     fall back cleanly to JavaScript-only. */
  const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),25000));
  try{
    if(typeof WebAssembly==="undefined")throw new Error("no-wasm");
    if(!window.loadPyodide){
      await Promise.race([timeout,new Promise((res,rej)=>{
        const sc=document.createElement("script");
        sc.src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
        sc.onload=res; sc.onerror=()=>rej(new Error("load-failed"));

function makeQuestion(skill){
  const t=levelOf(skill.id);
  if(!sess)sess={recent:[]};
  if(!sess.recent)sess.recent=[];
  let q=null,best=null,guard=0;
  while(guard++<14){
    const c=G[skill.gen](skill.p,t);
    if(!c||c.skip)continue;
    best=best||c;
    if(!sess.recent.includes(c.q)){q=c;break;}
  }
  q=q||best||G[skill.gen](skill.p,t);
  cleanTraps(q);
  if(q.traps&&!q.opts&&q.traps.length>=2&&Math.random()<0.35){
    /* sometimes ask the same question as multiple choice, using the mistakes as the wrong options */
    q.opts=trapOpts(q.ans,q.traps,[]);
    if(q.opts.length>=3)delete q.input; else delete q.opts;
  }
  if(q.opts){                                    /* never show the same option twice */
    q.opts=[...new Set(q.opts.map(String))];
    if(!q.opts.includes(String(q.ans)))q.opts.push(String(q.ans));
    q.ans=String(q.ans);
  }
  sess.recent.push(q.q);
  if(sess.recent.length>QPL)sess.recent.shift();
  q.tier=t;return q;
}

function norm(v){return String(v).trim().toLowerCase().replace(/[\s$,]/g,"").replace(/^\+/,"").replace(/^0+(?=\d)/,"");}
function correctInput(given,want){
  if(norm(given)===norm(want))return true;
  const gn=Number(norm(given)),wn=Number(norm(want));
  if(!isNaN(gn)&&!isNaN(wn)&&Math.abs(gn-wn)<1e-9)return true;
  const f=s=>{const m=String(s).match(/^(-?\d+)\/(\d+)$/);return m?Number(m[1])/Number(m[2]):NaN;};
  const gf=f(norm(given)),wf=f(norm(want));
  if(!isNaN(gf)&&!isNaN(wf)&&Math.abs(gf-wf)<1e-9)return true;
  if(!isNaN(gf)&&!isNaN(wn)&&Math.abs(gf-wn)<1e-9)return true;
  return false;
}
function answer(idx){
  if(!sess||sess.answered)return;
  const q=sess.q,sk=sess.skill;
  let given,ok;
  if(q.opts){given=q.opts[Number(idx)];ok=given===q.ans;}
  else{const el=$("#ans");given=el?el.value:"";
    if(!given.trim()){toast("Type an answer first.");const w=document.querySelector(".entry");if(w&&!RM()){w.classList.remove("bad");void w.offsetWidth;w.classList.add("bad");}return;}
    ok=correctInput(given,q.ans);
    if(!ok){const w=document.querySelector(".entry");if(w&&!RM()){w.classList.remove("bad");void w.offsetWidth;w.classList.add("bad");}}}
  sess.answered=true;sess.asked++;st.asked++;
  st.secs+=Math.min(180,Math.round((Date.now()-(sess.qt||sess.t0))/1000));sess.qt=Date.now();
  const before=progOf(sk.id), beforeLvl=levelOf(sk.id);
  if(ok){
    sess.right++;st.right++;sess.run++;sess.best=Math.max(sess.best,sess.run);
    st.stats.bestRun=Math.max(st.stats.bestRun||0,sess.run);
    st.prog[sk.id]=Math.min(QTOTAL,before+1);
    addXP(6+q.tier*2+Math.min(6,sess.run));
    /* coins are no longer awarded per answer — they are earned for real
       progress (mastery, sets, streaks), so the shop stays a goal. */
    beep(true);sess.rot+=30;
  }else{
    sess.run=0;
    st.prog[sk.id]=Math.max(0,before-1);
    if(before>=QTOTAL&&st.due&&st.due[sk.id]){        /* a slip on review costs mastery */
      st.prog[sk.id]=QTOTAL-2;
      scheduleReview(sk.id,Math.max(0,(st.due[sk.id].box||0)-1));
    }
    beep(false);
    if(sess.lives!=null){
      sess.lives--;
      const lv=$("#lives");if(lv){lv.textContent="❤️".repeat(sess.lives)||"—";bump(lv);}
      if(sess.lives<=0)sess.dead=true;
    }
  }
  if(ok&&sess.mode==="review"&&progOf(sk.id)>=QTOTAL&&st.due&&st.due[sk.id])
    scheduleReview(sk.id,(st.due[sk.id].box||0)+1);   /* held on to it — push the next review out */
  markDay();noteSubject(sk.sub);award();save();BOARD=null;
  const after=progOf(sk.id), afterLvl=levelOf(sk.id);
  const mastered=before<QTOTAL&&after>=QTOTAL;
  if(mastered)JUST_MASTERED=sk.id;   /* the catalogue card lifts once */
  const levelled=!mastered&&afterLvl>beforeLvl;
  if(levelled){burst(40);st.coins+=5;toast(LEVEL_NAME()[afterLvl-1]+" — "+skillName(sk)+" (+5 coins)");}
  if(mastered){burst(80);st.coins+=40;checkWeek();st.week.mastered++;scheduleReview(sk.id,0);
    if(!sess.hintEver)st.stats.noHint=(st.stats.noHint||0)+1;
    toast(skillName(sk)+" is yours (+40 coins)");award();}
  save();
  paintVerdict(ok,q,given,after-before,mastered,levelled);
}

function useHint(){

  announce(shown[shown.length-1].replace(/<[^>]+>/g,""));

/* a ladder: a nudge, then a method, then the working — never the answer */
function hintSteps(q){
  const out=[];
  if(q.hints&&q.hints.length)out.push(...q.hints.map(esc));
  if(q.opts){
    const wrong=q.opts.filter(o=>o!==q.ans);
    if(wrong.length>1)out.push(t("hintRuleOut",{a:esc(P(wrong))}));
    if(wrong.length>2)out.push(t("hintNarrow",{a:esc(q.ans),b:esc(P(wrong.filter(w=>w!==out[out.length-1])))}));
  }
  const exp=String(q.exp||"").split(/(?<=\.)\s+/).filter(Boolean);
  if(exp.length>1)out.push(esc(exp[0]));
  else if(exp.length===1&&!q.opts)out.push(t("hintMethod"));
  return out.slice(0,3);
}

function recommend(n){
  const g=st.grade==="all"?null:st.grade;

  const started=pool.filter(s=>scoreOf(s.id)>0&&scoreOf(s.id)<100).sort((a,b)=>scoreOf(a.id)-scoreOf(b.id));

}

/* Colour maths. A guessed luminance threshold is not good enough here: a
   colour set that makes its own buttons unreadable is worse than none. So we
   compute the real contrast ratio, and if a colour cannot carry either black
   or white text at 4.5:1, we darken it until it can. */
function _srgb(hex){
  const h=String(hex).replace("#","");
  const n=h.length===3?h.split("").map(c=>c+c).join(""):h;
  return [0,2,4].map(i=>parseInt(n.slice(i,i+2),16));
}
function _lum(hex){
  const [r,g,b]=_srgb(hex).map(v=>v/255)
    .map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));
  return .2126*r+.7152*g+.0722*b;
}
function contrastRatio(a,b){
  const l1=_lum(a),l2=_lum(b);
  return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);
}
function mix(hex,f){                       /* f<1 darkens, f>1 lightens toward white */
  const p=_srgb(hex).map(v=>f<=1?Math.round(v*f):Math.round(v+(255-v)*(f-1)));
  return "#"+p.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("");
}
/* Returns [background, textColour] that pass 4.5:1, nudging the background if
   it has to. */
function safePair(hex){
  const INK="#1B1042", WHITE="#FFFFFF";
  let bg=hex;
  for(let i=0;i<14;i++){
    const onWhite=contrastRatio(bg,WHITE), onInk=contrastRatio(bg,INK);
    if(onWhite>=4.5)return [bg,WHITE];
    if(onInk>=4.5)return [bg,INK];
    bg=mix(bg,0.88);                       /* too muddy for either — darken a step */
  }
  return [bg,WHITE];
}
/* Retints the learner interface. Parent and admin keep their own palettes —
   a child's colour choice should not repaint a grown-up's dashboard. */
function applyTheme(){
  const root=document.documentElement;
  /* Someone who asked for high contrast has asked for it. A colour set is
     decoration and must not quietly undo it. */
  if(st.contrast==="high"){
    ["--punch","--zest","--aqua","--grape","--on-punch","--on-zest","--on-aqua","--on-grape",
     "--zest-ink","--punch-ink","--w1","--w2","--w3","--w4"].forEach(v=>root.style.removeProperty(v));
    return;
  }
  ["--punch","--zest","--aqua","--grape","--on-punch","--on-zest","--on-aqua","--on-grape","--zest-ink","--punch-ink","--w1","--w2","--w3","--w4"]
    .forEach(v=>root.style.removeProperty(v));
  const th=THEMES[st.theme];
  if(!th||st.theme==="aurora"||skinName()!=="kid")return;   /* aurora is the built-in palette */
  const [p1,t1]=safePair(th.c[0]);
  const [p2,t2]=safePair(th.c[1]);
  const [p3,t3]=safePair(th.c[2]);
  root.style.setProperty("--punch",p1);
  root.style.setProperty("--zest",p2);
  root.style.setProperty("--aqua",p3);
  root.style.setProperty("--on-punch",t1);
  root.style.setProperty("--on-zest",t2);
  root.style.setProperty("--on-aqua",t3);
  const [p4,t4]=safePair(th.c[3]);
  root.style.setProperty("--grape",p4);
  root.style.setProperty("--on-grape",t4);
  /* --zest-ink is that colour used as TEXT on the page background, so it needs
     to pass against paper, not against itself. */
  let ink=th.c[1];
  const paper=getComputedStyle(root).getPropertyValue("--paper").trim()||"#F7F5FF";
  for(let i=0;i<14&&contrastRatio(ink,paper)<4.5;i++)ink=mix(ink, _lum(paper)>0.5?0.85:1.15);
  root.style.setProperty("--zest-ink",ink);
  /* --punch used as TEXT needs the same treatment */
  let pink=th.c[0];
  for(let i=0;i<14&&contrastRatio(pink,paper)<4.5;i++)pink=mix(pink,_lum(paper)>0.5?0.85:1.15);
  root.style.setProperty("--punch-ink",pink);
  /* the hero wedges, translucent so they read as light on the dark hero */
  const rgba=(hex,a)=>{const [r,g,b]=_srgb(hex);return "rgba("+r+","+g+","+b+","+a+")";};
  root.style.setProperty("--w1",rgba(th.c[0],.50));
  root.style.setProperty("--w2",rgba(th.c[2],.45));
  root.style.setProperty("--w3",rgba(th.c[1],.45));
  root.style.setProperty("--w4",rgba(th.c[3],.60));
}

/* Reads each learner profile's stored state. On a device build that is every
   profile; with the cloud backend the security policies return nothing for
   other people's rows, so the board quietly narrows to you. Either way it is
   real data, never invented. */
async function loadBoard(){
  if(boardBusy)return; boardBusy=true;
  const kids=ACC.list.filter(a=>(a.role||"kid")==="kid");
  const out=[];
  for(const a of kids){
    if(a.id===ACC.active){out.push({id:a.id,n:a.name,em:st.avatar||a.avatar||"🦊",x:weeklyXPfrom(st),you:true});continue;}
    try{

      out.push({id:a.id,n:a.name,em:a.avatar||"🦊",x:weeklyXPfrom(other),you:false});
    }catch(e){ /* not visible to us — leave them off the board */ }

  boardBusy=false;

}

    </div>
    ${SOLO?"":`<div class="panel" style="margin-top:20px"><h3 class="ph">${t("grownupQ")}</h3>
      <p style="color:var(--muted);margin-bottom:12px">${t("grownupBlurb")}</p>
      <button class="btn btn-sm btn-punch" onclick="go('accounts')">${t("signInGrownup")}</button>
    </div>`}
    <div class="panel" style="margin-top:20px"><h3 class="ph">${t("resetT")}</h3>
      <p style="color:var(--muted);margin-bottom:12px">${t("resetBlurb")}</p>
      <button class="btn btn-sm" onclick="resetAll()">${t("eraseAll")}</button>
    </div>
  </section>`;
}
function resetAll(){
  if(!confirm("Erase all progress on this device? This cannot be undone."))return;
  st=clone(DEFAULT);save();render();window.scrollTo({top:0});toast("Progress erased");
}

/* ============================================================
   8. INPUT + BOOT
   ============================================================ */
function toggleSound(){st.sound=!st.sound;save();hud();toast(st.sound?"Sound on":"Sound off");}
function toggleContrast(){
  st.contrast=st.contrast==="high"?"normal":"high";
  /* Accessibility settings belong to the device, not to an account: someone who
     needs high contrast needs it on the sign-in screen, before they have one. */
  DEVICE_CONTRAST=st.contrast;
  try{STORE.set("yet:contrast",st.contrast);}catch(e){}
  if(ACC.active)save();
  applyContrast();applyTheme();applyFestival();render();
  toast(st.contrast==="high"?t("contrastOn"):t("contrastOff"));
}
function applyContrast(){
  if(st.contrast==="high")document.documentElement.dataset.contrast="high";
  else delete document.documentElement.dataset.contrast;
}
function toggleTheme(){st.night=!st.night;save();hud();}
document.addEventListener("keydown",e=>{
  if(view!=="practice"||!sess)return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(e.key==="Enter"){
    if(sess.answered){e.preventDefault();nextQ();}
    else if(tag==="input"){e.preventDefault();answer(null);}
    return;
  }
  if(tag==="input")return;
  if(/^[1-4]$/.test(e.key)&&sess.q.opts&&!sess.answered){
    const i=Number(e.key)-1;
    if(i<sess.q.opts.length){e.preventDefault();answer(String(i));}
  }
});
(async function boot(){
  await loadAccounts();
  // sanity check: every skill must resolve to a working generator
  const broken=SKILLS.filter(s=>!G[s.gen]||(s.gen==="bank"&&!B[s.p.b]));
  if(broken.length)console.warn("Unmapped skills:",broken.map(s=>s.id));
  if(SOLO&&ACC.active){const a=ACC.list.find(x=>x.id===ACC.active);if(!a||(a.role||"kid")!==BUILD)ACC.active=null;}
  if(ACC.active&&ACC.list.some(a=>a.id===ACC.active)){await loadState(ACC.active);armIdle();}
  else{ACC.active=null;st=clone(DEFAULT);}
  try{const l=await STORE.get("yet:lang");if(l&&l.value&&I18N[l.value])LANG=l.value;}catch(e){}
  try{const c=await STORE.get("yet:contrast");if(c&&c.value){DEVICE_CONTRAST=c.value;st.contrast=c.value;}}catch(e){}
  try{const u=await STORE.get("yet:seenUpdate");if(u&&u.value){DEVICE_SEEN=u.value;st.seenUpdate=u.value;}}catch(e){}
  try{const w=await STORE.get("yet:tour");if(w&&w.value)DEVICE_TOUR=true;}catch(e){}
  applyContrast();
  if(st.lang&&I18N[st.lang])LANG=st.lang;
  applyLang();
  if(STORE.kind==="memory")setTimeout(()=>toast(t("noStore")),1400);
  const er=entryRole();
  const wants=r=>r&&!SOLO&&r!==roleOf();      /* already that role? just carry on */
  if(wants(er)){gate.only=er;gate.role=er;checkWeek();hud();view="accounts";render();}
  else if(!tourSeen()){checkWeek();hud();startTour();}
  else{checkWeek();hud();BOARD=null;if(ACC.active)loadBoard();go("home");}
  setTimeout(()=>{booted=true;},600);
  window.addEventListener("hashchange",()=>{
    const r=entryRole();
    if(wants(r))setEntry(r);
  });
})();
</script>
